<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Décision partagée · Cœur Net</title>
<style>
/* Cœur Net — socle commun
   Barre supérieure collante, contenu centré (max 1240px), grilles qui passent en une colonne sur téléphone,
   barre d'onglets en bas sur téléphone. Propriétés logiques partout : l'arabe (RTL) se retourne tout seul. */
:root{
  --bg:#f3f6f9; --surface:#ffffff; --surface-2:#f0f4f8; --surface-3:#e3e9ef;
  --line:#dde4eb; --line-strong:#c3cdd7;
  --fg:#0f1d2b; --fg-2:#2d3e50; --muted:#5b6b7b;
  --accent:#0b6e99; --accent-hover:#085a7e; --accent-ink:#ffffff; --accent-soft:#e2f0f6;
  --heart:#d64545; --heart-soft:#fde9e9;
  --ok:#137a4b; --ok-soft:#e2f4ea; --warn:#975a00; --warn-soft:#fdf1dc;
  --crit:#b42318; --crit-soft:#fde7e5; --info:#1d5ea8; --info-soft:#e4eefa;
  --g-echo:#0b6e99; --g-patient:#7a4bc4; --g-calc:#137a4b; --g-learn:#c26a00;
  --paper:#fff8f6; --grid-minor:#f5cfcf; --grid-major:#e59a9a; --trace:#1a1a1a;
  --shadow:0 1px 2px rgba(15,29,43,.05);
  --shadow-md:0 4px 14px rgba(15,29,43,.08);
  --shadow-lg:0 12px 36px rgba(15,29,43,.16);
  --font:"Segoe UI Variable Text","Segoe UI",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Roboto,Arial,sans-serif;
  --font-display:"Segoe UI Variable Display","Segoe UI",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Roboto,Arial,sans-serif;
  --font-ar:"Segoe UI","SF Arabic","Geeza Pro","Noto Sans Arabic","Noto Naskh Arabic",Tahoma,sans-serif;
  --mono:ui-monospace,"Cascadia Mono","SF Mono",Consolas,Menlo,monospace;
  --r:10px; --r-sm:8px; --r-lg:14px;
  --tabbar-h:0px;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0e1114; --surface:#161a1f; --surface-2:#1d2228; --surface-3:#272d35;
  --line:#2a3139; --line-strong:#3a434e;
  --fg:#e9ebee; --fg-2:#c9ced5; --muted:#9aa3ae;
  --accent:#4fb3dd; --accent-hover:#72c4e6; --accent-ink:#04202d; --accent-soft:#11303d;
  --heart:#ff7a7a; --heart-soft:#3a1717;
  --ok:#4fc68b; --ok-soft:#132d20; --warn:#f0a73c; --warn-soft:#33250f;
  --crit:#ff6d62; --crit-soft:#3a1714; --info:#6ea9f0; --info-soft:#13263c;
  --g-echo:#4fb3dd; --g-patient:#b08ef0; --g-calc:#4fc68b; --g-learn:#f0a73c;
  --paper:#1a1416; --grid-minor:#3b2529; --grid-major:#663840; --trace:#f3eeee;
  --shadow:0 1px 2px rgba(0,0,0,.4);
  --shadow-md:0 4px 14px rgba(0,0,0,.4);
  --shadow-lg:0 12px 36px rgba(0,0,0,.6);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased;overflow-x:hidden}
html[lang="ar"] body{font-family:var(--font-ar);font-size:15.5px;line-height:1.65}
html[lang="ar"] h1,html[lang="ar"] h2,html[lang="ar"] h3,html[lang="ar"] h4{font-family:var(--font-ar);letter-spacing:0}
html[lang="ar"] .eyebrow{letter-spacing:0;text-transform:none;font-size:.78rem}
body.noscroll{overflow:hidden}
h1,h2,h3,h4{font-family:var(--font-display);line-height:1.2;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.6rem;font-weight:650} h2{font-size:1.2rem;font-weight:650} h3{font-size:1.02rem;font-weight:650} h4{font-size:.92rem;font-weight:650}
p{margin:0}
a{color:var(--info)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.num,.tnum{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}
.small{font-size:.84rem}
.xs{font-size:.76rem}
.eyebrow{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.ltr{direction:ltr;unicode-bidi:isolate}
.ar,[lang="ar"] .ar{font-family:var(--font-ar)}

/* Barre supérieure */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
.cs-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line)}
.cs-top-in{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:10px;min-height:58px;padding-block:8px;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
.cs-back{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding-block:6px;padding-inline:9px 12px;cursor:pointer;font-size:.86rem;color:var(--fg-2);text-decoration:none;white-space:nowrap}
.cs-back:hover{border-color:var(--line-strong);color:var(--fg)}
.cs-back svg{width:16px;height:16px;flex:none}
[dir="rtl"] .cs-back svg,[dir="rtl"] .flip-rtl{transform:scaleX(-1)}
.cs-brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1;text-decoration:none;color:inherit}
.cs-logo{width:32px;height:32px;flex:none;border-radius:9px;background:linear-gradient(140deg,#e25555,#b8233a);display:grid;place-items:center;box-shadow:0 2px 6px rgba(184,35,58,.3)}
.cs-logo svg{width:20px;height:20px}
.cs-titles{min-width:0}
.cs-titles .eyebrow{display:block;line-height:1.15}
.cs-titles h1{font-size:1.06rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cs-actions{display:flex;align-items:center;gap:6px;flex:none}
.cs-doc{font-size:.8rem;color:var(--muted);white-space:nowrap;max-width:180px;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:38px;height:38px;border-radius:999px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--fg-2);flex:none;font-weight:700;font-size:.92rem;padding:0}
.icon-btn:hover{border-color:var(--line-strong);color:var(--fg)}
.icon-btn svg{width:18px;height:18px}
.cs-lang{font-family:var(--font-ar)}
@media (max-width:720px){
  .hide-sm{display:none!important}
  .cs-back span{display:none}
  .cs-back{padding:7px}
  .cs-top-in{gap:8px;min-height:54px}
  .cs-titles h1{font-size:1rem}
  .cs-actions .btn:not(.icon-btn){min-height:38px;padding:6px 10px}
}

/* Barre d'onglets du bas (téléphone) */
.cs-tabbar{display:none}
@media (max-width:720px){
  body.has-tabbar{--tabbar-h:calc(62px + env(safe-area-inset-bottom,0px));padding-bottom:var(--tabbar-h)}
  .cs-tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;inset:auto 0 0;z-index:55;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
  .cs-tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:62px;border:0;background:none;color:var(--muted);text-decoration:none;font-size:.7rem;font-weight:600;cursor:pointer;padding:0}
  .cs-tab .ic svg{width:23px;height:23px;display:block}
  .cs-tab.on{color:var(--accent)}
  .cs-tab.on .ic{background:var(--accent-soft);border-radius:999px;padding:2px 14px}
}

/* Contenu */
.wrap{max-width:1240px;margin:0 auto;padding-block:20px 28px;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.between{justify-content:space-between}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:900px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:620px){.g2,.g3,.g4{grid-template-columns:minmax(0,1fr)}}
.split{display:grid;grid-template-columns:260px minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:860px){.split{grid-template-columns:minmax(0,1fr)}}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;box-shadow:var(--shadow);min-width:0}
.card.flat{box-shadow:none}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.panel{background:var(--surface-2);border-radius:var(--r);padding:12px 14px}
.divider{height:1px;background:var(--line);margin:4px 0}

/* Champs */
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label,.lbl{font-size:.82rem;font-weight:600;color:var(--fg-2)}
.field .hint{font-size:.75rem;color:var(--muted)}
.inp,select.inp,textarea.inp{width:100%;min-height:44px;border:1px solid var(--line-strong);background:var(--surface);border-radius:var(--r-sm);padding:8px 11px;font-size:1rem}
textarea.inp{min-height:84px;resize:vertical;line-height:1.45}
.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.inp-unit{display:flex;align-items:stretch}
.inp-unit .inp{border-start-end-radius:0;border-end-end-radius:0;min-width:0}
.inp-unit .u{display:flex;align-items:center;padding:0 10px;border:1px solid var(--line-strong);border-inline-start:0;border-start-end-radius:var(--r-sm);border-end-end-radius:var(--r-sm);background:var(--surface-2);font-size:.8rem;color:var(--muted);white-space:nowrap;direction:ltr}
.inp.bad{border-color:var(--crit);box-shadow:0 0 0 3px var(--crit-soft)}
input[inputmode="decimal"],input[type="number"]{direction:ltr;text-align:start}
[dir="rtl"] input[inputmode="decimal"]{text-align:right}

/* Contrôle segmenté */
.seg{display:inline-flex;flex-wrap:wrap;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:3px;gap:3px}
.seg button{border:0;background:transparent;padding:7px 12px;border-radius:6px;cursor:pointer;font-size:.88rem;color:var(--fg-2);min-height:38px}
.seg button:hover{color:var(--fg)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--accent);box-shadow:0 0 0 1px var(--line-strong),0 1px 3px rgba(0,0,0,.06);font-weight:650}
.seg.full{display:flex;flex-wrap:nowrap}.seg.full button{flex:1 1 0;min-width:0;padding:7px 6px;line-height:1.2}

/* Puces de sélection (profil patient) */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:8px 14px;min-height:40px;cursor:pointer;font-size:.9rem;color:var(--fg-2);transition:background .15s,border-color .15s,color .15s}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.chip .ck{width:16px;height:16px;display:none}
.chip[aria-pressed="true"] .ck{display:block}

/* Bascule oui/non (grande cible tactile) */
.tog{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);cursor:pointer;user-select:none;min-height:48px;transition:border-color .15s,background .15s}
.tog:hover{border-color:var(--line-strong)}
.tog input{position:absolute;opacity:0;pointer-events:none}
.tog .sw{flex:none;width:38px;height:22px;border-radius:999px;background:var(--surface-3);position:relative;transition:background .15s}
.tog .sw::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:16px;height:16px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.tog input:checked+.sw{background:var(--accent)}
.tog input:checked+.sw::after{transform:translateX(16px)}
[dir="rtl"] .tog input:checked+.sw::after{transform:translateX(-16px)}
.tog input:focus-visible+.sw{outline:2px solid var(--accent);outline-offset:2px}
.tog .t{flex:1;min-width:0;font-size:.92rem;line-height:1.3}
.tog .t small{display:block;color:var(--muted);font-size:.76rem}
.tog .pts{font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.tog:has(input:checked){border-color:color-mix(in srgb,var(--accent) 45%,var(--line));background:color-mix(in srgb,var(--accent-soft) 55%,var(--surface))}

/* Case à cocher simple */
.chk{display:flex;gap:9px;align-items:flex-start;cursor:pointer;font-size:.92rem;line-height:1.35;padding:4px 0}
.chk input{width:18px;height:18px;margin:1px 0 0;accent-color:var(--accent);flex:none}

/* Boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line-strong);background:var(--surface);color:var(--fg);border-radius:var(--r-sm);padding:8px 14px;min-height:44px;cursor:pointer;font-size:.9rem;font-weight:600;text-decoration:none;text-align:center;line-height:1.2;transition:background .15s,border-color .15s,transform .1s}
.btn:active{transform:scale(.98)}
.btn:hover{background:var(--surface-2)}
.btn svg{width:16px;height:16px;flex:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{min-height:34px;padding:5px 11px;font-size:.84rem}
.btn.danger{color:var(--crit)}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* Badges et résultats */
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:.76rem;font-weight:600;white-space:nowrap;background:var(--surface-3);color:var(--fg-2)}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.crit{background:var(--crit-soft);color:var(--crit)}
.badge.info{background:var(--info-soft);color:var(--info)}
.badge.acc{background:var(--accent-soft);color:var(--accent)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}
.result{border-radius:var(--r-lg);padding:16px;border:1px solid var(--line);background:var(--surface-2);position:relative;overflow:hidden}
.result::before{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:4px;background:var(--muted)}
.result.ok::before{background:var(--ok)} .result.warn::before{background:var(--warn)} .result.crit::before{background:var(--crit)} .result.info::before{background:var(--info)}
.result .big{font-family:var(--font-display);font-size:2.4rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.result .big small{font-size:1rem;font-weight:500;color:var(--muted);margin-inline-start:4px}
.result.ok .big{color:var(--ok)} .result.warn .big{color:var(--warn)} .result.crit .big{color:var(--crit)} .result.info .big{color:var(--info)}
.cls{display:inline-block;font-size:.72rem;font-weight:700;padding:1px 7px;border-radius:4px;font-family:var(--mono)}
.cls.I{background:var(--ok-soft);color:var(--ok)} .cls.IIa{background:var(--info-soft);color:var(--info)} .cls.IIb{background:var(--warn-soft);color:var(--warn)} .cls.III{background:var(--crit-soft);color:var(--crit)}

/* Tableaux */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
table.tbl{width:100%;border-collapse:collapse;font-size:.88rem}
.tbl th,.tbl td{padding:8px 10px;text-align:start;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{background:var(--surface-2);font-weight:600;font-size:.78rem;color:var(--fg-2);white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tbl td.n,.tbl th.n{text-align:end;font-variant-numeric:tabular-nums}

/* Onglets */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;color:var(--muted);font-weight:550;font-size:.92rem;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button:hover{color:var(--fg)}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}

/* Liste latérale */
.navlist{display:flex;flex-direction:column;gap:2px}
.navlist .grp{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:650;padding:12px 10px 4px}
.navlist button{display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:start;border:0;background:none;padding:9px 10px;border-radius:var(--r-sm);cursor:pointer;color:var(--fg-2);font-size:.9rem}
.navlist button:hover{background:var(--surface-2);color:var(--fg)}
.navlist button[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}

/* Pied de page */
.cs-foot{border-top:1px solid var(--line);margin-top:10px}
.cs-foot-in{max-width:1240px;margin:0 auto;padding-block:14px 22px;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:6px;font-size:.76rem;color:var(--muted)}
.cs-foot strong{color:var(--fg-2);font-weight:600}

/* Toast */
.cs-toast{position:fixed;left:50%;bottom:calc(20px + var(--tabbar-h));transform:translateX(-50%) translateY(20px);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:.88rem;box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:120;max-width:calc(100% - 32px)}
.cs-toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* Fenêtre modale ; « sheet » = feuille qui monte du bas sur téléphone */
.modal-bg{position:fixed;inset:0;background:rgba(10,12,16,.45);z-index:90;display:grid;place-items:center;padding:16px;animation:fadeIn .15s ease}
.modal{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow-lg);width:min(560px,100%);max-height:calc(100dvh - 32px);overflow:auto;padding:18px;border:1px solid var(--line);overscroll-behavior:contain}
@media (max-width:720px){
  .modal-bg.sheet{place-items:end stretch;padding:0}
  .modal-bg.sheet .modal{width:100%;border-radius:20px 20px 0 0;max-height:88dvh;padding:10px 18px calc(18px + env(safe-area-inset-bottom,0px));animation:sheetUp .25s cubic-bezier(.2,.8,.2,1)}
  .modal-bg.sheet .modal::before{content:"";display:block;width:40px;height:4px;border-radius:4px;background:var(--line-strong);margin:0 auto 10px}
}
@keyframes fadeIn{from{opacity:0}}
@keyframes sheetUp{from{transform:translateY(100%)}}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:4px 0}
.set-l{min-width:0;flex:1 1 180px}
.set-t{font-weight:600;font-size:.94rem}

/* Menu des outils (feuille) */
.tm-list{display:flex;flex-direction:column;gap:4px}
.tm-grp{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:10px 4px 2px}
.tm-item{display:flex;gap:12px;align-items:center;padding:10px;border-radius:var(--r);text-decoration:none;color:var(--fg)}
.tm-item:hover,.tm-item.on{background:var(--surface-2)}
.tm-ic{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;flex:none;color:#fff;background:var(--g,var(--accent))}
.tm-ic svg{width:22px;height:22px}
.tm-tx{display:flex;flex-direction:column;min-width:0}
.g-echo{--g:var(--g-echo)} .g-patient{--g:var(--g-patient)} .g-calc{--g:var(--g-calc)} .g-learn{--g:var(--g-learn)}

/* Visite guidée */
.tour-mask{position:fixed;inset:0;z-index:200;pointer-events:auto}
.tour-hole{position:fixed;z-index:201;border-radius:12px;box-shadow:0 0 0 9999px rgba(8,14,22,.58);transition:all .3s cubic-bezier(.2,.8,.2,1);pointer-events:none;outline:2px solid var(--accent);outline-offset:3px}

  /* ---------- Toast, copier, télécharger ---------- */
  var toastEl, toastT;
  function toast(msg){
    if(!toastEl){ toastEl = h('div', {class:'cs-toast', role:'status', 'aria-live':'polite'}); document.body.appendChild(toastEl); }
    toastEl.textContent = t(msg); toastEl.classList.add('on');
    clearTimeout(toastT); toastT = setTimeout(function(){ toastEl.classList.remove('on'); }, 2400);
  }
  function copy(text, okMsg){
    var ok1 = okMsg || {fr:'Copié dans le presse-papiers', ar:'تم النسخ'};
    function fallback(){
      var ta = h('textarea', {style:{position:'fixed', left:'-9999px', top:'0'}}); ta.value = text; document.body.appendChild(ta);
      ta.select(); var ok = false; try{ ok = document.execCommand('copy'); }catch(e){}
      ta.remove(); toast(ok ? ok1 : {fr:'Copie impossible : sélectionnez le texte à la main', ar:'تعذّر النسخ: حدِّد النص يدويًا'});
    }
    try{
      if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function(){ toast(ok1); }, fallback);
      else fallback();
    }catch(e){ fallback(); }
  }
  function download(name, content, mime){
    try{
      var blob = new Blob([content], {type:(mime || 'text/plain') + ';charset=utf-8'});
      var a = h('a', {href:URL.createObjectURL(blob), download:name}); document.body.appendChild(a); a.click();
      setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 500);
      toast({fr:'Fichier « ' + name + ' » enregistré', ar:'تم حفظ الملف « ' + name + ' »'});
    }catch(e){ toast({fr:'Téléchargement impossible ici', ar:'التنزيل غير ممكن هنا'}); }
  }
  function toCSV(rows, cols){
    var sep = ';';
    function cell(v){ v = v == null ? '' : String(v); return /[;"\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
    var out = [cols.map(function(c){ return cell(c.label || c.key); }).join(sep)];
    rows.forEach(function(r){ out.push(cols.map(function(c){ return cell(typeof c.get === 'function' ? c.get(r) : r[c.key]); }).join(sep)); });
    return '﻿' + out.join('\r\n');
  }

  /* ---------- Sauvegarde : exporter / importer toutes les données de cet appareil ---------- */
  function exportBackup(){
    var data = {};
    store.keys().forEach(function(k){ data[k] = store.get(k); });
    var payload = {app:'coeur-net', schema:SCHEMA, date:new Date().toISOString(), data:data};
    download('coeur-net-sauvegarde-' + todayISO() + '.json', JSON.stringify(payload, null, 1), 'application/json');
  }
  function applyBackup(p){
    if(!p || p.app !== 'coeur-net' || !p.data || typeof p.data !== 'object') return false;
    store.keys().forEach(function(k){ store.del(k); });
    Object.keys(p.data).forEach(function(k){ store.set(k, p.data[k]); });
    return true;
  }
  function importBackup(){
    var inp = h('input', {type:'file', accept:'application/json,.json', style:{display:'none'}});
    inp.addEventListener('change', function(){
      var f = inp.files && inp.files[0]; if(!f) return;
      var r = new FileReader();
      r.onload = function(){
        var p; try{ p = JSON.parse(r.result); }catch(e){ p = null; }
        if(!p || p.app !== 'coeur-net'){ toast({fr:'Ce fichier n’est pas une sauvegarde Cœur Net', ar:'هذا الملف ليس نسخة احتياطية من Cœur Net'}); return; }
        ask({fr:'Remplacer les données de cet appareil par la sauvegarde du ' + frDate(p.date) + ' ?', ar:'استبدال بيانات هذا الجهاز بالنسخة الاحتياطية بتاريخ ' + frDate(p.date) + '؟'}, {fr:'Remplacer', ar:'استبدال'}).then(function(ok){
          if(ok && applyBackup(p)) location.reload();
        });
      };
      r.readAsText(f);
    });
    document.body.appendChild(inp); inp.click(); setTimeout(function(){ inp.remove(); }, 60000);
  }

  /* ---------- Modale (remplace confirm/prompt) ; feuille du bas sur téléphone ---------- */
  function modal(content, opts){
    opts = opts || {};
    var bg = h('div', {class:'modal-bg' + (opts.sheet ? ' sheet' : ''), role:'dialog', 'aria-modal':'true'});
    var box = h('div', {class:'modal'}, content);
    bg.appendChild(box);
    var prev = document.activeElement;
    function close(){ bg.remove(); document.removeEventListener('keydown', onKey); if(!$('.modal-bg')) document.body.classList.remove('noscroll'); if(prev && prev.focus) try{ prev.focus(); }catch(e){} if(opts.onClose) opts.onClose(); }
    function onKey(e){ if(e.key === 'Escape') close(); }
    bg.addEventListener('click', function(e){ if(e.target === bg) close(); });
    document.addEventListener('keydown', onKey);
    document.body.appendChild(bg); document.body.classList.add('noscroll');
    var f = box.querySelector('[autofocus],input,select,textarea,button.primary'); if(f && !opts.noFocus) setTimeout(function(){ f.focus(); }, 30);
    return {close:close, el:box};
  }
  function ask(message, okLabel){
    return new Promise(function(res){
      var m, done = false;
      function fin(v){ if(done) return; done = true; res(v); }
      var content = h('div', {class:'stack'},
        h('p', {text:message}),
        h('div', {class:'row end'},
          h('button', {class:'btn', text:{fr:'Annuler', ar:'إلغاء'}, onclick:function(){ fin(false); m.close(); }}),
          h('button', {class:'btn primary', text:okLabel || {fr:'Confirmer', ar:'تأكيد'}, onclick:function(){ fin(true); m.close(); }})
        ));
      m = modal(content, {onClose:function(){ fin(false); }});
    });
  }

  /* ---------- Contrôles segmentés ---------- */
  function seg(el, value, onChange){
    var btns = $$('button', el);
    function set(v, silent){
      value = v;
      btns.forEach(function(b){ b.setAttribute('aria-pressed', b.dataset.v === String(v) ? 'true' : 'false'); });
      if(!silent && onChange) onChange(v);
    }
    btns.forEach(function(b){ b.type = 'button'; b.addEventListener('click', function(){ set(b.dataset.v); }); });
    set(value, true);
    return {get:function(){ return value; }, set:set};
  }

  function recordRecent(id){

    st.recent = [id].concat((st.recent || []).filter(function(x){ return x !== id; })).slice(0, 6);
    st.last = {id:id, at:Date.now()};

  /* ---------- Niveaux du quiz (partagé avec l'accueil) ----------
     Passer du niveau L au niveau L+1 coûte 100 + 60·(L−1) XP. */
  var TITLES = [
    {fr:'Externe', ar:'طالب خارجي'}, {fr:'Interne', ar:'طبيب داخلي'}, {fr:'Résident', ar:'طبيب مقيم'},
    {fr:'Chef de clinique', ar:'رئيس عيادة'}, {fr:'Assistant hospitalo-universitaire', ar:'مساعد استشفائي جامعي'},
    {fr:'Maître de conférences agrégé', ar:'أستاذ مبرِّز'}, {fr:'Professeur', ar:'أستاذ'}, {fr:'Légende du cœur', ar:'أسطورة القلب'}
  ];
  function level(xp){
    xp = Math.max(0, Math.floor(xp || 0));
    var L = 1, base = 0, need = 100;
    while(xp >= base + need){ base += need; L++; need = 100 + 60 * (L - 1); }
    return {lvl:L, xp:xp, base:base, next:base + need, pct:(xp - base) / need, title:TITLES[Math.min(TITLES.length - 1, Math.floor((L - 1) / 2))]};
  }

  /* ---------- Hasard reproductible ---------- */
  function rng(seed){
    var a = seed >>> 0;
    return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; var r = Math.imul(a ^ a >>> 15, 1 | a); r = r + Math.imul(r ^ r >>> 7, 61 | r) ^ r; return ((r ^ r >>> 14) >>> 0) / 4294967296; };
  }
  function gauss(r){ var u = 1 - r(), v = r(); return Math.sqrt(-2*Math.log(u)) * Math.cos(2*Math.PI*v); }

  window.CS = {

<script>
/* Cœur Net — visite guidée (window.CS.tour)
   CS.tour.define([{el:'#sel' | fn, title:{fr,ar}, body:{fr,ar} (HTML permis), before:fn, after:fn}], {key})
   Démarre seule à la première ouverture de la page ; le bouton « ? » de l'en-tête la relance. */
(function(){
  'use strict';
  var CS = window.CS, h = CS.h, t = CS.t;
  var steps = [], key = 'tour.' + CS.PAGE, idx = 0, mask, hole, pop, active = false;

  function define(list, opts){
    steps = list || [];
    if(opts && opts.key) key = 'tour.' + opts.key;
    // première visite : on attend que la page soit dessinée
    if(!CS.store.get(key, false)) setTimeout(function(){ if(!active && !document.querySelector('.modal-bg')) start(false); }, 700);
  }
  function target(s){
    if(!s.el) return null;
    var el = typeof s.el === 'function' ? s.el() : document.querySelector(s.el);
    if(!el) return null;
    var r = el.getBoundingClientRect();
    if(r.width === 0 && r.height === 0) return null;
    return el;
  }
  function isSheet(){ return window.matchMedia('(max-width:720px)').matches; }

  function start(force){
    if(!steps.length) return;
    if(active) stop(false);
    active = true; idx = 0;
    mask = h('div', {class:'tour-mask', 'aria-hidden':'true'});
    hole = h('div', {class:'tour-hole'});
    pop = h('div', {class:'tour-pop', role:'dialog', 'aria-modal':'true', 'aria-live':'polite'});
    mask.addEventListener('click', function(e){ e.stopPropagation(); });
    document.body.appendChild(mask); document.body.appendChild(hole); document.body.appendChild(pop);
    document.addEventListener('keydown', onKey, true);
    window.addEventListener('resize', place);
    window.addEventListener('scroll', place, true);
    show(0);
  }
  function stop(done){
    if(!active) return;
    var s = steps[idx]; if(s && s.after) try{ s.after(); }catch(e){}
    active = false;
    [mask, hole, pop].forEach(function(x){ if(x) x.remove(); });
    document.removeEventListener('keydown', onKey, true);
    window.removeEventListener('resize', place);
    window.removeEventListener('scroll', place, true);
    CS.store.set(key, true);
    if(done) CS.toast({fr:'Visite terminée. Le bouton « ? » la relance à tout moment.', ar:'انتهت الجولة. يعيد زر «؟» تشغيلها في أي وقت.'});
  }
  function onKey(e){
    if(!active) return;
    var rtl = CS.isAr();
    if(e.key === 'Escape'){ e.preventDefault(); stop(false); }
    else if(e.key === (rtl ? 'ArrowLeft' : 'ArrowRight') || e.key === 'Enter'){ e.preventDefault(); next(); }
    else if(e.key === (rtl ? 'ArrowRight' : 'ArrowLeft')){ e.preventDefault(); prev(); }
  }
  function next(){ if(idx < steps.length - 1) show(idx + 1); else stop(true); }
  function prev(){ if(idx > 0) show(idx - 1); }

  function show(i){
    var old = steps[idx]; if(old && old.after && i !== idx) try{ old.after(); }catch(e){}
    idx = i;
    var s = steps[i];
    if(s.before) try{ s.before(); }catch(e){}
    var last = i === steps.length - 1;
    pop.innerHTML = '';
    var dots = h('div', {class:'tour-dots'});
    for(var k = 0; k < steps.length; k++) dots.appendChild(h('i', {class:k === i ? 'on' : ''}));
    pop.appendChild(h('div', {class:'row between', style:{marginBottom:'6px'}},
      h('span', {class:'tour-step', text:(i + 1) + ' / ' + steps.length}),
      h('button', {class:'btn ghost sm', type:'button', text:{fr:'Passer', ar:'تخطٍّ'}, onclick:function(){ stop(false); }})));
    pop.appendChild(h('h3', {text:s.title}));
    pop.appendChild(h('div', {class:'tb', html:t(s.body)}));
    pop.appendChild(h('div', {class:'tour-foot'}, dots,
      h('div', {class:'row', style:{gap:'6px'}},
        i > 0 ? h('button', {class:'btn sm', type:'button', text:{fr:'Précédent', ar:'السابق'}, onclick:prev}) : null,
        h('button', {class:'btn sm primary', type:'button', text:last ? {fr:'Terminer', ar:'إنهاء'} : {fr:'Suivant', ar:'التالي'}, onclick:next}))));
    var el = target(s);
    if(el){
      var r = el.getBoundingClientRect();
      var vh = window.innerHeight, sheetH = isSheet() ? Math.min(pop.offsetHeight || 260, vh * .5) : 0;
      var visibleTop = 70, visibleBottom = vh - sheetH - 16;
      if(r.top < visibleTop || r.bottom > visibleBottom){
        var y = window.scrollY + r.top - (isSheet() ? Math.max(70, (visibleBottom - r.height) / 2) : vh / 2 - r.height / 2);
        window.scrollTo({top:Math.max(0, y), behavior:'smooth'});
      }
    }
    place(); setTimeout(place, 360);
    var f = pop.querySelector('.btn.primary'); if(f) f.focus({preventScroll:true});
  }
  function place(){
    if(!active) return;
    var s = steps[idx], el = target(s), sheet = isSheet();
    pop.classList.toggle('sheet', sheet);
    if(!el){
      hole.style.cssText = 'top:50%;left:50%;width:0;height:0;outline:0';
      if(!sheet){ pop.style.left = Math.max(12, (window.innerWidth - pop.offsetWidth) / 2) + 'px'; pop.style.top = Math.max(12, (window.innerHeight - pop.offsetHeight) / 2) + 'px'; }
      return;
    }
    var r = el.getBoundingClientRect(), pad = 6;
    hole.style.cssText = 'top:' + (r.top - pad) + 'px;left:' + (r.left - pad) + 'px;width:' + (r.width + pad * 2) + 'px;height:' + (r.height + pad * 2) + 'px';
    if(sheet){ pop.style.left = ''; pop.style.top = ''; return; }
    var pw = pop.offsetWidth, ph = pop.offsetHeight, vw = window.innerWidth, vh = window.innerHeight, gap = 14;
    var top = r.bottom + gap;
    if(top + ph > vh - 12) top = r.top - ph - gap;
    if(top < 12){ // ni dessous ni dessus : à côté
      top = Math.min(Math.max(12, r.top), vh - ph - 12);
      var side = CS.isAr() ? r.left - pw - gap : r.right + gap;
      if(side + pw > vw - 12 || side < 12) side = CS.isAr() ? r.right + gap : r.left - pw - gap;
      pop.style.left = Math.min(Math.max(12, side), vw - pw - 12) + 'px';
    } else {
      var left = CS.isAr() ? r.right - pw : r.left;
      pop.style.left = Math.min(Math.max(12, left), vw - pw - 12) + 'px';
    }
    pop.style.top = top + 'px';
  }

  CS.tour = {define:define, start:start, stop:stop, get active(){ return active; }};
})();

</script>
<script>
/* Cœur Net — formules de risque partagées (window.RISK)
   Utilisées par « Scores de risque » et « Décision partagée ». Coefficients repris des publications originales :
   SCORE2 / SCORE2-OP (Eur Heart J 2021), SCORE2-Diabetes (Eur Heart J 2023), PCE (ACC/AHA 2013),
   EuroSCORE II (Nashef, Eur J Cardiothorac Surg 2012). */
(function(root){
  'use strict';
  function cockcroft(age, wt, creatMgdl, female){ if(!(age > 0 && wt > 0 && creatMgdl > 0)) return NaN; return (140 - age) * wt / (72 * creatMgdl) * (female ? 0.85 : 1); }
  function recal(risk, s1, s2){ return 1 - Math.exp(-Math.exp(s1 + s2 * Math.log(-Math.log(1 - risk)))); }
  var S2_CAL = { // SCORE2 : [scale1, scale2] hommes / femmes
    low:{m:[-0.5699,0.7476], f:[-0.7380,0.7019]}, moderate:{m:[-0.1565,0.8009], f:[-0.3143,0.7701]},
    high:{m:[0.3207,0.9360], f:[0.5710,0.9369]}, veryhigh:{m:[0.5836,0.8294], f:[0.9412,0.8329]} };
  var OP_CAL = {
    low:{m:[-0.34,1.19], f:[-0.52,1.01]}, moderate:{m:[0.01,1.25], f:[-0.10,1.10]},
    high:{m:[0.08,1.15], f:[0.38,1.09]}, veryhigh:{m:[0.05,0.70], f:[0.38,0.69]} };

function chips(key, obj, opts, multi, onChange){
  var row = h('div', {class:'chips', id:'q-' + key});

    var v = String(o[0]);

      else obj[key] = o[0];
      save(); (onChange || render)();
    }}));
  });
  return row;
}
/* Valeur exacte facultative à côté des tranches (demande d'Anis : « on coche, puis on entre les valeurs ») */
function exact(key, obj, unit, toStore, fromStore){
  var inp = h('input', {class:'inp', inputmode:'decimal', id:'x-' + key, style:{width:'96px', minHeight:'40px'}, placeholder:T({fr:'exacte', ar:'بدقّة'}), value:obj[key + 'X'] ? fmt(fromStore(+obj[key]), unit === 'mmol/L' ? 1 : 0) : ''});

function ageCtl(obj, min, max){
  var inp = h('input', {class:'inp', id:'age', inputmode:'numeric', value:obj.age});

function cholLabel(lo, hi, kind){ // libellés de tranches en mg/dL ou mmol/L
  var f = function(x){ return CS.units() === 'si' ? fmt(x, 1) : fmt(Math.round(x * 38.67)); };
  if(lo == null) return '< ' + f(hi);
  if(hi == null) return '≥ ' + f(lo);
  return f(lo) + '–' + f(hi);
}

/* ---------- Statine : calcul ----------
   Catégories et objectifs de LDL-C : figure ESC/EAS 2025 (mise à jour dyslipidémies), transmise par Anis.
   Score de risque : Globorisk calibré pour la Tunisie (« en Tunisie, à la place de SCORE2, on a Globorisk »),
   SCORE2/SCORE2-OP au choix. Facteurs de risque majeurs : liste d'Anis (HTA, tabac, obésité, sédentarité,

var ORD = {low:0, mod:1, high:2, vhigh:3, extreme:4};
var RF = [['hta', {fr:'Hypertension artérielle', ar:'ارتفاع ضغط الدم'}], ['smoke', {fr:'Tabagisme', ar:'التدخين'}], ['obese', {fr:'Obésité', ar:'السمنة'}],
  ['sed', {fr:'Sédentarité', ar:'قلة النشاط البدني'}], ['dyslip', {fr:'Dyslipidémie', ar:'اضطراب الدهون'}]];

// Couleur de la case (carte de chaleur KDIGO) et sévérité retenue par l'ESC
function ckdCell(g, a){
  var gi = ['G1', 'G2', 'G3a', 'G3b', 'G4', 'G5'].indexOf(g), ai = ['A1', 'A2', 'A3'].indexOf(a);
  var heat = gi <= 1 ? ['g', 'y', 'o'][ai] : gi === 2 ? ['y', 'o', 'r'][ai] : gi === 3 ? ['o', 'r', 'r'][ai] : 'r';

  return {heat:heat, sev:sev};
}

    out.appendChild(top2);
    mb.appendChild(h('span', {class:'small muted', text:'RVA ' + x.forS.length + ' · TAVI ' + x.forT.length})); mb.appendChild(h('b', {class:'lv-' + (L.c === 'tavi' ? 'ok' : L.c === 'savr' ? 'high' : 'warn'), text:T(x.lean.indexOf('tavi') === 0 ? {fr:'→ TAVI', ar:'← TAVI'} : x.lean.indexOf('savr') === 0 ? {fr:'→ Chirurgie', ar:'← الجراحة'} : {fr:'Heart Team', ar:'فريق القلب'})}));
    out.appendChild(h('p', {class:'xs muted', text:{fr:'Orientation d’après les facteurs de la figure 9 : la décision revient à la Heart Team, avec le patient.', ar:'توجيه حسب عوامل الشكل 9: القرار لفريق القلب بالتشاور مع المريض.'}}));

    if(!x.life && x.inop && x.fem){
      var T2 = [{k:'ev', l:{fr:'Décès', ar:'وفاة', tn:'وفاة'}, n:30.7}, {k:'harm', l:{fr:'AVC', ar:'سكتة دماغية', tn:'جلطة دماغية'}, n:10.6}, {k:'harm2', l:{fr:'Complication vasculaire majeure', ar:'مضاعفة وعائية كبرى', tn:'مشكل في الشريان'}, n:16}];
      var M = [{k:'ev', l:{fr:'Décès', ar:'وفاة', tn:'وفاة'}, n:50.7}, {k:'harm', l:{fr:'AVC', ar:'سكتة دماغية', tn:'جلطة دماغية'}, n:4.5}];
      out.appendChild(h('p', {class:'summary', id:'sum', dir:d, text:P({
        fr:'Chez les patients qui ne peuvent pas être opérés, à 1 an : sur 100 personnes, environ 51 décèdent avec le traitement médical seul, contre 31 avec la TAVI. 20 vies sauvées pour 100 patients traités, au prix de plus d’AVC et de complications vasculaires (moins fréquentes avec les valves actuelles).',
        ar:'لدى المرضى الذين لا يمكن إجراء الجراحة لهم، بعد سنة: من بين 100 شخص يتوفّى نحو 51 مع العلاج الدوائي وحده، مقابل 31 مع TAVI. أي إنقاذ 20 حياة لكل 100 مريض، مقابل سكتات دماغية ومضاعفات وعائية أكثر (أقل تواترًا مع الصمامات الحالية).',
        tn:'مريض ما ينجمش يعمل عملية، بعد عام: على 100 شخص، تقريب 51 يموتو بالدواء برك، و31 بالتافي. 20 حياة تتسلّك على كل 100 مريض، مقابل جلطات ومشاكل شرايين أكثر (أقل مع الصمامات الجديدة).'})}));
      out.appendChild(arraysEl([[{fr:'TAVI', ar:'TAVI', tn:'التافي'}, T2], [{fr:'Traitement médical seul', ar:'العلاج الدوائي وحده', tn:'الدواء برك'}, M]]));
      out.appendChild(h('p', {class:'xs muted', id:'src', text:'PARTNER 1B (Leon MB, NEJM 2010), 1 an, valves de première génération. ESC/EACTS 2025 (valvulopathies).'}));
    } else if(!x.life && !x.low){
      out.appendChild(h('p', {class:'summary', id:'sum', dir:d, text:P({
        fr:'Pour un patient à risque opératoire intermédiaire ou fragile, la TAVI fait au moins aussi bien que la chirurgie à 1 et 2 ans (essais PARTNER 2 et SURTAVI), avec une récupération plus rapide. Sans intervention, le rétrécissement serré avec symptômes est grave (survie moyenne 2 à 3 ans).',
        ar:'لدى المريض ذي الخطر الجراحي المتوسط أو الهش، تعطي TAVI نتائج لا تقل عن الجراحة بعد سنة وسنتين (دراستا PARTNER 2 وSURTAVI)، مع تعافٍ أسرع. ودون تدخل، يكون التضيّق الشديد المصحوب بأعراض خطيرًا (متوسط البقاء من سنتين إلى 3 سنوات).',
        tn:'مريض خطر العملية عندو متوسّط ولا ضعيف البنية: التافي تعطي نتيجة كيف العملية ولا خير بعد عام وعامين، والراحة أسرع. من غير تدخّل، التضييق الشديد مع الأعراض خطير (العمر المتوسط 2 ولا 3 سنين).'})}));
      out.appendChild(h('p', {class:'xs muted', id:'src', text:'PARTNER 2 (Leon MB, NEJM 2016), SURTAVI (Reardon MJ, NEJM 2017) : non-infériorité de la TAVI à risque intermédiaire. ESC/EACTS 2025 (valvulopathies).'}));
    } else if(!x.life){
      var Tl =[{k:'ev', l:{fr:'Décès', ar:'وفاة', tn:'وفاة'}, n:1.0}, {k:'harm', l:{fr:'AVC', ar:'سكتة دماغية', tn:'جلطة دماغية'}, n:1.2}, {k:'harm2', l:{fr:'Pacemaker nécessaire', ar:'الحاجة إلى منظِّم ضربات', tn:'يلزمو بيس ماكر'}, n:6.5}, {k:'avoid', l:{fr:'FA nouvelle', ar:'رجفان أذيني جديد', tn:'رجفان جديد'}, n:5}];
      var Sl = [{k:'ev', l:{fr:'Décès', ar:'وفاة', tn:'وفاة'}, n:2.5}, {k:'harm', l:{fr:'AVC', ar:'سكتة دماغية', tn:'جلطة دماغية'}, n:3.1}, {k:'harm2', l:{fr:'Pacemaker nécessaire', ar:'الحاجة إلى منظِّم ضربات', tn:'يلزمو بيس ماكر'}, n:4}, {k:'avoid', l:{fr:'FA nouvelle', ar:'رجفان أذيني جديد', tn:'رجفان جديد'}, n:39.5}];

        fr:'Chez les patients à faible risque opératoire, à 1 an, la TAVI et la chirurgie donnent une survie excellente. La TAVI expose un peu plus au pacemaker ; la chirurgie expose davantage à la FA après l’opération et demande une convalescence plus longue. Sans intervention, le rétrécissement serré avec symptômes est grave (survie moyenne 2 à 3 ans).',
        ar:'لدى المرضى ذوي الخطر الجراحي المنخفض، بعد سنة، تعطي TAVI والجراحة نتائج بقاء ممتازة. تزيد TAVI قليلًا من الحاجة إلى منظِّم ضربات القلب، بينما تزيد الجراحة من الرجفان الأذيني بعد العملية وتتطلّب نقاهة أطول. ودون تدخل، يكون التضيّق الشديد المصحوب بأعراض خطيرًا (متوسط البقاء من سنتين إلى 3 سنوات).',
        tn:'مريض خطر العملية عندو ضعيف، بعد عام: التافي والعملية الجراحية يعطيو نتيجة مليحة برشا. التافي فيها شوية أكثر بيس ماكر، والعملية فيها رجفان أكثر وتلزمها راحة أطول. من غير تدخّل، التضييق الشديد مع الأعراض خطير (العمر المتوسط 2 ولا 3 سنين).'})}));
      out.appendChild(arraysEl([[{fr:'TAVI', ar:'TAVI', tn:'التافي'}, Tl], [{fr:'Chirurgie (remplacement valvulaire)', ar:'الجراحة (استبدال الصمام)', tn:'العملية الجراحية'}, Sl]]));
      out.appendChild(h('p', {class:'xs muted', id:'src', text:'PARTNER 3 (Mack MJ, NEJM 2019), 1 an, patients à faible risque. ESC/EACTS 2025 : TAVI recommandée dès 70 ans si valve tricuspide et accès fémoral adapté (classe I) ; chirurgie pour les moins de 70 ans à faible risque.'}));
    }
  }
  box.appendChild(out);
}
