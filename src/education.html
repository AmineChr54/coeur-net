<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Éducation patient · Cœur Net</title>
<!-- @include _base.css -->
<style>
:root{--sc-a:#eef6fc;--sc-b:#d6e7f6}
:root[data-theme="dark"]{--sc-a:#1d2a3a;--sc-b:#121c28}
.ed{display:grid;grid-template-columns:270px minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:900px){.ed{grid-template-columns:minmax(0,1fr)}}
.topics{display:flex;flex-direction:column;gap:6px}
.tp{display:flex;align-items:center;gap:12px;border:1px solid transparent;background:none;padding:9px 10px;border-radius:12px;cursor:pointer;text-align:start;color:var(--fg-2)}
.tp:hover{background:var(--surface-2)}
.tp[aria-current="true"]{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 30%,transparent);color:var(--fg)}
.tp .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none;background:linear-gradient(135deg,#e25555,#b8233a);color:#fff;font-weight:800;font-size:.78rem;box-shadow:0 3px 8px rgba(184,35,58,.25)}
.tp b{display:block;font-size:.92rem}
.tp small{display:block;color:var(--muted);font-size:.74rem}
@media (max-width:900px){
  .topics-card{padding:8px;position:sticky;top:calc(54px + env(safe-area-inset-top,0px));z-index:15}
  .topics{flex-direction:row;overflow-x:auto;scrollbar-width:none;gap:6px}
  .topics::-webkit-scrollbar{display:none}
  .tp{flex:none;padding:6px 12px 6px 6px;border-radius:999px;border-color:var(--line)}
  .tp .ic{width:30px;height:30px;border-radius:50%;font-size:.62rem}
  .tp small{display:none}
  .tp b{font-size:.84rem;white-space:nowrap}
}
.stage-card{display:flex;flex-direction:column;gap:14px}
.stage-card:fullscreen{background:var(--bg);padding:28px;overflow:auto}
.scene{width:100%;aspect-ratio:600/320;border-radius:18px;overflow:hidden;position:relative;box-shadow:inset 0 0 0 1px var(--line)}
.scene svg{width:100%;height:100%;display:block}
.scene .prog{position:absolute;inset:auto 0 0 0;height:4px;background:rgba(0,0,0,.08)}
.scene .prog i{display:block;height:100%;background:var(--accent);width:0}
.scene.playing .prog i{animation:prog var(--dur,8s) linear forwards}
@keyframes prog{to{width:100%}}
.cap{font-size:1.25rem;line-height:1.6;min-height:4.8em}
.cap[dir="rtl"]{font-family:var(--font-ar);font-size:1.42rem;line-height:1.85}
.stage-card:fullscreen .cap{font-size:1.7rem}
.stage-card:fullscreen .cap[dir="rtl"]{font-size:1.95rem}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dots button{width:28px;height:8px;border-radius:999px;border:0;background:var(--surface-3);cursor:pointer;padding:0}
.dots button[aria-current="true"]{background:var(--accent);width:40px}
.navrow{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
@media (max-width:720px){.navb{position:sticky;bottom:calc(var(--tabbar-h) + 8px);background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(8px);padding:8px;border-radius:14px;border:1px solid var(--line);box-shadow:var(--shadow-md);z-index:10}.navb .row{flex:1}.navb .row .btn{flex:1}}
/* textes des illustrations */
.il-lbl{font:600 15px var(--font);fill:#2d3e50}
.il-tag{font:700 14px var(--font);fill:#2d3e50}
html[lang="ar"] .il-lbl,html[lang="ar"] .il-tag,.scene[data-l="ar"] .il-lbl,.scene[data-l="ar"] .il-tag,.scene[data-l="tn"] .il-lbl,.scene[data-l="tn"] .il-tag{font-family:var(--font-ar)}
/* animations des illustrations */
@keyframes flowx{from{transform:translateX(calc(-80px - var(--x,0px)))}to{transform:translateX(calc(680px - var(--x,0px)))}}
@keyframes beat{0%,100%{transform:scale(1)}12%{transform:scale(1.045)}24%{transform:scale(.985)}36%{transform:scale(1.02)}52%{transform:scale(1)}}
@keyframes weak{0%,100%{transform:scale(1.06)}35%{transform:scale(1.075)}}
@keyframes quiver{0%,100%{transform:translate(0,0)}25%{transform:translate(.8px,-.6px)}50%{transform:translate(-.7px,.5px)}75%{transform:translate(.5px,.7px)}}
@keyframes pulseO{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes inflate{0%{transform:scaleY(.15)}40%,100%{transform:scaleY(1)}}
@keyframes squash{0%{transform:scaleY(1)}40%,100%{transform:scaleY(.3)}}
@keyframes draw{from{stroke-dashoffset:var(--len,600)}to{stroke-dashoffset:0}}
@keyframes dashf{to{stroke-dashoffset:-32}}
@keyframes flick{0%,100%{opacity:0}20%{opacity:1}40%{opacity:.2}60%{opacity:.9}}
@keyframes grow{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes open3{0%,45%,100%{transform:scale(1)}15%,30%{transform:scale(.22)}}
@keyframes openS{0%,45%,100%{transform:scale(1)}15%,30%{transform:scale(.8)}}
@keyframes expand{0%{transform:scale(.3)}55%,100%{transform:scale(1)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes tick{to{transform:rotate(360deg)}}
@keyframes ring{0%{transform:scale(.8);opacity:.6}100%{transform:scale(1.6);opacity:0}}
@keyframes fall{0%{transform:translateY(0);opacity:1}100%{transform:translateY(60px);opacity:0}}
@keyframes swingA{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(14deg)}}
.scene .cell{animation:flowx 3.4s linear infinite}
.scene .slow .cell{animation-duration:7.5s}
.scene .beat{animation:beat 1.15s cubic-bezier(.3,0,.3,1) infinite;transform-box:view-box}
.scene .weak{animation:weak 1.9s ease-in-out infinite;transform-box:view-box}
.scene .quiver{animation:quiver .18s linear infinite}
.scene .pulse{animation:pulseO 1.15s ease-in-out infinite}
.scene .inflate{animation:inflate 3s ease-out infinite alternate;transform-box:fill-box;transform-origin:center}
.scene .squash{animation:squash 3s ease-out infinite alternate;transform-box:view-box}
.scene .draw{stroke-dasharray:var(--len,600);animation:draw 2.6s ease-out both}
.scene .flowdash{stroke-dasharray:6 10;animation:dashf 1.15s linear infinite}
.scene .flick{animation:flick 1.3s linear infinite}
.scene .grow{animation:grow 1.1s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:center}
.scene .open3{animation:open3 1.2s ease-in-out infinite;transform-box:view-box;transform-origin:300px 160px}
.scene .openS{animation:openS 1.2s ease-in-out infinite;transform-box:view-box;transform-origin:300px 160px}
.scene .expand{animation:expand 3s ease-out infinite;transform-box:view-box;transform-origin:300px 160px}
.scene .bob{animation:bob 2s ease-in-out infinite}
.scene .tick{animation:tick 6s linear infinite;transform-box:view-box;transform-origin:300px 160px}
.scene .ring{animation:ring 1.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
.scene .fall{animation:fall 1.5s ease-in infinite}
.scene .leg1{animation:swingA 1.1s ease-in-out infinite;transform-box:view-box;transform-origin:300px 184px}
.scene .leg2{animation:swingA 1.1s ease-in-out infinite reverse;transform-box:view-box;transform-origin:300px 184px}
.scene .arm{animation:swingA 1.1s ease-in-out infinite reverse;transform-box:view-box;transform-origin:300px 112px}
</style>

</head>
<body>
<header id="cs-top"></header>
<main class="wrap">
  <div class="ed">
    <aside class="card topics-card"><nav class="topics" id="topics"></nav></aside>
    <section class="card stage-card" id="stage">
      <div class="navrow">
        <div><span class="eyebrow" id="t-step"></span><h2 id="t-title"></h2></div>
        <div class="row" id="ctl"></div>
      </div>
      <div class="scene" id="scene"></div>
      <p class="cap" id="cap"></p>
      <div class="navrow navb">
        <div class="dots" id="dots"></div>
        <div class="row"><button class="btn" id="prev" type="button"></button><button class="btn primary" id="next" type="button"></button></div>
      </div>
      <p class="xs muted" id="note"></p>
    </section>
  </div>
</main>
<footer id="cs-foot"></footer>
<script>
(function(){
'use strict';
var h = CS.h, T = CS.t, E = CS.esc;
/* Chaque étape : [scène, {fr, ar (arabe standard), tn (derja)}] */
function S(sc, fr, ar, tn){ return [sc, {fr:fr, ar:ar, tn:tn}]; }
var TOPICS = [
 {id:'stent', ic:'ST', name:{fr:'Angioplastie et stent', ar:'رأب الشريان والدعامة', tn:'الستنت'}, steps:[
  S('artery:normal','Les artères coronaires nourrissent le muscle du cœur. Le sang y circule librement.','تغذّي الشرايين التاجية عضلة القلب بالدم، ويجري فيها الدم بحرّية.','الشرايين التاجية هوما اللي يوصّلو الدم لعضلة القلب. الدم يتعدّى فيهم بالراحة.'),
  S('artery:plaque','Avec le temps, du cholestérol se dépose dans la paroi : c’est la plaque. L’artère se rétrécit et le sang passe mal.','مع مرور الوقت يترسّب الكوليسترول في جدار الشريان مكوّنًا لويحة، فيضيق الشريان ويصعب مرور الدم.','مع الوقت، الكولسترول يتلصق في حيط الشريان ويعمل لويحة. الشريان يضياق والدم ما يتعدّاش مليح.'),
  S('body:wrist','Par le poignet, le médecin fait monter un tube très fin jusqu’au cœur. Vous restez réveillé, sous anesthésie locale.','عبر المعصم، يُدخل الطبيب أنبوبًا رفيعًا جدًا حتى القلب. تبقى واعيًا تحت تخدير موضعي.','من المعصم، الطبيب يطلّع تيو رقيق برشا حتى للقلب. تقعد فايق، بالبنج الموضعي برك.'),
  S('artery:wire','Un fil très fin traverse le rétrécissement. Il sert de rail pour le ballon.','يعبر سلك رفيع جدًا موضع التضيّق، ويكون بمثابة سكة يمرّ عليها البالون.','خيط رقيق برشا يتعدّى من البلاصة الضيقة. هو كيما السكة اللي يمشي عليها البالون.'),
  S('artery:balloon','Un petit ballon est gonflé : il écrase la plaque et ouvre l’artère. Le stent, un petit ressort en métal, se déploie avec lui.','يُنفَخ بالون صغير فيضغط اللويحة ويفتح الشريان، وتنفتح معه الدعامة، وهي نابض معدني صغير.','يتنفخ بالون صغير يضغط على اللويحة ويحلّ الشريان. والستنت، نابض صغير من الحديد، يتحلّ معاه.'),
  S('artery:stent','Le ballon est retiré. Le stent reste en place pour toujours et garde l’artère ouverte. Le sang circule de nouveau.','يُسحب البالون وتبقى الدعامة في مكانها نهائيًا لتُبقي الشريان مفتوحًا، فيعود الدم إلى الجريان.','ينحّيو البالون، والستنت يقعد في بلاصتو ديما باش يخلّي الشريان محلول. الدم يرجع يتعدّى.'),
  S('body:pills','Très important : prenez vos deux médicaments antiplaquettaires chaque jour. Ne les arrêtez jamais sans l’avis de votre cardiologue.','أمر مهم جدًا: تناول دواءَي مضادّ الصفائح كل يوم، ولا توقفهما أبدًا دون رأي طبيب القلب.','مهم برشا: خوذ زوز الدواوات متاع الدم كل نهار. ما تحبسهمش أبدا من غير ما تشاور طبيب القلب متاعك.')]},
 {id:'idm', ic:'IDM', name:{fr:'Infarctus et coronarographie', ar:'احتشاء القلب وتصوير الشرايين', tn:'الجلطة القلبية'}, steps:[
  S('heart:coronary','Le cœur est un muscle. Il est nourri par ses propres artères, les coronaires.','القلب عضلة تتغذّى من شرايينها الخاصة، وهي الشرايين التاجية.','القلب عضلة. يتغذّى بالشرايين متاعو، اسمهم الشرايين التاجية.'),
  S('heart:infarct','Lors d’un infarctus, une artère se bouche brutalement par un caillot. La partie du muscle qu’elle nourrit manque d’oxygène.','في احتشاء القلب ينسدّ شريان فجأة بخثرة دموية، فيُحرم الجزء الذي يغذّيه من الأكسجين.','في الجلطة القلبية، شريان يتسكّر فجأة بجلطة دم. الجزء من العضلة اللي يغذيه يولّي ناقصو الأكسجين.'),
  S('body:phone190','Douleur dans la poitrine qui serre et dure plus de 20 minutes, parfois dans le bras ou la mâchoire : appelez le SAMU au 190 tout de suite.','ألم في الصدر يضغط ويدوم أكثر من 20 دقيقة، وقد يمتد إلى الذراع أو الفك: اتصل بالإسعاف على الرقم 190 فورًا.','وجيعة في الصدر تعصر وتطول أكثر من 20 دقيقة، ساعات تمشي للذراع ولا للحنك: اطلب السامو 190 في الحين.'),
  S('body:clock','Chaque minute compte : plus l’artère est ouverte tôt, plus on sauve de muscle.','كل دقيقة لها ثمنها: كلما فُتح الشريان مبكرًا أنقذنا جزءًا أكبر من العضلة.','كل دقيقة تحسب: كل ما يحلّو الشريان بكري، كل ما نسلكو برشا من العضلة.'),
  S('body:wrist','La coronarographie : par le poignet, un tube fin monte jusqu’au cœur. Un produit visible à la radio montre les artères.','تصوير الشرايين التاجية: عبر المعصم يصعد أنبوب رفيع حتى القلب، وتُظهر مادة ظليلة الشرايين بالأشعة.','الكورونوغرافي: من المعصم، تيو رقيق يطلع حتى للقلب. دواء يبان في الراديو يورّي الشرايين.'),
  S('artery:balloon','Si une artère est bouchée, on la débouche tout de suite avec un ballon et un stent.','إذا كان أحد الشرايين مسدودًا، يُفتح في الحال بالبالون والدعامة.','كان فما شريان مسكّر، يحلّوه في بلاصتو بالبالون والستنت.')]},
 {id:'abl', ic:'AB', name:{fr:'Ablation', ar:'الاستئصال بالقسطرة', tn:'الكيّ الكهربائي'}, steps:[
  S('heart:electric','Le cœur a son propre système électrique : une petite pile naturelle donne le rythme à chaque battement.','للقلب نظامه الكهربائي الخاص: بطارية طبيعية صغيرة تعطي الإيقاع لكل نبضة.','القلب عندو كهرباء متاعو: فما بيلة طبيعية صغيرة تعطي الريتم في كل دقّة.'),
  S('heart:chaos','Dans certaines arythmies, des signaux électriques anormaux partent dans tous les sens : le cœur bat vite et de façon irrégulière.','في بعض اضطرابات النظم تنطلق إشارات كهربائية غير طبيعية في كل الاتجاهات، فيخفق القلب بسرعة وبشكل غير منتظم.','في بعض الاضطرابات، إشارات كهربائية مش طبيعية تمشي في كل جيهة: القلب يدقّ بالزربة ومش منظّم.'),
  S('body:groin','Des sondes fines sont introduites par une veine de l’aine et montent jusqu’au cœur.','تُدخَل مسابر رفيعة عبر وريد أعلى الفخذ وتصعد حتى القلب.','يدخّلو مسابر رقاق من عرق في الفخذ يطلعو حتى للقلب.'),
  S('heart:ablation','Le médecin applique de la chaleur (radiofréquence) ou du froid (cryothérapie) sur de petites zones pour bloquer les circuits anormaux.','يطبّق الطبيب الحرارة (الترددات الراديوية) أو البرودة (التبريد) على مناطق صغيرة لقطع الدارات الكهربائية غير الطبيعية.','الطبيب يحطّ سخانة (راديوفريكونس) ولا برودة (كريو) على بلايص صغار باش يقصّ الطرقات الكهربائية الغالطة.'),
  S('heart:electric','Le rythme normal revient. Le retour à la maison se fait souvent le lendemain.','يعود النظم الطبيعي، ويكون الرجوع إلى البيت غالبًا في اليوم التالي.','الريتم الطبيعي يرجع. غالبا تروّح لدارك غدوة.')]},
 {id:'tavi', ic:'TAVI', name:{fr:'TAVI (valve aortique)', ar:'زرع الصمام الأبهري (TAVI)', tn:'تبديل الصمام بالقسطرة'}, steps:[
  S('valve:normal','La valve aortique s’ouvre à chaque battement pour laisser sortir le sang du cœur vers tout le corps.','ينفتح الصمام الأبهري مع كل نبضة ليسمح بخروج الدم من القلب إلى سائر الجسم.','الصمام الأبهري يتحلّ في كل دقّة باش يخلّي الدم يخرج من القلب لكامل البدن.'),
  S('valve:stenosis','Avec l’âge, elle devient épaisse et calcifiée : elle s’ouvre mal. Le cœur force, on s’essouffle, on peut faire des malaises.','مع التقدّم في السن يصبح سميكًا ومتكلّسًا فلا ينفتح جيدًا. يُجهَد القلب، فيضيق التنفس وقد يحدث إغماء.','مع العمر، يولّي خشين وفيه الكلس: ما يتحلّش مليح. القلب يتعب، يجيك ضيق النفس وساعات تدوخ.'),
  S('body:groin','Sans ouvrir la poitrine, une nouvelle valve pliée est amenée par l’artère de l’aine.','دون فتح الصدر، يُوصَل صمام جديد مطويّ عبر شريان أعلى الفخذ.','من غير ما يحلّو الصدر، يجيبو صمام جديد مطوي من الشريان متاع الفخذ.'),
  S('valve:deliver','La valve pliée sur un cathéter est placée exactement au niveau de l’ancienne valve.','يوضع الصمام المطوي على القسطرة بالضبط في مستوى الصمام القديم.','الصمام المطوي على القسطرة يتحط بالضبط في بلاصة الصمام القديم.'),
  S('valve:deploy','La nouvelle valve se déploie à l’intérieur de l’ancienne et prend sa place immédiatement.','ينفتح الصمام الجديد داخل القديم ويأخذ مكانه في الحال.','الصمام الجديد يتحلّ وسط القديم وياخو بلاصتو في الحين.'),
  S('valve:done','Le sang sort librement. On se lève le jour même ou le lendemain, retour rapide à la maison.','يخرج الدم بحرّية. يمكن النهوض في اليوم نفسه أو في اليوم التالي، والعودة إلى البيت سريعًا.','الدم يخرج بالراحة. تنجم توقف نفس النهار ولا غدوة، وتروّح بالزربة.')]},
 {id:'pm', ic:'PM', name:{fr:'Stimulateur cardiaque', ar:'منظِّم ضربات القلب', tn:'البيس ماكر'}, steps:[
  S('heart:weak','Quand la pile naturelle du cœur est trop lente ou que le courant est bloqué, le cœur ralentit : fatigue, essoufflement, malaises.','عندما تصبح البطارية الطبيعية للقلب بطيئة جدًا أو ينقطع التيار، يتباطأ القلب: تعب وضيق في التنفس ونوبات دوار.','كي البيلة الطبيعية متاع القلب تولّي ثقيلة ولا الكهرباء تتقصّ، القلب يبطا: تعب، ضيق نفس وتدوخ.'),
  S('body:pmbox','Le stimulateur est un petit boîtier placé sous la peau, sous la clavicule, sous anesthésie locale.','المنظِّم علبة صغيرة توضع تحت الجلد أسفل عظم الترقوة، تحت تخدير موضعي.','البيس ماكر علبة صغيرة تتحط تحت الجلد، تحت عظم الترقوة، بالبنج الموضعي.'),
  S('heart:pacer','Une sonde relie le boîtier au cœur. Elle surveille chaque battement et envoie une impulsion seulement quand il le faut.','يربط سلكٌ العلبةَ بالقلب، فيراقب كل نبضة ولا يرسل نبضة كهربائية إلا عند الحاجة.','فما سلك يربط العلبة بالقلب. يراقب كل دقّة ويبعث نبضة كان كي يلزم برك.'),
  S('heart:beat','Le cœur bat de nouveau régulièrement, à la bonne vitesse.','يعود القلب إلى النبض بانتظام وبالسرعة المناسبة.','القلب يرجع يدقّ منظّم وبالسرعة المليحة.'),
  S('body:phone15','Au quotidien : téléphone à plus de 15 cm du boîtier, carte de porteur à montrer aux portiques, contrôle une fois par an.','في حياتك اليومية: أبعد الهاتف أكثر من 15 سم عن العلبة، واستظهر بطاقة حامل المنظِّم عند البوابات الأمنية، وأجرِ فحصًا مرة في السنة.','في حياتك: التليفون بعيد على العلبة أكثر من 15 صنتي، ورّي الكارطة في البورتيك، ومراقبة مرة في العام.')]},
 {id:'ic', ic:'IC', name:{fr:'Insuffisance cardiaque', ar:'قصور القلب', tn:'القصور القلبي'}, steps:[
  S('heart:weak','Dans l’insuffisance cardiaque, le cœur pompe moins fort : le sang circule moins bien.','في قصور القلب يضخّ القلب بقوة أقل، فلا يجري الدم كما ينبغي.','في القصور القلبي، القلب يضخّ بشوية: الدم ما يدورش مليح.'),
  S('body:fluid','L’eau s’accumule dans le corps : jambes qui gonflent, essoufflement en position allongée.','يتجمّع الماء في الجسم: تنتفخ الساقان ويضيق التنفس عند الاستلقاء.','الماء يتلمّ في البدن: الساقين يتنفخو، وضيق النفس كي تتمدّ.'),
  S('body:scale','Pesez-vous chaque matin. Si vous prenez plus de 2 kg en 3 jours, appelez votre médecin.','زِن نفسك كل صباح. إذا زاد وزنك أكثر من 2 كغ في 3 أيام، فاتصل بطبيبك.','توزن كل صباح. كان زدت أكثر من 2 كيلو في 3 أيام، كلّم طبيبك.'),
  S('body:salt','Moins de sel : pas de salière à table, attention au pain, à la harissa du commerce, aux conserves et aux fromages.','قلّل الملح: لا تضع المملحة على المائدة، وانتبه إلى الخبز والهريسة الجاهزة والمعلّبات والأجبان.','قلّل الملح: ما تحطّش الملحة على الطاولة، ردّ بالك من الخبز، الهريسة متاع الحانوت، الكونسارف والفرماج.'),
  S('body:pills','Vos médicaments protègent le cœur et allongent la vie, même quand vous vous sentez bien. Ne les arrêtez pas.','أدويتك تحمي القلب وتطيل العمر حتى عندما تشعر أنك بخير، فلا توقفها.','الدواء متاعك يحمي القلب ويطوّل العمر، حتى كي تحسّ روحك لاباس. ما تحبسوش.'),
  S('body:walk','Bougez un peu chaque jour : la marche régulière renforce le cœur.','تحرّك قليلًا كل يوم: المشي المنتظم يقوّي القلب.','تحرّك شوية كل نهار: المشي كل يوم يقوّي القلب.')]},
 {id:'fa', ic:'FA', name:{fr:'Fibrillation atriale', ar:'الرجفان الأذيني', tn:'الرجفان الأذيني'}, steps:[
  S('heart:electric','Normalement, les oreillettes se contractent de façon régulière, commandées par la pile naturelle du cœur.','في العادة تنقبض الأذينات بانتظام بأمر من البطارية الطبيعية للقلب.','في العادة، الأذينات يدقّو بطريقة منظّمة، بالبيلة الطبيعية متاع القلب.'),
  S('heart:chaos','Dans la fibrillation atriale, elles tremblent de façon désordonnée : palpitations, fatigue, parfois rien du tout.','في الرجفان الأذيني ترتجف الأذينات بشكل عشوائي: خفقان وتعب، وأحيانًا لا شيء على الإطلاق.','في الرجفان الأذيني، يرعشو من غير نظام: خفقان، تعب، وساعات ما تحسّ بحتى شي.'),
  S('heart:clot','Le sang stagne dans une petite poche de l’oreillette et peut former un caillot.','يركد الدم في جيب صغير من الأذين، ويمكن أن تتكوّن فيه خثرة.','الدم يقعد واقف في جيب صغير في الأذين ونجم يعمل جلطة.'),
  S('heart:stroke','Si le caillot part vers le cerveau, c’est l’AVC. C’est le principal danger de la fibrillation atriale.','إذا انتقلت الخثرة إلى الدماغ حدثت سكتة دماغية، وهي الخطر الرئيسي للرجفان الأذيني.','كان الجلطة تمشي للمخ، تصير جلطة دماغية. هذا هو الخطر الكبير متاع الرجفان.'),
  S('body:pills','L’anticoagulant empêche la formation des caillots et réduit le risque d’AVC d’environ deux tiers. Ne sautez aucune prise.','يمنع مضادّ التخثر تكوّن الخثرات ويقلّل خطر السكتة الدماغية بنحو الثلثين. لا تُفوّت أي جرعة.','الدواء اللي يميّع الدم يمنع الجلطات وينقّص خطر الجلطة الدماغية بحوالي الثلثين. ما تنسى حتى دوزة.')]},
 {id:'cabg', ic:'CH', name:{fr:'Pontage et chirurgie valvulaire', ar:'المجازة وجراحة الصمامات', tn:'عملية القلب المفتوح'}, steps:[
  S('heart:infarct','Quand plusieurs artères sont très rétrécies, le sang arrive mal au muscle cardiaque.','عندما تضيق عدة شرايين بشدة، لا يصل الدم جيدًا إلى عضلة القلب.','كي برشا شرايين يكونو ضيقين برشا، الدم ما يوصلش مليح لعضلة القلب.'),
  S('heart:bypass','Le chirurgien crée des « déviations » : les pontages. Il utilise une artère de la paroi du thorax ou une veine de la jambe pour contourner le rétrécissement.','ينشئ الجرّاح «تحويلات» هي المجازات: يستعمل شريانًا من جدار الصدر أو وريدًا من الساق لتجاوز موضع التضيّق.','الجرّاح يعمل طرقات أخرى للدم: هذا هو البونتاج. يستعمل شريان من حيط الصدر ولا عرق من الساق باش يدور على البلاصة الضيقة.'),
  S('valve:stenosis','Pour une valve malade, le chirurgien la retire et la remplace.','وفي حالة الصمام المريض، يستأصله الجرّاح ويستبدله.','كي الصمام مريض، الجرّاح ينحّيه ويبدّلو.'),
  S('valve:done','La nouvelle valve peut être biologique ou mécanique. Une valve mécanique impose un anticoagulant à vie (AVK).','يمكن أن يكون الصمام الجديد بيولوجيًا أو ميكانيكيًا، والصمام الميكانيكي يفرض تناول مضادّ تخثر مدى الحياة (مضادّ فيتامين K).','الصمام الجديد ينجم يكون بيولوجي ولا ميكانيكي. الصمام الميكانيكي يلزمو دواء يميّع الدم طول العمر.'),
  S('body:walk','Après l’opération : quelques jours en soins intensifs, puis la réadaptation cardiaque pour reprendre des forces.','بعد العملية: بضعة أيام في العناية المركّزة، ثم إعادة التأهيل القلبي لاستعادة القوة.','بعد العملية: كم نهار في الإنعاش، ومن بعد إعادة التأهيل القلبي باش ترجع لقوّتك.')]}
];
var st = CS.store.get('edu', null) || {topic:'stent', step:0, lang:CS.lang()};
var timer = null, playing = false;
function topic(){ return TOPICS.filter(function(t){ return t.id === st.topic; })[0] || TOPICS[0]; }
function L(x){ return CS.t(x, st.lang); }
function renderTopics(){
  var nav = CS.$('#topics'); nav.innerHTML = '';
  TOPICS.forEach(function(tp){
    nav.appendChild(h('button', {class:'tp', type:'button', 'aria-current':tp.id === st.topic ? 'true' : 'false', onclick:function(){ st.topic = tp.id; st.step = 0; render(); }},
      h('span', {class:'ic', text:tp.ic}), h('span', null, h('b', {text:T(tp.name)}), h('small', {text:tp.steps.length + T({fr:' étapes', ar:' مراحل'})}))));
  });
}
function render(){
  var tp = topic(), s = tp.steps[st.step], rtl = st.lang !== 'fr';
  CS.store.set('edu', st);
  renderTopics();
  ILLUS.setLang(st.lang);
  CS.$('#t-step').textContent = L({fr:'Étape ' + (st.step + 1) + ' / ' + tp.steps.length, ar:'المرحلة ' + (st.step + 1) + ' من ' + tp.steps.length, tn:'المرحلة ' + (st.step + 1) + ' من ' + tp.steps.length});
  CS.$('#t-step').setAttribute('dir', rtl ? 'rtl' : 'ltr');
  var tt = CS.$('#t-title'); tt.textContent = L(tp.name); tt.setAttribute('dir', rtl ? 'rtl' : 'ltr'); tt.style.fontFamily = rtl ? 'var(--font-ar)' : '';
  var sc = CS.$('#scene'); sc.innerHTML = ILLUS.scene(s[0]) + '<div class="prog"><i></i></div>'; sc.dataset.l = st.lang;
  if(playing){ sc.classList.remove('playing'); void sc.offsetWidth; sc.classList.add('playing'); }
  var cap = CS.$('#cap'); cap.textContent = L(s[1]); cap.setAttribute('dir', rtl ? 'rtl' : 'ltr'); cap.setAttribute('lang', st.lang === 'fr' ? 'fr' : st.lang === 'ar' ? 'ar' : 'ar-TN');
  var dots = CS.$('#dots'); dots.innerHTML = '';
  tp.steps.forEach(function(_, i){ dots.appendChild(h('button', {type:'button', 'aria-label':String(i + 1), 'aria-current':i === st.step ? 'true' : 'false', onclick:function(){ st.step = i; render(); }})); });
  CS.$('#prev').disabled = st.step === 0;
  CS.$('#prev').textContent = L({fr:'Précédent', ar:'السابق', tn:'اللي قبل'});
  CS.$('#next').textContent = st.step === tp.steps.length - 1 ? L({fr:'Recommencer', ar:'من البداية', tn:'نعاود من الأول'}) : L({fr:'Suivant', ar:'التالي', tn:'اللي بعد'});
  CS.$('#note').textContent = st.lang === 'tn' ? T({fr:'Textes en derja : à faire relire par un locuteur natif avant usage.', ar:'نصوص الدارجة: يُستحسن أن يراجعها متحدّث أصلي قبل الاستعمال.'}) : st.lang === 'ar' ? T({fr:'Textes en arabe standard : à valider par le cardiologue.', ar:'النصوص بالعربية الفصحى: يُستحسن أن يراجعها طبيب القلب.'}) : '';
}
function go(d){ var n = topic().steps.length; st.step = (st.step + d + n) % n; render(); }
function play(on){
  playing = on; clearInterval(timer);
  var sc = CS.$('#scene'); sc.style.setProperty('--dur', '8s');
  if(on){ sc.classList.add('playing'); timer = setInterval(function(){ var n = topic().steps.length; if(st.step < n - 1) go(1); else { var i = TOPICS.indexOf(topic()); st.topic = TOPICS[(i + 1) % TOPICS.length].id; st.step = 0; render(); } }, 8000); }
  else sc.classList.remove('playing');
  ctl();
}
function ctl(){
  var c = CS.$('#ctl'); c.innerHTML = '';
  var ls = CS.segEl([['fr', 'Français'], ['ar', 'العربية'], ['tn', 'تونسي']], st.lang, function(v){ st.lang = v; render(); });
  ls.id = 'plang';
  c.appendChild(ls);
  c.appendChild(h('button', {class:'btn sm', id:'play', type:'button', 'aria-pressed':playing ? 'true' : 'false', html:(playing ? CS.I.pause : CS.I.play) + '<span>' + E(T(playing ? {fr:'Pause', ar:'إيقاف'} : {fr:'Lecture auto', ar:'تشغيل تلقائي'})) + '</span>', onclick:function(){ play(!playing); }}));
  c.appendChild(h('button', {class:'btn sm', id:'fs', type:'button', text:{fr:'Plein écran', ar:'ملء الشاشة'}, onclick:function(){
    var el = CS.$('#stage');
    try{ if(document.fullscreenElement) document.exitFullscreen(); else if(el.requestFullscreen) el.requestFullscreen().catch(function(){ CS.toast({fr:'Plein écran indisponible ici', ar:'ملء الشاشة غير متاح هنا'}); }); }catch(e){}
  }}));
}
CS.$('#prev').addEventListener('click', function(){ if(st.step > 0) go(-1); });
CS.$('#next').addEventListener('click', function(){ go(1); });
document.addEventListener('keydown', function(e){
  if(e.target.closest('input,textarea,select') || CS.$('.modal-bg') || (CS.tour && CS.tour.active)) return;
  var rtl = st.lang !== 'fr';
  if(e.key === 'ArrowRight') go(rtl ? -1 : 1); if(e.key === 'ArrowLeft') go(rtl ? 1 : -1);
});
// glisser du doigt sur l'illustration
(function(){ var x0 = null, sc = CS.$('#scene');
  sc.addEventListener('touchstart', function(e){ x0 = e.touches[0].clientX; }, {passive:true});
  sc.addEventListener('touchend', function(e){ if(x0 == null) return; var dx = e.changedTouches[0].clientX - x0; x0 = null; if(Math.abs(dx) > 50){ var fwd = dx < 0; if(st.lang !== 'fr') fwd = !fwd; go(fwd ? 1 : -1); } });
})();
CS.init({refs:['Contenus à valider par le cardiologue', 'Arabe standard et derja : relecture recommandée']});
ctl(); render();

CS.tour.define([
  {title:{fr:'Expliquer avec des images', ar:'الشرح بالصور'}, body:{fr:'<p>Huit sujets (stent, infarctus, ablation, TAVI, pacemaker, insuffisance cardiaque, FA, chirurgie) expliqués <b>étape par étape</b>, avec des illustrations animées.</p><p>Tournez l’écran vers le patient, ou mettez-le en plein écran.</p>', ar:'<p>ثمانية مواضيع (الدعامة، الاحتشاء، الاستئصال، TAVI، المنظِّم، قصور القلب، الرجفان، الجراحة) مشروحة <b>خطوة بخطوة</b> برسوم متحركة.</p><p>أدِر الشاشة نحو المريض أو اعرضها بملء الشاشة.</p>'}},
  {el:'#topics', title:{fr:'Choisir le sujet', ar:'اختيار الموضوع'}, body:{fr:'Touchez un sujet ; sur téléphone, faites défiler la bande horizontalement.', ar:'المس موضوعًا؛ وعلى الهاتف مرِّر الشريط أفقيًا.'}},
  {el:'#scene', title:{fr:'L’illustration', ar:'الرسم'}, body:{fr:'Elle s’anime pour montrer ce qui se passe : le sang qui circule, le ballon qui s’ouvre, la valve qui se déploie… Sur téléphone, <b>glissez du doigt</b> pour changer d’étape.', ar:'يتحرّك ليُظهر ما يحدث: الدم يجري، والبالون ينفتح، والصمام ينتشر… وعلى الهاتف <b>اسحب بإصبعك</b> لتغيير المرحلة.'}},
  {el:'#plang', title:{fr:'Trois langues pour le patient', ar:'ثلاث لغات للمريض'}, body:{fr:'<b>Français</b>, <b>arabe standard</b> ou <b>tunisien</b> (derja) : le texte et les étiquettes de l’image changent ensemble.', ar:'<b>الفرنسية</b> أو <b>العربية الفصحى</b> أو <b>التونسية</b> (الدارجة): يتغيّر النص وتسميات الرسم معًا.'}},
  {el:'#play', title:{fr:'Lecture automatique', ar:'التشغيل التلقائي'}, body:{fr:'Les étapes défilent seules toutes les 8 secondes, puis passent au sujet suivant : idéal en salle d’attente.', ar:'تتوالى المراحل وحدها كل 8 ثوانٍ ثم تنتقل إلى الموضوع التالي: مثالي لقاعة الانتظار.'}},
  {el:'.navb', title:{fr:'Avancer pas à pas', ar:'التقدّم خطوة خطوة'}, body:{fr:'Précédent / Suivant, ou les flèches du clavier. Les points montrent où vous en êtes.', ar:'السابق / التالي أو أسهم لوحة المفاتيح. وتبيّن النقاط موضعك.'}}
]);
})();
</script>
</body>
</html>
