<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Consentement éclairé · Cœur Net</title>
<!-- @include _base.css -->
<style>
.wz{display:grid;grid-template-columns:240px minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:860px){.wz{grid-template-columns:minmax(0,1fr)}}
.steps{display:flex;flex-direction:column;gap:4px}
.steps button{display:flex;align-items:center;gap:10px;border:0;background:none;padding:9px 10px;border-radius:var(--r-sm);cursor:pointer;text-align:start;color:var(--fg-2);font-size:.9rem}
.steps button .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line-strong);font-weight:700;font-size:.8rem;flex:none}
.steps button[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.steps button[aria-current="true"] .n{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.steps button.done .n{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
@media (max-width:860px){
  .steps-card{position:sticky;top:calc(54px + env(safe-area-inset-top,0px));z-index:15;padding:8px}
  .steps{flex-direction:row;justify-content:space-between;gap:2px}
  .steps button{flex-direction:column;gap:3px;padding:6px 2px;font-size:.68rem;flex:1;min-width:0;text-align:center}
  .steps button span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
}
.proc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.proc{border:1.5px solid var(--line-strong);border-radius:var(--r);padding:14px;background:var(--surface);cursor:pointer;text-align:start;display:flex;flex-direction:column;gap:4px;min-height:84px}
.proc[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 3px var(--accent-soft)}
.proc b{font-size:.98rem}
.proc small{color:var(--muted);font-size:.78rem}
.pt-txt{font-size:1.1rem;line-height:1.6}
[dir="rtl"].pt-txt,[dir="rtl"] .pt-txt{font-family:var(--font-ar);font-size:1.22rem;line-height:1.85}
.flow{display:flex;flex-direction:column;gap:14px;counter-reset:s;padding:0;margin:0}
.flow li{list-style:none;display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;align-items:start}
.flow li::before{counter-increment:s;content:counter(s);width:38px;height:38px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700}
.risk{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);cursor:pointer}
.risk:has(input:checked){border-color:color-mix(in srgb,var(--ok) 45%,var(--line));background:color-mix(in srgb,var(--ok-soft) 60%,var(--surface))}
.risk input{width:22px;height:22px;accent-color:var(--ok)}
.freq{font-size:.78rem;font-weight:650;padding:3px 8px;border-radius:6px;background:var(--surface-2);color:var(--fg-2);white-space:nowrap}
.langbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.progress{height:6px;background:var(--surface-3);border-radius:6px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--ok);transition:width .25s}
/* formulaire A4 */
.form-a4{background:#fff;color:#111;border:1px solid var(--line);border-radius:var(--r);padding:28px 32px;font-size:10.5pt;line-height:1.45;max-width:820px;font-family:var(--font)}
.form-a4[dir="rtl"]{font-family:var(--font-ar);font-size:11.5pt;line-height:1.7}
.form-a4 .fh{display:flex;justify-content:space-between;gap:16px;border-bottom:2px solid #111;padding-bottom:10px;margin-bottom:14px}
.form-a4 .fh b{font-size:11pt}
.form-a4 .fh small{display:block;color:#444}
.form-a4 h2{font-size:15pt;margin:0 0 2px;color:#111}
.form-a4 h4{font-size:10.5pt;margin:14px 0 4px;text-transform:uppercase;letter-spacing:.04em;color:#111}
.form-a4[dir="rtl"] h4{text-transform:none;letter-spacing:0;font-size:11.5pt}
.form-a4 .pid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;border:1px solid #999;padding:8px 10px;margin:10px 0 4px}
.form-a4 .pid span{display:block;font-size:8.5pt;color:#555}
.form-a4 ol,.form-a4 ul{margin:0;padding-inline-start:20px}
.form-a4 li{margin:2px 0}
.form-a4 .rk{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:8px;align-items:start;padding:3px 0;border-bottom:1px dotted #bbb}
.form-a4 .rk i{font-style:normal;font-weight:700}
.form-a4 .rk em{font-style:normal;font-size:9pt;color:#444;white-space:nowrap}
.form-a4 .decl{border:1px solid #999;padding:10px 12px;margin-top:12px}
.form-a4 .notes{white-space:pre-wrap}
.form-a4 .sigs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px;margin-top:22px}
.form-a4 .sigs div{border-top:1px solid #111;padding-top:4px;font-size:9pt;min-height:60px}
.form-a4 .foot{margin-top:16px;font-size:8pt;color:#666;border-top:1px solid #ccc;padding-top:6px}
.form-wrap{overflow-x:auto}
@media (max-width:640px){.form-a4{padding:16px}.form-a4 .pid{grid-template-columns:minmax(0,1fr)}.form-a4 .sigs{grid-template-columns:minmax(0,1fr)}}
@page{size:A4;margin:14mm}
@media print{body *{visibility:hidden}.form-a4,.form-a4 *{visibility:visible}.form-a4{position:absolute;left:0;top:0;width:100%;max-width:none;border:0;padding:0;border-radius:0}}
.navb{display:flex;justify-content:space-between;gap:10px;margin-top:6px}
@media (max-width:720px){.navb{position:sticky;bottom:calc(var(--tabbar-h) + 8px);background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(8px);padding:8px;border-radius:14px;border:1px solid var(--line);box-shadow:var(--shadow-md);z-index:10}.navb .btn{flex:1}}
</style>

    (st.notes && st.notes.trim() ? '<h4>' + t(F.notes) + '</h4><p class="notes" dir="auto">' + E(st.notes.trim()) + '</p>' : '') +
    '<h4>' + t(F.rights) + '</h4><ul>' + RIGHTS.map(function(x){ return '<li>' + t(x) + '</li>'; }).join('') + '</ul>' +

  CS.toast({fr:'Partage indisponible ici : fichier téléchargé, à joindre à un e-mail.', ar:'المشاركة غير متاحة هنا: تمّ تنزيل الملف لإرفاقه ببريد.'});

  {el:'#svc', title:{fr:'L’en-tête de votre service', ar:'ترويسة قسمك'}, body:{fr:'Saisi une seule fois, en français et en arabe : il apparaît en haut de chaque formulaire.', ar:'يُدخَل مرة واحدة بالفرنسية والعربية، ويظهر أعلى كل استمارة.'}},
  {el:'#expl-lang', before:function(){ go(1); }, title:{fr:'Expliquer dans la langue du patient', ar:'الشرح بلغة المريض'}, body:{fr:'L’explication s’affiche en grand, en <b>français</b>, en <b>arabe</b> ou en <b>tunisien</b> (derja). Tournez l’écran vers le patient.', ar:'يظهر الشرح بخط كبير بـ<b>الفرنسية</b> أو <b>العربية</b> أو <b>التونسية</b> (الدارجة). أدِر الشاشة نحو المريض.'}},
  {el:'#risks', before:function(){ go(2); }, title:{fr:'Cocher les risques expliqués', ar:'التأشير على المخاطر المشروحة'}, body:{fr:'Chaque risque a sa <b>fréquence</b> (« 1 à 3 sur 100 »). Cochez-le une fois expliqué : la case sera cochée sur le formulaire imprimé.', ar:'لكل خطر <b>نسبته</b> («من 1 إلى 3 من كل 100»). أشِّر عليه بعد شرحه، وستظهر العلامة في الاستمارة المطبوعة.'}},
  {el:'#notes', before:function(){ go(3); }, title:{fr:'Notes complémentaires', ar:'ملاحظات إضافية'}, body:{fr:'Facultatif : allergie, précaution, accord pour un geste associé… Le texte est imprimé tel quel.', ar:'اختياري: حساسية، احتياط، موافقة على إجراء مرافق… يُطبع النص كما هو.'}},
  {el:'#print-lang', before:function(){ go(4); }, title:{fr:'Un formulaire, une seule langue', ar:'استمارة بلغة واحدة'}, body:{fr:'Le formulaire est <b>entièrement en français</b> ou <b>entièrement en arabe standard</b>, au choix du patient.', ar:'الاستمارة <b>كاملة بالفرنسية</b> أو <b>كاملة بالعربية الفصحى</b> حسب اختيار المريض.'}},
  {el:'#print', title:{fr:'Imprimer ou enregistrer en PDF', ar:'الطباعة أو الحفظ بصيغة PDF'}, body:{fr:'Ouvre l’impression A4. Pour un PDF, choisissez « Enregistrer au format PDF » comme imprimante.', ar:'يفتح الطباعة بحجم A4. للحصول على PDF اختر «حفظ بصيغة PDF» كطابعة.'}},
  {el:'#out-actions', title:{fr:'Depuis le téléphone, sans Internet au service', ar:'من الهاتف، دون إنترنت في القسم'}, body:{fr:'<b>Envoyer</b> ouvre le partage du téléphone (e-mail, WhatsApp…). <b>Fichier à imprimer</b> crée un document autonome à ouvrir sur le PC relié à l’imprimante, même hors ligne. <b>Copier le texte</b> pour le coller ailleurs.', ar:'<b>إرسال</b> يفتح مشاركة الهاتف (بريد، واتساب…). <b>ملف للطباعة</b> يُنشئ وثيقة مستقلة تُفتح على الحاسوب المتصل بالطابعة حتى دون اتصال. <b>نسخ النص</b> للصقه في مكان آخر.'}, after:function(){ go(0); }}
]);
})();
</script>
</body>
</html>
