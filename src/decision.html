<style>
:root{--c-none:#cfd6de;--c-ev:#c42537;--c-avoid:#2f7fd8;--c-harm:#e08a00;--c-harm2:#7c5cc4}
:root[data-theme="dark"]{--c-none:#3a434e;--c-ev:#ff5b6b;--c-avoid:#5aa5ff;--c-harm:#f0a73c;--c-harm2:#a68cf0}
.da-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.da-act{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lay{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:16px;align-items:start}
@media (max-width:980px){.lay{grid-template-columns:minmax(0,1fr)}}
.prof{display:flex;flex-direction:column;gap:16px}
.q{display:flex;flex-direction:column;gap:8px}
.q>.ql{font-size:.86rem;font-weight:650;color:var(--fg-2);display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.q>.ql small{font-weight:500;color:var(--muted)}
.agebox{display:flex;align-items:center;gap:8px}
.agebox .inp{width:84px;text-align:center;font-weight:700;font-size:1.1rem}
.agebox .btn{width:44px;padding:0;font-size:1.2rem}
.sub{border-inline-start:3px solid var(--accent-soft);padding-inline-start:12px;display:flex;flex-direction:column;gap:14px}
.res{position:sticky;top:calc(70px + env(safe-area-inset-top,0px))}
@media (max-width:980px){.res{position:static}}
.gauge{display:flex;flex-direction:column;gap:8px}
.gbar{position:relative;height:16px;border-radius:10px;display:flex;overflow:visible}
.gbar span{flex:1;height:100%}
.gbar span:first-child{border-radius:10px 0 0 10px}.gbar span:last-child{border-radius:0 10px 10px 0}
[dir="rtl"] .gbar span:first-child{border-radius:0 10px 10px 0}[dir="rtl"] .gbar span:last-child{border-radius:10px 0 0 10px}
.gbar .mk{position:absolute;top:-6px;width:4px;height:28px;border-radius:3px;background:var(--fg);box-shadow:0 0 0 3px var(--surface);transition:inset-inline-start .35s cubic-bezier(.2,.8,.2,1)}
.glab{display:flex;justify-content:space-between;font-size:.74rem;color:var(--muted)}
.bignum{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.bignum b{font-family:var(--font-display);font-size:3rem;line-height:1;font-weight:750;letter-spacing:-.03em}
.bignum .cat{font-size:1.05rem;font-weight:700}
.lv-ok{color:var(--ok)} .lv-warn{color:var(--warn)} .lv-high{color:#d4572a} .lv-crit{color:var(--crit)}
/* Couleurs de la figure ESC/EAS 2025 : jaune, orange, rouge, rouge foncé, bordeaux */
:root{--r-low:#e9c11e;--r-mod:#f08c00;--r-high:#e8590c;--r-vhigh:#c0392b;--r-ext:#7b1d2a}
.lvscale{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.lvs{padding:8px 2px;border-radius:8px;text-align:center;font-size:.74rem;font-weight:650;background:var(--surface-2);color:var(--muted);border:2px solid transparent;position:relative}
.lvs::after{content:"";position:absolute;inset:auto 6px 3px;height:3px;border-radius:3px;background:var(--rc);opacity:.7}
.lvs-low{--rc:var(--r-low)} .lvs-mod{--rc:var(--r-mod)} .lvs-high{--rc:var(--r-high)} .lvs-vhigh{--rc:var(--r-vhigh)} .lvs-extreme{--rc:var(--r-ext)}
.lvs.on{background:var(--rc);color:#fff;border-color:var(--rc);box-shadow:0 3px 10px color-mix(in srgb,var(--rc) 40%,transparent)}
.lvs.on.lvs-low{color:#3a2f00}
.lvs.on::after{display:none}
.lv-ext{color:var(--r-ext)}
:root[data-theme="dark"] .lv-ext{color:#ff8a8a}
.badge.lvb-low{background:#fbf1c4;color:#6b5600} .badge.lvb-mod{background:#fde3c2;color:#8a4b00} .badge.lvb-high{background:#fbd9c6;color:#a33d07} .badge.lvb-vhigh{background:var(--crit-soft);color:var(--crit)} .badge.lvb-extreme{background:#f1d0d5;color:var(--r-ext)}
/* Grille KDIGO */
.kdigo{display:grid;grid-template-columns:64px repeat(3,minmax(0,1fr));gap:4px;max-width:420px}
.kh{display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.72rem;color:var(--muted);line-height:1.15;text-align:center}
.kh b{color:var(--fg-2);font-size:.8rem}
.kv{align-items:flex-start}
.kc{height:38px;border-radius:8px;border:2px solid transparent;cursor:pointer;display:grid;place-items:center;color:#fff}
.kc svg{width:18px;height:18px}
.k-g{background:#b9dfa8} .k-y{background:#f5e58c} .k-o{background:#f7b26b} .k-r{background:#ec8f8b}
.kc.on{border-color:var(--fg);box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--fg);color:var(--fg)}
:root[data-theme="dark"] .k-g{background:#3d6b33} :root[data-theme="dark"] .k-y{background:#7a6d1c} :root[data-theme="dark"] .k-o{background:#8a521c} :root[data-theme="dark"] .k-r{background:#8a2f2b}
.why{margin:0;padding-inline-start:18px;display:flex;flex-direction:column;gap:4px}
.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:620px){.opts{grid-template-columns:minmax(0,1fr)}}
.opt{border:1.5px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px;background:var(--surface)}
.opt.fav{border-color:var(--ok);background:color-mix(in srgb,var(--ok-soft) 60%,var(--surface))}
.opt.pos{border-color:color-mix(in srgb,var(--warn) 50%,var(--line))}
.opt.no{opacity:.75}
.opt h4{font-size:1rem}
.opt ul{margin:0;padding-inline-start:18px;font-size:.82rem;color:var(--fg-2);display:flex;flex-direction:column;gap:3px}
.arrays{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.arr{border:1px solid var(--line);border-radius:var(--r-lg);padding:14px;background:var(--surface);display:flex;flex-direction:column;gap:10px}
.arr h3{font-size:1rem}
.arr svg{width:100%;height:auto;max-width:280px;align-self:center}
.arr .cnt{display:flex;flex-direction:column;gap:4px;font-size:.86rem}
.arr .cnt div{display:flex;align-items:center;gap:8px}
.arr .cnt b{margin-inline-start:auto;font-variant-numeric:tabular-nums;white-space:nowrap}
.sw{width:12px;height:12px;border-radius:3px;flex:none}
.summary{font-size:1.08rem;line-height:1.65}
[dir="rtl"].summary{font-family:var(--font-ar);font-size:1.22rem;line-height:1.9}
.ph-head{display:none}
.mbar{display:none}
@media (max-width:980px){
  .mbar{display:flex;position:fixed;inset-inline:12px;bottom:calc(var(--tabbar-h) + 10px);z-index:30;align-items:center;gap:12px;padding:10px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-lg);cursor:pointer}
  .mbar b{font-size:1.3rem;font-family:var(--font-display)}
  main.wrap{padding-bottom:90px}
}
body.patient #prof-card,body.patient .tabs,body.patient #src,body.patient #reco{display:none}
body.patient .lay{grid-template-columns:minmax(0,1fr)}
body.patient .summary{font-size:1.35rem}
body.patient [dir="rtl"].summary{font-size:1.5rem}
@page{size:A4;margin:14mm}
@media print{
  .da-top,#prof-card,.mbar{display:none!important}
  .lay{display:block}
  .res{position:static}
  .ph-head{display:flex;justify-content:space-between;border-bottom:2px solid #111;padding-bottom:8px;margin-bottom:12px;color:#111}
  .arrays{grid-template-columns:repeat(2,minmax(0,1fr))}
  .arr{break-inside:avoid;border-color:#bbb}
}

<body>
<header id="cs-top"></header>
<main class="wrap stack">
  <div class="da-top">
    <div class="tabs" role="tablist" id="tabs"></div>
    <div class="da-act" id="acts"></div>
  </div>
  <div class="lay">
    <section class="card prof" id="prof-card"></section>
    <section class="res stack" id="res"></section>
  </div>
</main>
<div class="mbar" id="mbar" role="button" tabindex="0"></div>
<footer id="cs-foot"></footer>
<script>
(function(){
'use strict';
var h = CS.h, fmt = CS.fmt, T = CS.t, E = CS.esc;
var pt = CS.patient();
var st = CS.store.get('decision', null) || {
  sc:'statin', lang:CS.lang(),
  s:{},
  t:{age:pt.age || 76, sex:pt.sex || 'm', renal:'m', nyha:'3', lv:'g', pa:'n', flags:[], femoral:'ok', valve:'tri', cad:'no', life:'ok'}
};
st.s = Object.assign({score:'globo', sex:pt.sex || 'm', age:pt.age || 58, rf:['hta'], sbp:150, tc:5.5, hdl:1.15, dm:'0', dmtype:'2', dmdur:'lt10', dmtod:'0', agediab:null, a1c:7.5, egfr:75,
  ascvd:[], other:[], ckdG:null, ckdA:null, region:'high', inten:'high'}, st.s || {});
function save(){ CS.store.set('decision', st); }
function P(x){ return CS.t(x, st.lang); }  // texte destiné au patient (fr / ar / tn)
var LV = {
  low:{c:'ok', fr:'Faible', ar:'منخفض', tn:'ضعيف'},
  lowmod:{c:'ok', fr:'Faible à modéré', ar:'منخفض إلى متوسط', tn:'ضعيف ولا متوسّط'},
  mod:{c:'warn', fr:'Modéré', ar:'متوسط', tn:'متوسّط'},
  high:{c:'high', fr:'Élevé', ar:'مرتفع', tn:'عالي'},
  vhigh:{c:'crit', fr:'Très élevé', ar:'مرتفع جدًا', tn:'عالي برشا'},
  extreme:{c:'ext', fr:'Extrême', ar:'أقصى', tn:'خطير برشا'}
};

/* ---------- Contrôles du profil ---------- */
function chips(key, obj, opts, multi, onChange){
  var row = h('div', {class:'chips', id:'q-' + key});
  opts.forEach(function(o){
    var v = String(o[0]);
    var on = multi ? (obj[key] || []).indexOf(v) >= 0 : String(obj[key]) === v;
    row.appendChild(h('button', {class:'chip', type:'button', 'aria-pressed':on ? 'true' : 'false', html:CS.I.check.replace('<svg', '<svg class="ck"') + '<span>' + E(T(o[1])) + '</span>', onclick:function(){
      if(multi){ var a = obj[key] || []; var i = a.indexOf(v); if(i >= 0) a.splice(i, 1); else a.push(v); obj[key] = a; }
      else obj[key] = o[0];
      save(); (onChange || render)();
    }}));
  });
  return row;
}
/* Valeur exacte facultative à côté des tranches (demande d'Anis : « on coche, puis on entre les valeurs ») */
function exact(key, obj, unit, toStore, fromStore){
  var inp = h('input', {class:'inp', inputmode:'decimal', id:'x-' + key, style:{width:'96px', minHeight:'40px'}, placeholder:T({fr:'exacte', ar:'بدقّة'}), value:obj[key + 'X'] ? fmt(fromStore(+obj[key]), unit === 'mmol/L' ? 1 : 0) : ''});
  inp.addEventListener('change', function(){
    var v = CS.num(inp.value);
    if(isNaN(v)){ obj[key + 'X'] = false; } else { obj[key] = toStore(v); obj[key + 'X'] = true; }
    save(); render();
  });
  return h('div', {class:'row', style:{gap:'6px'}}, inp, h('span', {class:'small muted', text:unit}));
}
function q(label, hint, ctl){ return h('div', {class:'q'}, h('div', {class:'ql'}, h('span', {text:label}), hint ? h('small', {text:hint}) : null), ctl); }
function ageCtl(obj, min, max){
  var inp = h('input', {class:'inp', id:'age', inputmode:'numeric', value:obj.age});
  function set(v){ v = CS.clamp(Math.round(v), min, max); obj.age = v; inp.value = v; save(); renderRes(); renderSub(); }
  inp.addEventListener('change', function(){ var v = CS.num(inp.value); if(!isNaN(v)) set(v); else inp.value = obj.age; });
  inp.addEventListener('keydown', function(e){ if(e.key === 'Enter') inp.blur(); });
  return h('div', {class:'agebox'},
    h('button', {class:'btn', type:'button', 'aria-label':'−1', text:'−', onclick:function(){ set(obj.age - 1); }}), inp,
    h('button', {class:'btn', type:'button', 'aria-label':'+1', text:'+', onclick:function(){ set(obj.age + 1); }}),
    h('span', {class:'muted', text:{fr:'ans', ar:'سنة'}}));
}
var subHost = null, renderSub = function(){};
function cholLabel(lo, hi, kind){ // libellés de tranches en mg/dL ou mmol/L
  var f = function(x){ return CS.units() === 'si' ? fmt(x, 1) : fmt(Math.round(x * 38.67)); };
  if(lo == null) return '< ' + f(hi);
  if(hi == null) return '≥ ' + f(lo);
  return f(lo) + '–' + f(hi);
}

/* ---------- Statine : calcul ----------
   Catégories et objectifs de LDL-C : figure ESC/EAS 2025 (mise à jour dyslipidémies), transmise par Anis.
   Score de risque : Globorisk calibré pour la Tunisie (« en Tunisie, à la place de SCORE2, on a Globorisk »),
   SCORE2/SCORE2-OP au choix. Facteurs de risque majeurs : liste d'Anis (HTA, tabac, obésité, sédentarité,
   âge > 55 ans H / > 65 ans F, dyslipidémie). IRC : grille KDIGO DFG × albuminurie. Le niveau retenu est le plus élevé. */
var ORD = {low:0, mod:1, high:2, vhigh:3, extreme:4};
var RF = [['hta', {fr:'Hypertension artérielle', ar:'ارتفاع ضغط الدم'}], ['smoke', {fr:'Tabagisme', ar:'التدخين'}], ['obese', {fr:'Obésité', ar:'السمنة'}],
  ['sed', {fr:'Sédentarité', ar:'قلة النشاط البدني'}], ['dyslip', {fr:'Dyslipidémie', ar:'اضطراب الدهون'}]];
var KG = [['G1', '≥ 90'], ['G2', '60–89'], ['G3a', '45–59'], ['G3b', '30–44'], ['G4', '15–29'], ['G5', '< 15']], KA = [['A1', '< 30'], ['A2', '30–299'], ['A3', '≥ 300']];
// Couleur de la case (carte de chaleur KDIGO) et sévérité retenue par l'ESC
function ckdCell(g, a){
  var gi = ['G1', 'G2', 'G3a', 'G3b', 'G4', 'G5'].indexOf(g), ai = ['A1', 'A2', 'A3'].indexOf(a);
  var heat = gi <= 1 ? ['g', 'y', 'o'][ai] : gi === 2 ? ['y', 'o', 'r'][ai] : gi === 3 ? ['o', 'r', 'r'][ai] : 'r';
  var sev = gi >= 4 || (gi === 3 && ai >= 1) ? 'severe' : gi >= 2 || ai === 2 ? 'moderate' : null;
  return {heat:heat, sev:sev};
}
function nRF(s){
  var n = (s.rf || []).length;
  if((s.sex === 'm' && s.age > 55) || (s.sex === 'f' && s.age > 65)) n++;
  return n;
}
function scoreCalc(s){
  var o = {female:s.sex === 'f', age:s.age, smoker:(s.rf || []).indexOf('smoke') >= 0, sbp:+s.sbp, tc:+s.tc, hdl:+s.hdl, region:s.region, diabetes:s.dm === '1', dm:s.dm === '1'};
  if(s.score === 'score2'){
    if(s.age < 40 || s.age > 89) return {model:'SCORE2', r:NaN, why:{fr:'SCORE2 : validé de 40 à 89 ans', ar:'SCORE2: معتمد من 40 إلى 89 سنة'}};
    if(o.diabetes && s.age < 70){ o.agediab = s.agediab || Math.max(18, s.age - 5); o.a1c = RISK.a1cToMmol(+s.a1c); o.egfr = +s.egfr; return {model:'SCORE2-Diabetes', r:RISK.score2dm(o) * 100}; }
    return s.age >= 70 ? {model:'SCORE2-OP', r:RISK.score2op(o) * 100} : {model:'SCORE2', r:RISK.score2(o) * 100};
  }
  var g = RISK.globorisk(o);
  if(isNaN(g)) return {model:'Globorisk', r:NaN, why:{fr:'Globorisk : calibré de 40 à 80 ans', ar:'Globorisk: معاير من 40 إلى 80 سنة'}};
  return {model:'Globorisk (Tunisie)', r:g * 100};
}
function statinCalc(){
  var s = st.s, reasons = [], cat = null, oth = s.other || [];
  function add(c, why){ reasons.push({cat:c, why:why}); if(cat == null || ORD[c] > ORD[cat]) cat = c; }
  var asc = s.ascvd || [], n = nRF(s), dm = s.dm === '1', t1 = s.dmtype === '1', dur = s.dmdur;
  var ck = s.ckdG && s.ckdA ? ckdCell(s.ckdG, s.ckdA) : null;
  // Prévention secondaire
  if(asc.indexOf('ascvd') >= 0){
    if(asc.indexOf('recur') >= 0 || asc.indexOf('poly') >= 0) add('extreme', {fr:'Maladie CV avec récidive sous statine maximale tolérée, ou atteinte polyvasculaire', ar:'مرض قلبي وعائي مع انتكاس رغم أقصى جرعة ستاتين، أو إصابة متعددة الأوعية'});
    else add('vhigh', {fr:'Maladie CV athéroscléreuse avérée (clinique ou imagerie)', ar:'مرض قلبي وعائي تصلّبي مؤكَّد (سريريًا أو بالتصوير)'});
  }
  // Hypercholestérolémie familiale
  var nNoDys = n - ((s.rf || []).indexOf('dyslip') >= 0 ? 1 : 0);
  if(oth.indexOf('fh') >= 0) add(asc.indexOf('ascvd') >= 0 || nNoDys > 0 ? 'vhigh' : 'high', asc.indexOf('ascvd') >= 0 || nNoDys > 0 ? {fr:'HF avec maladie CV ou un autre facteur majeur', ar:'فرط كوليسترول عائلي مع مرض قلبي أو عامل رئيسي آخر'} : {fr:'HF sans autre facteur majeur', ar:'فرط كوليسترول عائلي دون عامل رئيسي آخر'});
  // IRC
  if(ck && ck.sev === 'severe') add('vhigh', {fr:'IRC sévère (' + s.ckdG + ' ' + s.ckdA + ')', ar:'قصور كلوي شديد (' + s.ckdG + ' ' + s.ckdA + ')'});
  else if(ck && ck.sev === 'moderate') add('high', {fr:'IRC modérée (' + s.ckdG + ' ' + s.ckdA + ')', ar:'قصور كلوي متوسط (' + s.ckdG + ' ' + s.ckdA + ')'});
  // Facteur isolé très élevé
  if(oth.indexOf('single') >= 0 || +s.sbp >= 180) add('high', {fr:'Facteur isolé très élevé (CT > 8 mmol/L, LDL-C > 4,9 mmol/L ou PA ≥ 180/110)', ar:'عامل منفرد مرتفع جدًا (كوليسترول كلي > 8 أو LDL > 4,9 مليمول/ل أو ضغط ≥ 180/110)'});
  // Diabète
  if(dm){
    if(s.dmtod === '1' || n >= 3 || (t1 && dur === 'gt20')) add('vhigh', {fr:'Diabète avec atteinte d’organe cible, ≥ 3 facteurs majeurs, ou DT1 précoce de longue durée (> 20 ans)', ar:'سكري مع إصابة عضو مستهدف، أو 3 عوامل رئيسية فأكثر، أو سكري نوع 1 مبكر وطويل (> 20 سنة)'});
    else if(dur !== 'lt10' || n >= 1) add('high', {fr:'Diabète sans atteinte d’organe, ≥ 10 ans d’évolution ou autre facteur de risque', ar:'سكري دون إصابة عضوية، منذ 10 سنوات فأكثر أو مع عامل خطر آخر'});
    else if((t1 && s.age < 35) || (!t1 && s.age < 50)) add('mod', {fr:'Diabète du sujet jeune (DT1 < 35 ans, DT2 < 50 ans), < 10 ans d’évolution, sans autre facteur', ar:'سكري لدى شاب (نوع 1 < 35 سنة، نوع 2 < 50 سنة)، أقل من 10 سنوات، دون عامل آخر'});
  }
  // Score (prévention primaire)
  var sc = null;
  if(asc.indexOf('ascvd') < 0){
    sc = scoreCalc(s);
    if(!isNaN(sc.r)) add(sc.r >= 20 ? 'vhigh' : sc.r >= 10 ? 'high' : sc.r >= 2 ? 'mod' : 'low', {fr:sc.model + ' : ' + fmt(sc.r, 1) + ' % à 10 ans', ar:sc.model + ': ' + fmt(sc.r, 1) + ' % خلال 10 سنوات'});
    else if(sc.why) reasons.push({cat:null, why:sc.why});
  }
  return {cat:cat, risk:sc && !isNaN(sc.r) ? sc.r : null, model:sc ? sc.model : null, reasons:reasons, n:n};
}
var LVL = [['low', LV.low], ['mod', LV.mod], ['high', LV.high], ['vhigh', LV.vhigh], ['extreme', LV.extreme]];
function levelScale(cat){
  return h('div', {class:'lvscale', id:'lvscale'}, LVL.map(function(x){ return h('div', {class:'lvs lvs-' + x[0] + (cat === x[0] ? ' on' : '')}, h('span', {text:x[1]})); }));
}
/* Objectif de LDL-C et classe de recommandation (figure ESC/EAS 2025) */
var RECO = {
  low:{fr:'Objectif LDL-C < 3,0 mmol/L (116 mg/dL) · classe IIb. Hygiène de vie en premier.', ar:'هدف LDL أقل من 3,0 مليمول/ل (116 ملغ/دل) · الفئة IIb. نمط الحياة أولًا.'},
  mod:{fr:'Objectif LDL-C < 2,6 mmol/L (100 mg/dL) · classe IIa.', ar:'هدف LDL أقل من 2,6 مليمول/ل (100 ملغ/دل) · الفئة IIa.'},
  high:{fr:'Objectif LDL-C < 1,8 mmol/L (70 mg/dL) et baisse ≥ 50 % · classe I.', ar:'هدف LDL أقل من 1,8 مليمول/ل (70 ملغ/دل) وانخفاض 50% على الأقل · الفئة I.'},
  vhigh:{fr:'Objectif LDL-C < 1,4 mmol/L (55 mg/dL) et baisse ≥ 50 % · classe I (IIa en prévention primaire d’une HF à très haut risque).', ar:'هدف LDL أقل من 1,4 مليمول/ل (55 ملغ/دل) وانخفاض 50% على الأقل · الفئة I (IIa في الوقاية الأولية لفرط الكوليسترول العائلي).'},

/* ---------- TAVI : calcul ---------- */
function taviCalc(){
  var v = st.t, f = v.flags || [], has = function(k){ return f.indexOf(k) >= 0; };
  var es = RISK.euroscore2({age:v.age, female:v.sex === 'f', renal:v.renal, nyha:+v.nyha, lv:v.lv, pa:v.pa, art:has('art'), mob:has('mob'), redo:has('redo'), lung:has('lung'), ins:has('ins'), mi:has('mi'), wt:1});
  var esCat = es >= 8 ? 'vhigh' : es >= 4 ? 'high' : 'low';
  var frail = has('frail'), porcel = has('porc'), hostile = has('chest');
  var surgHard = frail || porcel || hostile || es >= 8;
  var fem = v.femoral === 'ok', tri = v.valve === 'tri', cad = v.cad === 'complex', life = v.life === 'short';
  var O = {tavi:{s:'pos', r:[]}, surg:{s:'pos', r:[]}, med:{s:'no', r:[]}};
  function R(k, x){ O[k].r.push(x); }
  if(life){
    O.med.s = 'fav'; R('med', {fr:'Espérance de vie < 1 an ou comorbidité sévère : bénéfice improbable de l’intervention (futilité).', ar:'أمد حياة متوقَّع أقل من سنة أو مرض مرافق شديد: فائدة التدخل غير مرجَّحة.'});
    O.tavi.s = 'no'; O.surg.s = 'no'; R('tavi', {fr:'Discuter en Heart Team ; privilégier le confort.', ar:'يُناقَش في فريق القلب؛ مع إعطاء الأولوية للراحة.'}); R('surg', {fr:'Non adaptée dans ce contexte.', ar:'غير ملائمة في هذا السياق.'});
  } else {
    R('med', {fr:'RA serré symptomatique : sans intervention, survie moyenne de 2 à 3 ans.', ar:'تضيّق أبهري شديد مع أعراض: دون تدخل، متوسط البقاء من سنتين إلى 3 سنوات.'});
    // TAVI
    if(!fem){ O.tavi.s = 'pos'; R('tavi', {fr:'Accès fémoral non adapté : voie alternative possible en centre expert.', ar:'المدخل الفخذي غير ملائم: يمكن اعتماد مدخل بديل في مركز متخصّص.'}); }
    if(fem && tri && v.age >= 70){ O.tavi.s = 'fav'; R('tavi', {fr:'≥ 70 ans, valve tricuspide, accès fémoral : TAVI recommandée quel que soit le risque chirurgical (ESC 2025, classe I).', ar:'70 سنة فأكثر، صمام ثلاثي الشرف، مدخل فخذي ملائم: يوصى بـ TAVI مهما كان الخطر الجراحي (ESC 2025، الفئة I).'}); }
    else if(fem && surgHard){ O.tavi.s = 'fav'; R('tavi', {fr:'Risque chirurgical élevé ou chirurgie difficile : TAVI privilégiée.', ar:'خطر جراحي مرتفع أو جراحة صعبة: تُفضَّل TAVI.'}); }
    else if(fem && v.age < 70){ R('tavi', {fr:'< 70 ans : TAVI à discuter en Heart Team (durabilité, gestion à vie de la valve).', ar:'أقل من 70 سنة: تُناقَش TAVI في فريق القلب (متانة الصمام وتدبيره مدى الحياة).'}); }
    if(!tri){ if(O.tavi.s === 'fav') O.tavi.s = 'pos'; R('tavi', {fr:'Bicuspidie : données plus limitées, anatomie à évaluer au scanner.', ar:'صمام ثنائي الشرف: المعطيات أقل، ويجب تقييم التشريح بالمفراس.'}); }
    if(cad){ R('tavi', {fr:'Coronaropathie complexe : revascularisation à planifier.', ar:'مرض تاجي معقّد: يجب التخطيط لإعادة التروية.'}); }
    // Chirurgie
    if(surgHard){ O.surg.s = 'no'; R('surg', {fr:'Risque opératoire élevé ou chirurgie difficile (' + [es >= 8 ? 'EuroSCORE II ≥ 8 %' : '', frail ? 'fragilité' : '', porcel ? 'aorte porcelaine' : '', hostile ? 'thorax hostile' : ''].filter(Boolean).join(', ') + ').', ar:'خطر جراحي مرتفع أو جراحة صعبة.'}); }
    else if(v.age < 70 && es < 4){ O.surg.s = 'fav'; R('surg', {fr:'< 70 ans et risque opératoire faible : chirurgie (RVA) recommandée.', ar:'أقل من 70 سنة وخطر جراحي منخفض: يوصى بالجراحة (استبدال الصمام).'}); }
    else { R('surg', {fr:'Alternative valable : en discuter (durabilité, préférences du patient).', ar:'بديل مقبول: يُناقَش (متانة الصمام وتفضيلات المريض).'}); }
    if(!surgHard && (cad || !tri)){ if(O.surg.s !== 'fav'){ O.surg.s = v.age < 75 ? 'fav' : 'pos'; } R('surg', {fr:cad ? 'Coronaropathie complexe : chirurgie combinée (RVA + pontages) possible.' : 'Bicuspidie : la chirurgie reste la référence si l’opérabilité le permet.', ar:cad ? 'مرض تاجي معقّد: جراحة مشتركة (استبدال الصمام مع المجازة) ممكنة.' : 'صمام ثنائي الشرف: تبقى الجراحة المرجع إن سمحت الحالة.'}); }
    if(O.tavi.s === 'fav' && O.surg.s === 'fav') O.surg.s = 'pos';
    // Points pratiques soulevés par Anis : durabilité de la bioprothèse et coût en Tunisie
    R('tavi', {fr:'Valve biologique : durabilité de l’ordre de 10 ans ; coût élevé et accès limité en Tunisie.', ar:'صمام بيولوجي: متانة في حدود 10 سنوات؛ كلفة مرتفعة وإتاحة محدودة في تونس.'});
    if(O.surg.s !== 'no') R('surg', {fr:'Plus lourde (sternotomie, convalescence), mais valve plus durable ; mécanique possible chez le sujet jeune (AVK à vie).', ar:'أثقل (شقّ القصّ ونقاهة أطول) لكن الصمام أمتن؛ ويمكن اختيار صمام ميكانيكي لدى الشاب (مضادّ تخثّر مدى الحياة).'});
    if(v.age >= 65 && v.age < 75 && !surgHard) R('tavi', {fr:'Zone intermédiaire d’âge : décision en réunion Heart Team (cardiologue, chirurgien, anesthésiste).', ar:'سنّ وسطى: يُتّخذ القرار في اجتماع فريق القلب (طبيب القلب والجرّاح وطبيب التخدير).'});
  }
  return {es:es, esCat:esCat, O:O, surgHard:surgHard, life:life, fem:fem, inop:porcel || hostile || es >= 8, low:es < 4 && !frail && !porcel && !hostile};
}

/* ---------- Pictogrammes ---------- */
function iconArray(cats){
  var counts = cats.map(function(c){ return Math.round(c.n); });
  var cells = []; cats.forEach(function(c, i){ for(var k = 0; k < counts[i]; k++) cells.push(c.k); });
  while(cells.length < 100) cells.push('none'); cells = cells.slice(0, 100);
  var s = '<svg viewBox="0 0 250 320" role="img" dir="ltr" aria-label="100">';
  cells.forEach(function(k, i){
    var x = (i % 10) * 25, y = Math.floor(i / 10) * 32, col = 'var(--c-' + k + ')';
    s += '<g transform="translate(' + x + ' ' + y + ')"><circle cx="12.5" cy="7" r="5" style="fill:' + col + '"/><path d="M4 30 C4 19 8 14 12.5 14 C17 14 21 19 21 30Z" style="fill:' + col + '"/></g>';
  });
  return s + '</svg>';
}
function arraysEl(list){
  var box = h('div', {class:'arrays', id:'arrays'}), d = st.lang === 'fr' ? 'ltr' : 'rtl';
  list.forEach(function(a){
    var cnt = h('div', {class:'cnt'});
    a[1].forEach(function(c){ cnt.appendChild(h('div', {dir:d}, h('span', {class:'sw', style:{background:'var(--c-' + c.k + ')'}}), h('span', {text:P(c.l)}), h('b', {text:(c.n < 1 && c.n > 0 ? '< 1' : fmt(c.n, c.n < 10 && c.n % 1 ? 1 : 0)) + ' / 100'}))); });
    var none = 100 - a[1].reduce(function(s, c){ return s + Math.round(c.n); }, 0);
    cnt.appendChild(h('div', {dir:d}, h('span', {class:'sw', style:{background:'var(--c-none)'}}), h('span', {text:P({fr:'Aucun de ces événements', ar:'لا شيء من هذه الأحداث', tn:'ما صار شي'})}), h('b', {text:Math.max(0, none) + ' / 100'})));
    box.appendChild(h('div', {class:'arr'}, h('h3', {dir:d, text:P(a[0])}), h('div', {html:iconArray(a[1])}), cnt));
  });
  return box;
}
/* Jauge : segs = [[fin du segment, couleur], …] en unités de la valeur ; graduations aux limites */
function gauge(val, max, segs){
  var pos = CS.clamp(val / max, 0, 1) * 100, prev = 0;
  var bar = h('div', {class:'gbar'});
  segs.forEach(function(s){ bar.appendChild(h('span', {style:{background:s[1], flex:'0 0 ' + ((Math.min(s[0], max) - prev) / max * 100) + '%'}})); prev = Math.min(s[0], max); });
  bar.appendChild(h('i', {class:'mk', style:{insetInlineStart:'calc(' + pos + '% - 2px)'}}));
  var lab = h('div', {class:'glab', style:{position:'relative', height:'16px'}});
  [0].concat(segs.slice(0, -1).map(function(s){ return s[0]; })).forEach(function(x){ lab.appendChild(h('span', {style:{position:'absolute', insetInlineStart:(x / max * 100) + '%', transform:CS.isAr() ? 'translateX(50%)' : 'translateX(-50%)'}, text:fmt(x, x % 1 ? 1 : 0) + (x ? ' %' : '')})); });
  lab.appendChild(h('span', {style:{position:'absolute', insetInlineEnd:'0'}, text:fmt(max) + ' %+'}));
  return h('div', {class:'gauge', id:'gauge'}, bar, lab);
}
