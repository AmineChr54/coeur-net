<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Scores de risque</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Cœur Net — socle commun
   Barre supérieure collante, contenu centré (max 1240px), grilles qui passent en une colonne sur téléphone,
   barre d'onglets en bas sur téléphone. Propriétés logiques partout : l'arabe (RTL) se retourne tout seul. */
:root{
  --bg:#f3f6f9; --surface:#ffffff; --surface-2:#f0f4f8; --surface-3:#e3e9ef;
  --line:#dde4eb; --line-strong:#c3cdd7;
  --fg:#0f1d2b; --fg-2:#2d3e50; --muted:#5b6b7b;
  --accent:#0b6e99; --accent-hover:#085a7e; --accent-ink:#ffffff; --accent-soft:#e2f0f6;
  --heart:#d64545; --heart-soft:#fde9e9;
  --ok:#137a4b; --ok-soft:#e2f4ea; --warn:#975a00; --warn-soft:#fdf1dc;
  --crit:#b42318; --crit-soft:#fde7e5; --info:#1d5ea8; --info-soft:#e4eefa;
  --g-echo:#0b6e99; --g-patient:#7a4bc4; --g-calc:#137a4b; --g-learn:#c26a00;
  --paper:#fff8f6; --grid-minor:#f5cfcf; --grid-major:#e59a9a; --trace:#1a1a1a;
  --shadow:0 1px 2px rgba(15,29,43,.05);
  --shadow-md:0 4px 14px rgba(15,29,43,.08);
  --shadow-lg:0 12px 36px rgba(15,29,43,.16);
  --font:"Segoe UI Variable Text","Segoe UI",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Roboto,Arial,sans-serif;
  --font-display:"Segoe UI Variable Display","Segoe UI",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Roboto,Arial,sans-serif;
  --font-ar:"Segoe UI","SF Arabic","Geeza Pro","Noto Sans Arabic","Noto Naskh Arabic",Tahoma,sans-serif;
  --mono:ui-monospace,"Cascadia Mono","SF Mono",Consolas,Menlo,monospace;
  --r:10px; --r-sm:8px; --r-lg:14px;
  --tabbar-h:0px;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0e1114; --surface:#161a1f; --surface-2:#1d2228; --surface-3:#272d35;
  --line:#2a3139; --line-strong:#3a434e;
  --fg:#e9ebee; --fg-2:#c9ced5; --muted:#9aa3ae;
  --accent:#4fb3dd; --accent-hover:#72c4e6; --accent-ink:#04202d; --accent-soft:#11303d;
  --heart:#ff7a7a; --heart-soft:#3a1717;
  --ok:#4fc68b; --ok-soft:#132d20; --warn:#f0a73c; --warn-soft:#33250f;
  --crit:#ff6d62; --crit-soft:#3a1714; --info:#6ea9f0; --info-soft:#13263c;
  --g-echo:#4fb3dd; --g-patient:#b08ef0; --g-calc:#4fc68b; --g-learn:#f0a73c;
  --paper:#1a1416; --grid-minor:#3b2529; --grid-major:#663840; --trace:#f3eeee;
  --shadow:0 1px 2px rgba(0,0,0,.4);
  --shadow-md:0 4px 14px rgba(0,0,0,.4);
  --shadow-lg:0 12px 36px rgba(0,0,0,.6);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased;overflow-x:hidden}
html[lang="ar"] body{font-family:var(--font-ar);font-size:15.5px;line-height:1.65}
html[lang="ar"] h1,html[lang="ar"] h2,html[lang="ar"] h3,html[lang="ar"] h4{font-family:var(--font-ar);letter-spacing:0}
html[lang="ar"] .eyebrow{letter-spacing:0;text-transform:none;font-size:.78rem}
body.noscroll{overflow:hidden}
h1,h2,h3,h4{font-family:var(--font-display);line-height:1.2;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.6rem;font-weight:650} h2{font-size:1.2rem;font-weight:650} h3{font-size:1.02rem;font-weight:650} h4{font-size:.92rem;font-weight:650}
p{margin:0}
a{color:var(--info)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.num,.tnum{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}
.small{font-size:.84rem}
.xs{font-size:.76rem}
.eyebrow{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.ltr{direction:ltr;unicode-bidi:isolate}
.ar,[lang="ar"] .ar{font-family:var(--font-ar)}

/* Barre supérieure */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
.cs-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line)}
.cs-top-in{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:10px;min-height:58px;padding-block:8px;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
.cs-back{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding-block:6px;padding-inline:9px 12px;cursor:pointer;font-size:.86rem;color:var(--fg-2);text-decoration:none;white-space:nowrap}
.cs-back:hover{border-color:var(--line-strong);color:var(--fg)}
.cs-back svg{width:16px;height:16px;flex:none}
[dir="rtl"] .cs-back svg,[dir="rtl"] .flip-rtl{transform:scaleX(-1)}
.cs-brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1;text-decoration:none;color:inherit}
.cs-logo{width:32px;height:32px;flex:none;border-radius:9px;background:linear-gradient(140deg,#e25555,#b8233a);display:grid;place-items:center;box-shadow:0 2px 6px rgba(184,35,58,.3)}
.cs-logo svg{width:20px;height:20px}
.cs-titles{min-width:0}
.cs-titles .eyebrow{display:block;line-height:1.15}
.cs-titles h1{font-size:1.06rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cs-actions{display:flex;align-items:center;gap:6px;flex:none}
.cs-doc{font-size:.8rem;color:var(--muted);white-space:nowrap;max-width:180px;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:38px;height:38px;border-radius:999px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--fg-2);flex:none;font-weight:700;font-size:.92rem;padding:0}
.icon-btn:hover{border-color:var(--line-strong);color:var(--fg)}
.icon-btn svg{width:18px;height:18px}
.cs-lang{font-family:var(--font-ar)}
@media (max-width:720px){
  .hide-sm{display:none!important}
  .cs-back span{display:none}
  .cs-back{padding:7px}
  .cs-top-in{gap:8px;min-height:54px}
  .cs-titles h1{font-size:1rem}
  .cs-actions .btn:not(.icon-btn){min-height:38px;padding:6px 10px}
}

/* Barre d'onglets du bas (téléphone) */
.cs-tabbar{display:none}
@media (max-width:720px){
  body.has-tabbar{--tabbar-h:calc(62px + env(safe-area-inset-bottom,0px));padding-bottom:var(--tabbar-h)}
  .cs-tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;inset:auto 0 0;z-index:55;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
  .cs-tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:62px;border:0;background:none;color:var(--muted);text-decoration:none;font-size:.7rem;font-weight:600;cursor:pointer;padding:0}
  .cs-tab .ic svg{width:23px;height:23px;display:block}
  .cs-tab.on{color:var(--accent)}
  .cs-tab.on .ic{background:var(--accent-soft);border-radius:999px;padding:2px 14px}
}

/* Contenu */
.wrap{max-width:1240px;margin:0 auto;padding-block:20px 28px;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.between{justify-content:space-between}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:900px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:620px){.g2,.g3,.g4{grid-template-columns:minmax(0,1fr)}}
.split{display:grid;grid-template-columns:260px minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:860px){.split{grid-template-columns:minmax(0,1fr)}}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;box-shadow:var(--shadow);min-width:0}
.card.flat{box-shadow:none}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.panel{background:var(--surface-2);border-radius:var(--r);padding:12px 14px}
.divider{height:1px;background:var(--line);margin:4px 0}

/* Champs */
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label,.lbl{font-size:.82rem;font-weight:600;color:var(--fg-2)}
.field .hint{font-size:.75rem;color:var(--muted)}
.inp,select.inp,textarea.inp{width:100%;min-height:44px;border:1px solid var(--line-strong);background:var(--surface);border-radius:var(--r-sm);padding:8px 11px;font-size:1rem}
textarea.inp{min-height:84px;resize:vertical;line-height:1.45}
.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.inp-unit{display:flex;align-items:stretch}
.inp-unit .inp{border-start-end-radius:0;border-end-end-radius:0;min-width:0}
.inp-unit .u{display:flex;align-items:center;padding:0 10px;border:1px solid var(--line-strong);border-inline-start:0;border-start-end-radius:var(--r-sm);border-end-end-radius:var(--r-sm);background:var(--surface-2);font-size:.8rem;color:var(--muted);white-space:nowrap;direction:ltr}
.inp.bad{border-color:var(--crit);box-shadow:0 0 0 3px var(--crit-soft)}
input[inputmode="decimal"],input[type="number"]{direction:ltr;text-align:start}
[dir="rtl"] input[inputmode="decimal"]{text-align:right}

/* Contrôle segmenté */
.seg{display:inline-flex;flex-wrap:wrap;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:3px;gap:3px}
.seg button{border:0;background:transparent;padding:7px 12px;border-radius:6px;cursor:pointer;font-size:.88rem;color:var(--fg-2);min-height:38px}
.seg button:hover{color:var(--fg)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--accent);box-shadow:0 0 0 1px var(--line-strong),0 1px 3px rgba(0,0,0,.06);font-weight:650}
.seg.full{display:flex;flex-wrap:nowrap}.seg.full button{flex:1 1 0;min-width:0;padding:7px 6px;line-height:1.2}

/* Puces de sélection (profil patient) */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:8px 14px;min-height:40px;cursor:pointer;font-size:.9rem;color:var(--fg-2);transition:background .15s,border-color .15s,color .15s}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.chip .ck{width:16px;height:16px;display:none}
.chip[aria-pressed="true"] .ck{display:block}

/* Bascule oui/non (grande cible tactile) */
.tog{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);cursor:pointer;user-select:none;min-height:48px;transition:border-color .15s,background .15s}
.tog:hover{border-color:var(--line-strong)}
.tog input{position:absolute;opacity:0;pointer-events:none}
.tog .sw{flex:none;width:38px;height:22px;border-radius:999px;background:var(--surface-3);position:relative;transition:background .15s}
.tog .sw::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:16px;height:16px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.tog input:checked+.sw{background:var(--accent)}
.tog input:checked+.sw::after{transform:translateX(16px)}
[dir="rtl"] .tog input:checked+.sw::after{transform:translateX(-16px)}
.tog input:focus-visible+.sw{outline:2px solid var(--accent);outline-offset:2px}
.tog .t{flex:1;min-width:0;font-size:.92rem;line-height:1.3}
.tog .t small{display:block;color:var(--muted);font-size:.76rem}
.tog .pts{font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.tog:has(input:checked){border-color:color-mix(in srgb,var(--accent) 45%,var(--line));background:color-mix(in srgb,var(--accent-soft) 55%,var(--surface))}

/* Case à cocher simple */
.chk{display:flex;gap:9px;align-items:flex-start;cursor:pointer;font-size:.92rem;line-height:1.35;padding:4px 0}
.chk input{width:18px;height:18px;margin:1px 0 0;accent-color:var(--accent);flex:none}

/* Boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line-strong);background:var(--surface);color:var(--fg);border-radius:var(--r-sm);padding:8px 14px;min-height:44px;cursor:pointer;font-size:.9rem;font-weight:600;text-decoration:none;text-align:center;line-height:1.2;transition:background .15s,border-color .15s,transform .1s}
.btn:active{transform:scale(.98)}
.btn:hover{background:var(--surface-2)}
.btn svg{width:16px;height:16px;flex:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{min-height:34px;padding:5px 11px;font-size:.84rem}
.btn.danger{color:var(--crit)}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* Badges et résultats */
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:.76rem;font-weight:600;white-space:nowrap;background:var(--surface-3);color:var(--fg-2)}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.crit{background:var(--crit-soft);color:var(--crit)}
.badge.info{background:var(--info-soft);color:var(--info)}
.badge.acc{background:var(--accent-soft);color:var(--accent)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}
.result{border-radius:var(--r-lg);padding:16px;border:1px solid var(--line);background:var(--surface-2);position:relative;overflow:hidden}
.result::before{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:4px;background:var(--muted)}
.result.ok::before{background:var(--ok)} .result.warn::before{background:var(--warn)} .result.crit::before{background:var(--crit)} .result.info::before{background:var(--info)}
.result .big{font-family:var(--font-display);font-size:2.4rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.result .big small{font-size:1rem;font-weight:500;color:var(--muted);margin-inline-start:4px}
.result.ok .big{color:var(--ok)} .result.warn .big{color:var(--warn)} .result.crit .big{color:var(--crit)} .result.info .big{color:var(--info)}
.cls{display:inline-block;font-size:.72rem;font-weight:700;padding:1px 7px;border-radius:4px;font-family:var(--mono)}
.cls.I{background:var(--ok-soft);color:var(--ok)} .cls.IIa{background:var(--info-soft);color:var(--info)} .cls.IIb{background:var(--warn-soft);color:var(--warn)} .cls.III{background:var(--crit-soft);color:var(--crit)}

/* Tableaux */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
table.tbl{width:100%;border-collapse:collapse;font-size:.88rem}
.tbl th,.tbl td{padding:8px 10px;text-align:start;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{background:var(--surface-2);font-weight:600;font-size:.78rem;color:var(--fg-2);white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tbl td.n,.tbl th.n{text-align:end;font-variant-numeric:tabular-nums}

/* Onglets */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;color:var(--muted);font-weight:550;font-size:.92rem;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button:hover{color:var(--fg)}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}

/* Liste latérale */
.navlist{display:flex;flex-direction:column;gap:2px}
.navlist .grp{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:650;padding:12px 10px 4px}
.navlist button{display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:start;border:0;background:none;padding:9px 10px;border-radius:var(--r-sm);cursor:pointer;color:var(--fg-2);font-size:.9rem}
.navlist button:hover{background:var(--surface-2);color:var(--fg)}
.navlist button[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}

/* Pied de page */
.cs-foot{border-top:1px solid var(--line);margin-top:10px}
.cs-foot-in{max-width:1240px;margin:0 auto;padding-block:14px 22px;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:6px;font-size:.76rem;color:var(--muted)}
.cs-foot strong{color:var(--fg-2);font-weight:600}

/* Toast */
.cs-toast{position:fixed;left:50%;bottom:calc(20px + var(--tabbar-h));transform:translateX(-50%) translateY(20px);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:.88rem;box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:120;max-width:calc(100% - 32px)}
.cs-toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* Fenêtre modale ; « sheet » = feuille qui monte du bas sur téléphone */
.modal-bg{position:fixed;inset:0;background:rgba(10,12,16,.45);z-index:90;display:grid;place-items:center;padding:16px;animation:fadeIn .15s ease}
.modal{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow-lg);width:min(560px,100%);max-height:calc(100dvh - 32px);overflow:auto;padding:18px;border:1px solid var(--line);overscroll-behavior:contain}
@media (max-width:720px){
  .modal-bg.sheet{place-items:end stretch;padding:0}
  .modal-bg.sheet .modal{width:100%;border-radius:20px 20px 0 0;max-height:88dvh;padding:10px 18px calc(18px + env(safe-area-inset-bottom,0px));animation:sheetUp .25s cubic-bezier(.2,.8,.2,1)}
  .modal-bg.sheet .modal::before{content:"";display:block;width:40px;height:4px;border-radius:4px;background:var(--line-strong);margin:0 auto 10px}
}
@keyframes fadeIn{from{opacity:0}}
@keyframes sheetUp{from{transform:translateY(100%)}}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:4px 0}
.set-l{min-width:0;flex:1 1 180px}
.set-t{font-weight:600;font-size:.94rem}

/* Menu des outils (feuille) */
.tm-list{display:flex;flex-direction:column;gap:4px}
.tm-grp{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:10px 4px 2px}
.tm-item{display:flex;gap:12px;align-items:center;padding:10px;border-radius:var(--r);text-decoration:none;color:var(--fg)}
.tm-item:hover,.tm-item.on{background:var(--surface-2)}
.tm-ic{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;flex:none;color:#fff;background:var(--g,var(--accent))}
.tm-ic svg{width:22px;height:22px}
.tm-tx{display:flex;flex-direction:column;min-width:0}
.g-echo{--g:var(--g-echo)} .g-patient{--g:var(--g-patient)} .g-calc{--g:var(--g-calc)} .g-learn{--g:var(--g-learn)}

/* Visite guidée */
.tour-mask{position:fixed;inset:0;z-index:200;pointer-events:auto}
.tour-hole{position:fixed;z-index:201;border-radius:12px;box-shadow:0 0 0 9999px rgba(8,14,22,.58);transition:all .3s cubic-bezier(.2,.8,.2,1);pointer-events:none;outline:2px solid var(--accent);outline-offset:3px}
.tour-pop{position:fixed;z-index:202;width:min(380px,calc(100vw - 24px));background:var(--surface);color:var(--fg);border-radius:16px;box-shadow:var(--shadow-lg);border:1px solid var(--line);padding:16px 16px 12px;transition:top .3s,left .3s;animation:fadeIn .2s ease}
.tour-pop h3{font-size:1.04rem;margin-bottom:6px}
.tour-pop .tb{font-size:.92rem;line-height:1.55;color:var(--fg-2)}
.tour-pop .tb p+p{margin-top:6px}
.tour-pop .tb b{color:var(--fg)}
.tour-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:14px}
.tour-dots{display:flex;gap:4px;flex-wrap:wrap;max-width:45%}
.tour-dots i{width:6px;height:6px;border-radius:50%;background:var(--line-strong)}
.tour-dots i.on{background:var(--accent);width:16px;border-radius:4px}
.tour-step{font-size:.74rem;color:var(--muted);font-weight:600}
@media (max-width:720px){
  .tour-pop.sheet{left:0!important;right:0;top:auto!important;bottom:0;width:100%;border-radius:20px 20px 0 0;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
}

/* Graphiques SVG */
.chart text{fill:var(--muted);font-size:10.5px;font-family:var(--font)}
.chart .gridl{stroke:var(--line);stroke-width:1}
.chart .axis{stroke:var(--line-strong);stroke-width:1}

@media (hover:none){.btn:hover{background:var(--surface)}.btn.primary:hover{background:var(--accent)}.btn.ghost:hover{background:transparent}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
@media print{
  body::before,.cs-top,.cs-foot,.cs-tabbar,.no-print{display:none!important}
  body{background:#fff;color:#000;padding:0!important}
  .card{box-shadow:none;border-color:#ccc}
  .wrap{padding:0;max-width:none}
}

<style>
.sc-layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:20px;align-items:start}
.sc-side{position:sticky;top:calc(70px + env(safe-area-inset-top,0px));max-height:calc(100vh - 90px);overflow:auto;padding-right:4px}
.sc-search{margin-bottom:6px}
.sc-main{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:18px;align-items:start}
.sc-res{position:sticky;top:calc(70px + env(safe-area-inset-top,0px))}
.sc-head{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.sc-head p{color:var(--muted);max-width:68ch;font-size:.92rem}
.sc-inputs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.sc-inputs .wide{grid-column:1/-1}
.sc-sel{display:flex;flex-direction:column;gap:6px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.sc-sel .lbl{display:flex;justify-content:space-between;gap:8px}
.sc-sel .seg{width:100%}
.sc-sel .seg button{flex:1 1 auto}
.sc-meter{height:8px;border-radius:999px;background:var(--surface-3);overflow:hidden;margin:12px 0 4px;position:relative}
.sc-meter i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:currentColor;transition:width .25s}
.sc-rows{display:flex;flex-direction:column;gap:6px;margin-top:12px;font-size:.86rem}
.sc-rows div{display:flex;justify-content:space-between;gap:10px;border-top:1px dashed var(--line);padding-top:6px}
.sc-rows b{font-variant-numeric:tabular-nums;text-align:right}
.sc-rec{margin-top:12px;font-size:.9rem;line-height:1.45}
.sc-rec .cls{margin-right:6px}
.sc-ref{margin-top:12px;font-size:.74rem;color:var(--muted)}
.sc-mobile-nav{display:none}
@media (max-width:1100px){.sc-main{grid-template-columns:minmax(0,1fr)}.sc-res{position:static}}

@media (max-width:560px){.sc-inputs{grid-template-columns:minmax(0,1fr)}}

  function download(name, content, mime){
    try{
      var blob = new Blob([content], {type:(mime || 'text/plain') + ';charset=utf-8'});
      var a = h('a', {href:URL.createObjectURL(blob), download:name}); document.body.appendChild(a); a.click();

  function toCSV(rows, cols){
    var sep = ';';
    function cell(v){ v = v == null ? '' : String(v); return /[;"\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
    var out = [cols.map(function(c){ return cell(c.label || c.key); }).join(sep)];
    rows.forEach(function(r){ out.push(cols.map(function(c){ return cell(typeof c.get === 'function' ? c.get(r) : r[c.key]); }).join(sep)); });
    return '﻿' + out.join('\r\n');
  }

  /* ---------- Sauvegarde : exporter / importer toutes les données de cet appareil ---------- */
  function exportBackup(){
    var data = {};
    store.keys().forEach(function(k){ data[k] = store.get(k); });
    var payload = {app:'coeur-net', schema:SCHEMA, date:new Date().toISOString(), data:data};
    download('coeur-net-sauvegarde-' + todayISO() + '.json', JSON.stringify(payload, null, 1), 'application/json');
  }
  function applyBackup(p){
    if(!p || p.app !== 'coeur-net' || !p.data || typeof p.data !== 'object') return false;
    store.keys().forEach(function(k){ store.del(k); });
    Object.keys(p.data).forEach(function(k){ store.set(k, p.data[k]); });
    return true;
  }
  function importBackup(){
    var inp = h('input', {type:'file', accept:'application/json,.json', style:{display:'none'}});
    inp.addEventListener('change', function(){
      var f = inp.files && inp.files[0]; if(!f) return;
      var r = new FileReader();
      r.onload = function(){
        var p; try{ p = JSON.parse(r.result); }catch(e){ p = null; }
        if(!p || p.app !== 'coeur-net'){ toast({fr:'Ce fichier n’est pas une sauvegarde Cœur Net', ar:'هذا الملف ليس نسخة احتياطية من Cœur Net'}); return; }
        ask({fr:'Remplacer les données de cet appareil par la sauvegarde du ' + frDate(p.date) + ' ?', ar:'استبدال بيانات هذا الجهاز بالنسخة الاحتياطية بتاريخ ' + frDate(p.date) + '؟'}, {fr:'Remplacer', ar:'استبدال'}).then(function(ok){
          if(ok && applyBackup(p)) location.reload();
        });
      };
      r.readAsText(f);
    });
    document.body.appendChild(inp); inp.click(); setTimeout(function(){ inp.remove(); }, 60000);
  }

    var box = h('div', {class:'modal'}, content);

    function close(){ bg.remove(); document.removeEventListener('keydown', onKey); if(!$('.modal-bg')) document.body.classList.remove('noscroll'); if(prev && prev.focus) try{ prev.focus(); }catch(e){} if(opts.onClose) opts.onClose(); }
    function onKey(e){ if(e.key === 'Escape') close(); }
    bg.addEventListener('click', function(e){ if(e.target === bg) close(); });
    document.addEventListener('keydown', onKey);
    document.body.appendChild(bg); document.body.classList.add('noscroll');
    var f = box.querySelector('[autofocus],input,select,textarea,button.primary'); if(f && !opts.noFocus) setTimeout(function(){ f.focus(); }, 30);

<script>
/* Cœur Net — visite guidée (window.CS.tour)
   CS.tour.define([{el:'#sel' | fn, title:{fr,ar}, body:{fr,ar} (HTML permis), before:fn, after:fn}], {key})
   Démarre seule à la première ouverture de la page ; le bouton « ? » de l'en-tête la relance. */
(function(){
  'use strict';
  var CS = window.CS, h = CS.h, t = CS.t;
  var steps = [], key = 'tour.' + CS.PAGE, idx = 0, mask, hole, pop, active = false;

  function define(list, opts){
    steps = list || [];
    if(opts && opts.key) key = 'tour.' + opts.key;
    // première visite : on attend que la page soit dessinée
    if(!CS.store.get(key, false)) setTimeout(function(){ if(!active && !document.querySelector('.modal-bg')) start(false); }, 700);
  }
  function target(s){
    if(!s.el) return null;
    var el = typeof s.el === 'function' ? s.el() : document.querySelector(s.el);
    if(!el) return null;
    var r = el.getBoundingClientRect();
    if(r.width === 0 && r.height === 0) return null;
    return el;
  }
  function isSheet(){ return window.matchMedia('(max-width:720px)').matches; }

  function start(force){
    if(!steps.length) return;
    if(active) stop(false);
    active = true; idx = 0;
    mask = h('div', {class:'tour-mask', 'aria-hidden':'true'});
    hole = h('div', {class:'tour-hole'});
    pop = h('div', {class:'tour-pop', role:'dialog', 'aria-modal':'true', 'aria-live':'polite'});
    mask.addEventListener('click', function(e){ e.stopPropagation(); });
    document.body.appendChild(mask); document.body.appendChild(hole); document.body.appendChild(pop);
    document.addEventListener('keydown', onKey, true);
    window.addEventListener('resize', place);
    window.addEventListener('scroll', place, true);
    show(0);
  }
  function stop(done){
    if(!active) return;
    var s = steps[idx]; if(s && s.after) try{ s.after(); }catch(e){}
    active = false;
    [mask, hole, pop].forEach(function(x){ if(x) x.remove(); });
    document.removeEventListener('keydown', onKey, true);
    window.removeEventListener('resize', place);
    window.removeEventListener('scroll', place, true);
    CS.store.set(key, true);
    if(done) CS.toast({fr:'Visite terminée. Le bouton « ? » la relance à tout moment.', ar:'انتهت الجولة. يعيد زر «؟» تشغيلها في أي وقت.'});
  }
  function onKey(e){
    if(!active) return;
    var rtl = CS.isAr();
    if(e.key === 'Escape'){ e.preventDefault(); stop(false); }
    else if(e.key === (rtl ? 'ArrowLeft' : 'ArrowRight') || e.key === 'Enter'){ e.preventDefault(); next(); }
    else if(e.key === (rtl ? 'ArrowRight' : 'ArrowLeft')){ e.preventDefault(); prev(); }
  }
  function next(){ if(idx < steps.length - 1) show(idx + 1); else stop(true); }
  function prev(){ if(idx > 0) show(idx - 1); }

  function show(i){
    var old = steps[idx]; if(old && old.after && i !== idx) try{ old.after(); }catch(e){}
    idx = i;
    var s = steps[i];
    if(s.before) try{ s.before(); }catch(e){}
    var last = i === steps.length - 1;
    pop.innerHTML = '';
    var dots = h('div', {class:'tour-dots'});
    for(var k = 0; k < steps.length; k++) dots.appendChild(h('i', {class:k === i ? 'on' : ''}));
    pop.appendChild(h('div', {class:'row between', style:{marginBottom:'6px'}},
      h('span', {class:'tour-step', text:(i + 1) + ' / ' + steps.length}),
      h('button', {class:'btn ghost sm', type:'button', text:{fr:'Passer', ar:'تخطٍّ'}, onclick:function(){ stop(false); }})));
    pop.appendChild(h('h3', {text:s.title}));
    pop.appendChild(h('div', {class:'tb', html:t(s.body)}));
    pop.appendChild(h('div', {class:'tour-foot'}, dots,
      h('div', {class:'row', style:{gap:'6px'}},
        i > 0 ? h('button', {class:'btn sm', type:'button', text:{fr:'Précédent', ar:'السابق'}, onclick:prev}) : null,
        h('button', {class:'btn sm primary', type:'button', text:last ? {fr:'Terminer', ar:'إنهاء'} : {fr:'Suivant', ar:'التالي'}, onclick:next}))));
    var el = target(s);
    if(el){
      var r = el.getBoundingClientRect();
      var vh = window.innerHeight, sheetH = isSheet() ? Math.min(pop.offsetHeight || 260, vh * .5) : 0;
      var visibleTop = 70, visibleBottom = vh - sheetH - 16;
      if(r.top < visibleTop || r.bottom > visibleBottom){
        var y = window.scrollY + r.top - (isSheet() ? Math.max(70, (visibleBottom - r.height) / 2) : vh / 2 - r.height / 2);
        window.scrollTo({top:Math.max(0, y), behavior:'smooth'});
      }
    }
    place(); setTimeout(place, 360);
    var f = pop.querySelector('.btn.primary'); if(f) f.focus({preventScroll:true});
  }
  function place(){
    if(!active) return;
    var s = steps[idx], el = target(s), sheet = isSheet();
    pop.classList.toggle('sheet', sheet);
    if(!el){
      hole.style.cssText = 'top:50%;left:50%;width:0;height:0;outline:0';
      if(!sheet){ pop.style.left = Math.max(12, (window.innerWidth - pop.offsetWidth) / 2) + 'px'; pop.style.top = Math.max(12, (window.innerHeight - pop.offsetHeight) / 2) + 'px'; }
      return;
    }
    var r = el.getBoundingClientRect(), pad = 6;
    hole.style.cssText = 'top:' + (r.top - pad) + 'px;left:' + (r.left - pad) + 'px;width:' + (r.width + pad * 2) + 'px;height:' + (r.height + pad * 2) + 'px';
    if(sheet){ pop.style.left = ''; pop.style.top = ''; return; }
    var pw = pop.offsetWidth, ph = pop.offsetHeight, vw = window.innerWidth, vh = window.innerHeight, gap = 14;
    var top = r.bottom + gap;
    if(top + ph > vh - 12) top = r.top - ph - gap;
    if(top < 12){ // ni dessous ni dessus : à côté
      top = Math.min(Math.max(12, r.top), vh - ph - 12);
      var side = CS.isAr() ? r.left - pw - gap : r.right + gap;
      if(side + pw > vw - 12 || side < 12) side = CS.isAr() ? r.right + gap : r.left - pw - gap;
      pop.style.left = Math.min(Math.max(12, side), vw - pw - 12) + 'px';
    } else {
      var left = CS.isAr() ? r.right - pw : r.left;
      pop.style.left = Math.min(Math.max(12, left), vw - pw - 12) + 'px';
    }
    pop.style.top = top + 'px';
  }

  CS.tour = {define:define, start:start, stop:stop, get active(){ return active; }};
})();

</script>
<script>
/* Cœur Net — formules de risque partagées (window.RISK)
   Utilisées par « Scores de risque » et « Décision partagée ». Coefficients repris des publications originales :
   SCORE2 / SCORE2-OP (Eur Heart J 2021), SCORE2-Diabetes (Eur Heart J 2023), PCE (ACC/AHA 2013),

    low:{m:[-0.5699,0.7476], f:[-0.7380,0.7019]}, moderate:{m:[-0.1565,0.8009], f:[-0.3143,0.7701]},
    high:{m:[0.3207,0.9360], f:[0.5710,0.9369]}, veryhigh:{m:[0.5836,0.8294], f:[0.9412,0.8329]} };

    low:{m:[-0.34,1.19], f:[-0.52,1.01]}, moderate:{m:[0.01,1.25], f:[-0.10,1.10]},
    high:{m:[0.08,1.15], f:[0.38,1.09]}, veryhigh:{m:[0.05,0.70], f:[0.38,0.69]} };

    else { x = 0.0789*cage + 0.6010*dm + 0.4921*sm + 0.0102*csbp + 0.0605*ctc - 0.3040*chdl - 0.0107*cage*dm - 0.0255*cage*sm - 0.0004*cage*csbp - 0.0009*cage*ctc + 0.0154*cage*chdl; S0 = 0.8082; mean = 0.2290; }

  function score2dm(o){

    else if(o.female){ s = 17.114*la + 0.940*lt - 18.920*lh + 4.475*la*lh + (t ? 29.291*ls - 6.432*la*ls : 27.820*ls - 6.087*la*ls) + 0.691*sm + 0.874*dm; S0 = 0.9533; mean = 86.61; }

     nationales des facteurs de risque par âge et sexe, taux de base nationaux d'événements CV (fatals + non fatals)
     pour chacune des 10 années de suivi. Données : window.GLOBO (fichier _globorisk_tun.js).

/* ---------- Outils de calcul ---------- */
function interp(table, x){ // table : [[x,y],...] croissant
  if(x <= table[0][0]) return table[0][1];
  for(var i = 1; i < table.length; i++){ if(x <= table[i][0]){ var a = table[i-1], b = table[i]; return a[1] + (b[1]-a[1]) * (x-a[0]) / (b[0]-a[0]); } }
  return table[table.length-1][1];
}
var cockcroft = RISK.cockcroft, score2 = RISK.score2, score2op = RISK.score2op, score2dm = RISK.score2dm, pce = RISK.pce;

/* ---------- Constructeurs d'entrées ---------- */
function B(id, label, pts, sub, def){ return {id:id, type:'bool', label:label, pts:pts == null ? 1 : pts, sub:sub, def:!!def}; }
function S(id, label, options, def, wide){ return {id:id, type:'sel', label:label, options:options, def:def == null ? options[0].v : def, wide:wide}; }
function N(id, label, unit, def, o){ o = o || {}; return {id:id, type:'num', label:label, unit:unit, def:def, kind:o.kind, min:o.min, max:o.max, step:o.step || 'any', hint:o.hint}; }
var SEX = S('sex', 'Sexe', [{v:'M', label:'Homme'}, {v:'F', label:'Femme'}]);
var REGION = S('region', 'Région de risque ESC', [{v:'low', label:'Faible'}, {v:'moderate', label:'Modéré'}, {v:'high', label:'Élevé'}, {v:'veryhigh', label:'Très élevé'}], 'high', true);
function sumBools(def, v){ var s = 0; def.inputs.forEach(function(i){ if(i.type === 'bool' && v[i.id]) s += i.pts; if(i.type === 'sel'){ var o = i.options.filter(function(x){ return x.v === v[i.id]; })[0]; if(o && o.pts) s += o.pts; } }); return s; }
function R(level, big, unit, title, rec, rows, extra){ return {level:level, big:big, unit:unit, title:title, rec:rec, rows:rows || [], meter:extra && extra.meter, note:extra && extra.note}; }
function cls(c){ return '<span class="cls ' + c + '">' + c + '</span>'; }

{id:'grace', grp:'Syndrome coronarien aigu', name:'GRACE (hospitalier)', kw:'sca nstemi mortalite strategie invasive', units:true,

 inputs:[N('age','Âge','ans',68,{min:18,max:110}), N('hr','Fréquence cardiaque','bpm',92,{min:20,max:250}), N('sbp','PA systolique','mmHg',118,{min:40,max:280}),
   N('cr','Créatinine',null,1.4,{kind:'creat',min:0.2,max:15}),
   S('killip','Classe Killip',[{v:'1',label:'I'},{v:'2',label:'II'},{v:'3',label:'III'},{v:'4',label:'IV'}]),
   B('arrest','Arrêt cardiaque à l’admission', 0), B('st','Sous-décalage ou déviation du ST', 0), B('enz','Troponine élevée', 0)],
 ex:{killip:'2', st:true, enz:true},
 calc:function(v){
   var a = v.age, p = 0;
   p += a < 30 ? 0 : a < 40 ? 8 : a < 50 ? 25 : a < 60 ? 41 : a < 70 ? 58 : a < 80 ? 75 : a < 90 ? 91 : 100;
   var hr = v.hr; p += hr < 50 ? 0 : hr < 70 ? 3 : hr < 90 ? 9 : hr < 110 ? 15 : hr < 150 ? 24 : hr < 200 ? 38 : 46;
   var s = v.sbp; p += s < 80 ? 58 : s < 100 ? 53 : s < 120 ? 43 : s < 140 ? 34 : s < 160 ? 24 : s < 200 ? 10 : 0;
   var c = v.cr; p += c < 0.4 ? 1 : c < 0.8 ? 4 : c < 1.2 ? 7 : c < 1.6 ? 10 : c < 2 ? 13 : c < 4 ? 21 : 28;
   p += {1:0, 2:20, 3:39, 4:59}[v.killip]; if(v.arrest) p += 39; if(v.st) p += 28; if(v.enz) p += 14;
   if([a,hr,s,c].some(isNaN)) return null;
   var mort = interp([[0,0.1],[60,0.2],[70,0.3],[80,0.4],[90,0.6],[100,0.8],[110,1.1],[120,1.6],[130,2.1],[140,2.9],[150,3.9],[160,5.4],[170,7.3],[180,9.8],[190,13],[200,18],[210,23],[220,29],[230,36],[240,44],[250,52]], p);
   var rows = [['Mortalité hospitalière estimée', (p >= 250 ? '≥ ' : '') + fmt(mort, 1) + ' %']];
   if(p > 140) return R('crit', p, 'points', 'Haut risque', cls('IIa') + 'Stratégie invasive précoce (< 24 h) à envisager. Si critère de très haut risque (instabilité, douleur réfractaire, arythmie, ICA) : coronarographie immédiate (< 2 h).', rows, {meter:p/300});
   if(p > 108) return R('warn', p, 'points', 'Risque intermédiaire', 'Stratégie invasive pendant l’hospitalisation ; réévaluer selon l’ECG, la troponine et les symptômes.', rows, {meter:p/300});
   return R('ok', p, 'points', 'Risque faible', 'Stratégie invasive sélective selon les tests non invasifs et l’évolution clinique.', rows, {meter:p/300}); },
 ref:'Granger CB, Arch Intern Med 2003 ; ESC 2023 – SCA'},

{id:'crusade', grp:'Syndrome coronarien aigu', name:'CRUSADE', kw:'saignement nstemi hemorragie', units:true,
 desc:'Risque de saignement majeur hospitalier dans les NSTE-SCA.',
 inputs:[N('hct','Hématocrite','%',36,{min:10,max:70}), N('age','Âge','ans',72,{min:18,max:110}), N('wt','Poids','kg',64,{min:30,max:250}), N('cr','Créatinine',null,1.3,{kind:'creat',min:0.2,max:15}),
   N('hr','Fréquence cardiaque','bpm',96,{min:20,max:250}), N('sbp','PA systolique','mmHg',112,{min:40,max:280}),
   SEX, B('chf','Signes d’IC à l’admission', 0), B('vasc','Maladie vasculaire antérieure', 0, 'AOMI ou AVC'), B('dm','Diabète', 0)],
 ex:{sex:'F', dm:true},
 calc:function(v){
   var cc = cockcroft(v.age, v.wt, v.cr, v.sex === 'F'); if([v.hct, cc, v.hr, v.sbp].some(isNaN)) return null;
   var p = 0, x = v.hct; p += x < 31 ? 9 : x < 34 ? 7 : x < 37 ? 3 : x < 40 ? 2 : 0;
   p += cc <= 15 ? 39 : cc <= 30 ? 35 : cc <= 60 ? 28 : cc <= 90 ? 17 : cc <= 120 ? 7 : 0;
   x = v.hr; p += x <= 70 ? 0 : x <= 80 ? 1 : x <= 90 ? 3 : x <= 100 ? 6 : x <= 110 ? 8 : x <= 120 ? 10 : 11;
   if(v.sex === 'F') p += 8; if(v.chf) p += 7; if(v.vasc) p += 6; if(v.dm) p += 6;
   x = v.sbp; p += x <= 90 ? 10 : x <= 100 ? 8 : x <= 120 ? 5 : x <= 180 ? 1 : x <= 200 ? 3 : 5;
   var cat = p <= 20 ? ['Très faible', 3.1, 'ok'] : p <= 30 ? ['Faible', 5.5, 'ok'] : p <= 40 ? ['Modéré', 8.6, 'warn'] : p <= 50 ? ['Élevé', 11.9, 'crit'] : ['Très élevé', 19.5, 'crit'];
   return R(cat[2], p, 'points', 'Risque hémorragique ' + cat[0].toLowerCase(), 'Privilégier l’abord radial, ajuster les doses d’anticoagulant à la fonction rénale, IPP sous double antiagrégation.', [['Saignement majeur hospitalier', fmt(cat[1],1) + ' %'], ['Clairance (Cockcroft-Gault)', fmt(cc) + ' mL/min']], {meter:p/100}); },
 ref:'Subherwal S, Circulation 2009'},
{id:'archbr', grp:'Syndrome coronarien aigu', name:'ARC-HBR', kw:'saignement dapt double antiagregation angioplastie',

   B('m4','Saignement < 12 mois non majeur', 0, 'Mineur'), B('m5','AINS ou corticoïdes au long cours', 0, 'Mineur'), B('m6','AVC ischémique ancien', 0, 'Mineur')],

/* ===== Prévention ===== */
{id:'score2', grp:'Prévention', name:'SCORE2 / SCORE2-OP', kw:'prevention primaire risque cardiovasculaire statine', units:true,
 desc:'Risque d’événement CV fatal ou non fatal à 10 ans, sans maladie CV ni diabète. Au-delà de 70 ans, SCORE2-OP est utilisé automatiquement.',
 inputs:[SEX, N('age','Âge','ans',58,{min:40,max:89}), B('smoker','Tabagisme actif', 0), N('sbp','PA systolique','mmHg',148,{min:80,max:240}),
   N('tc','Cholestérol total',null,230,{kind:'chol',min:60,max:500}), N('hdl','HDL-cholestérol',null,42,{kind:'chol',min:15,max:150}),
   B('diabetes','Diabète (SCORE2-OP seulement)', 0, 'Pour les moins de 70 ans, utiliser SCORE2-Diabetes'), REGION],
 ex:{sex:'M', smoker:true},
 calc:function(v){
   if([v.age, v.sbp, v.tc, v.hdl].some(isNaN)) return null;
   var o = {female:v.sex === 'F', age:v.age, smoker:v.smoker, sbp:v.sbp, tc:v.tc/38.67, hdl:v.hdl/38.67, region:v.region, diabetes:v.diabetes};
   var op = v.age >= 70, r = (op ? score2op(o) : score2(o)) * 100;
   var t = v.age < 50 ? [2.5, 7.5] : v.age < 70 ? [5, 10] : [7.5, 15];
   var lvl = r >= t[1] ? 'crit' : r >= t[0] ? 'warn' : 'ok';
   var title = r >= t[1] ? 'Risque très élevé' : r >= t[0] ? 'Risque élevé' : 'Risque faible à modéré';
   var rec = r >= t[1] ? cls('I') + 'Traitement des facteurs de risque recommandé. Objectif LDL < 1,8 mmol/L (70 mg/dL) au minimum, < 1,4 mmol/L (55 mg/dL) à envisager.' :
     r >= t[0] ? cls('IIa') + 'Traitement des facteurs de risque à envisager selon les modificateurs de risque, la fragilité et les préférences du patient.' : 'Le traitement des facteurs de risque n’est généralement pas recommandé, sauf modificateurs de risque.';
   var rows = [['Modèle', op ? 'SCORE2-OP (≥ 70 ans)' : 'SCORE2 (40–69 ans)'], ['Seuils pour cet âge', '< ' + fmt(t[0],1) + ' % · ' + fmt(t[0],1) + '–' + fmt(t[1],1) + ' % · ≥ ' + fmt(t[1],1) + ' %'], ['Non-HDL', fmt(CS.fromMgdl('chol', v.tc - v.hdl), CS.units() === 'si' ? 1 : 0) + ' ' + CS.unitLabel('chol')]];
   if(v.diabetes && !op) rows.push(['Attention', 'Diabète : utiliser SCORE2-Diabetes']);
   return R(lvl, fmt(r, 1), '%', title, rec, rows, {meter:Math.min(1, r/(t[1]*1.6)), note:'Région « élevé » par défaut pour la Tunisie, à adapter.'}); },
 ref:'SCORE2 Working Group, Eur Heart J 2021 ; SCORE2-OP, Eur Heart J 2021 ; ESC 2021 – Prévention'},
{id:'score2dm', grp:'Prévention', name:'SCORE2-Diabetes', kw:'diabete prevention risque cardiovasculaire', units:true,
 desc:'Risque CV à 10 ans chez le diabétique de type 2 de 40 à 69 ans, sans maladie CV ni atteinte d’organe sévère.',
 inputs:[SEX, N('age','Âge','ans',56,{min:40,max:69}), B('smoker','Tabagisme actif', 0), N('sbp','PA systolique','mmHg',138,{min:80,max:240}),
   N('tc','Cholestérol total',null,205,{kind:'chol',min:60,max:500}), N('hdl','HDL-cholestérol',null,40,{kind:'chol',min:15,max:150}),
   N('agediab','Âge au diagnostic du diabète','ans',48,{min:15,max:69}), N('a1c','HbA1c','%',7.8,{min:4,max:16,hint:'En % (DCCT) ; converti en mmol/mol'}), N('egfr','DFG (CKD-EPI)','mL/min/1,73 m²',82,{min:10,max:150}), REGION],
 ex:{sex:'M'},
 calc:function(v){
   if([v.age, v.sbp, v.tc, v.hdl, v.agediab, v.a1c, v.egfr].some(isNaN)) return null;
   var a1cmm = (v.a1c - 2.15) * 10.929;
   var r = score2dm({female:v.sex === 'F', age:v.age, smoker:v.smoker, sbp:v.sbp, tc:v.tc/38.67, hdl:v.hdl/38.67, agediab:v.agediab, a1c:a1cmm, egfr:v.egfr, region:v.region}) * 100;
   var lvl = r >= 20 ? 'crit' : r >= 10 ? 'crit' : r >= 5 ? 'warn' : 'ok';
   var title = r >= 20 ? 'Risque très élevé' : r >= 10 ? 'Risque élevé' : r >= 5 ? 'Risque modéré' : 'Risque faible';
   return R(lvl, fmt(r, 1), '%', title, (r >= 10 ? cls('IIa') + 'Envisager un iSGLT2 ou un aGLP-1 à bénéfice CV démontré, indépendamment de l’HbA1c. ' : '') + 'Objectif LDL : ' + (r >= 20 ? '< 1,4 mmol/L (55 mg/dL)' : r >= 10 ? '< 1,8 mmol/L (70 mg/dL)' : '< 2,6 mmol/L (100 mg/dL)') + '.',
     [['HbA1c', fmt(a1cmm, 0) + ' mmol/mol'], ['Catégories', '< 5 · 5–10 · 10–20 · ≥ 20 %']], {meter:Math.min(1, r/30)}); },

{id:'ascvd', grp:'Prévention', name:'ASCVD (PCE)', kw:'aha acc prevention 10 ans statine pooled cohort', units:true,
 desc:'Pooled Cohort Equations AHA/ACC : risque d’événement athéroscléreux à 10 ans, 40–79 ans. Référence américaine, donnée à titre de comparaison.',
 inputs:[SEX, S('race','Équation',[{v:'w',label:'Blanc / autre'},{v:'aa',label:'Afro-américain'}]), N('age','Âge','ans',55,{min:40,max:79}),
   N('tc','Cholestérol total',null,213,{kind:'chol',min:60,max:500}), N('hdl','HDL-cholestérol',null,50,{kind:'chol',min:15,max:150}), N('sbp','PA systolique','mmHg',120,{min:80,max:240}),
   B('treated','HTA traitée', 0), B('diabetes','Diabète', 0), B('smoker','Tabagisme actif', 0)],
 ex:{sex:'F'},
 calc:function(v){
   if([v.age, v.tc, v.hdl, v.sbp].some(isNaN)) return null;

   return R(lvl, fmt(r, 1), '%', title, r >= 20 ? 'Statine de haute intensité (AHA/ACC 2018).' : r >= 7.5 ? 'Statine d’intensité modérée si facteurs aggravants ; score calcique coronaire si doute.' : r >= 5 ? 'Discussion des facteurs aggravants.' : 'Mesures hygiéno-diététiques.', [['Catégories AHA', '< 5 · 5–7,5 · 7,5–20 · ≥ 20 %']], {meter:Math.min(1, r/30)}); },
 ref:'Goff DC, Circulation 2014 ; AHA/ACC 2018 – Cholestérol'},
{id:'ptp', grp:'Prévention', name:'Probabilité pré-test (SCC)', kw:'syndrome coronarien chronique angor test ischemie coroscanner',
 desc:'Probabilité clinique de coronaropathie obstructive selon l’âge, le sexe et les symptômes (tableau ESC 2019).',
 inputs:[SEX, S('age','Âge',[{v:'0',label:'30–39'},{v:'1',label:'40–49'},{v:'2',label:'50–59'},{v:'3',label:'60–69'},{v:'4',label:'≥ 70'}], '2', true),
   S('sym','Symptômes',[{v:'t',label:'Angor typique'},{v:'a',label:'Atypique'},{v:'n',label:'Non angineux'},{v:'d',label:'Dyspnée'}], 't', true)],
 ex:{sex:'M', age:'3', sym:'a'},
 calc:function(v){
   var T = {t:{M:[3,22,32,44,52], F:[5,10,13,16,27]}, a:{M:[4,10,17,26,34], F:[3,6,6,11,19]}, n:{M:[1,3,11,22,24], F:[1,2,3,6,10]}, d:{M:[0,12,20,27,32], F:[3,3,9,14,12]}};
   var p = T[v.sym][v.sex][+v.age];
   if(p > 15) return R('crit', p, '%', 'Probabilité > 15 %', cls('I') + 'Test non invasif recommandé : coroscanner si probabilité basse à intermédiaire, imagerie fonctionnelle si plus élevée.', [], {meter:p/60});
   if(p >= 5) return R('warn', p, '%', 'Probabilité 5–15 %', cls('IIb') + 'Test diagnostique à envisager selon la vraisemblance clinique (facteurs de risque, ECG, calcifications).', [], {meter:p/60});
   return R('ok', p, '%', 'Probabilité < 5 %', 'Rechercher une autre cause ; test seulement pour raison impérieuse.', [], {meter:p/60}); },
 ref:'ESC 2019 – Syndromes coronariens chroniques (Knuuti et al.). ESC 2024 propose le modèle RF-CL.'},
{id:'duke', grp:'Prévention', name:'Score de Duke (épreuve d’effort)', kw:'epreuve effort tapis bruce ischemie',
 desc:'Pronostic après une épreuve d’effort sur tapis (protocole de Bruce).',
 inputs:[N('t','Durée d’exercice','min',7,{min:0,max:25}), N('st','Sous-décalage ST maximal','mm',1.5,{min:0,max:10}),
   S('ang','Angor pendant l’effort',[{v:'0',label:'Aucun'},{v:'1',label:'Non limitant'},{v:'2',label:'Limitant'}], '1', true)],
 ex:{ang:'1'},
 calc:function(v){ if([v.t, v.st].some(isNaN)) return null;
   var s = v.t - 5*v.st - 4*(+v.ang);

   if(s > -11) return R('warn', fmt(s,1), '', 'Risque intermédiaire', 'Mortalité annuelle ≈ 1,25 %. Imagerie de stress ou coroscanner.', [['Survie à 4 ans', '95 %']], {meter:0.55});
   return R('crit', fmt(s,1), '', 'Haut risque', 'Mortalité annuelle ≈ 5 %. Coronarographie.', [['Survie à 4 ans', '79 %']], {meter:0.95}); },
 ref:'Mark DB, N Engl J Med 1991'},

{id:'h2fpef', grp:'Insuffisance cardiaque', name:'H₂FPEF', kw:'icfep fe preservee dyspnee diagnostic',

 calc:function(v){ var s = sumBools(this, v); var pr = [25,40,55,68,78,86,92,95,97,98][s];

   if(s >= 2) return R('warn', s, '/ 9', 'Probabilité intermédiaire', 'Compléter : NT-proBNP, écho d’effort diastolique ou cathétérisme d’effort.', [['Probabilité estimée', '≈ ' + pr + ' %']], {meter:s/9});
   return R('ok', s, '/ 9', 'ICFEp peu probable', 'Rechercher une autre cause de dyspnée.', [['Probabilité estimée', '≈ ' + pr + ' %']], {meter:s/9}); },

{id:'hfapeff', grp:'Insuffisance cardiaque', name:'HFA-PEFF', kw:'icfep fe preservee diagnostic echo bnp',

   B('fM','e′ septal < 7 ou latéral < 10 cm/s, ou E/e′ ≥ 15, ou Vmax IT > 2,8 m/s', 0, 'Fonctionnel · majeur (seuils e′ selon l’âge)'),
   B('fm','E/e′ 9–14 ou SLG < 16 %', 0, 'Fonctionnel · mineur'),
   B('mM','OG dilatée (VOGi > 34 mL/m² en sinusal, > 40 en FA) ou HVG concentrique', 0, 'Morphologique · majeur'),
   B('mm','VOGi 29–34 (sinusal) ou 34–40 (FA), HVG, SIV ou paroi ≥ 12 mm', 0, 'Morphologique · mineur'),
   B('bM','NT-proBNP > 220 pg/mL (sinusal) ou > 660 (FA)', 0, 'Biomarqueur · majeur'),
   B('bm','NT-proBNP 125–220 (sinusal) ou 365–660 (FA)', 0, 'Biomarqueur · mineur')],
 ex:{fm:true, mM:true, bM:true},
 calc:function(v){ var f = v.fM ? 2 : v.fm ? 1 : 0, m = v.mM ? 2 : v.mm ? 1 : 0, b = v.bM ? 2 : v.bm ? 1 : 0, s = f + m + b;
   var rows = [['Fonctionnel', f], ['Morphologique', m], ['Biomarqueur', b]];
   if(s >= 5) return R('crit', s, '/ 6', 'ICFEp confirmée', 'Diagnostic retenu. Étape 4 : rechercher l’étiologie (amylose, CMH, valvulopathie…).', rows, {meter:s/6});
   if(s >= 2) return R('warn', s, '/ 6', 'Zone intermédiaire', 'Étape 3 : écho d’effort diastolique ou mesures hémodynamiques invasives.', rows, {meter:s/6});
   return R('ok', s, '/ 6', 'ICFEp peu probable', 'Rechercher une autre cause.', rows, {meter:s/6}); },

{id:'euroscore', grp:'Chirurgie cardiaque', name:'EuroSCORE II', kw:'chirurgie cardiaque mortalite operatoire tavi heart team', units:true,
 desc:'Mortalité opératoire prédite en chirurgie cardiaque (modèle logistique).',
 inputs:[N('age','Âge','ans',78,{min:18,max:100}), SEX, N('wt','Poids','kg',70,{min:30,max:200}), N('cr','Créatinine',null,1.2,{kind:'creat',min:0.2,max:15}), B('dial','Dialyse', 0),
   B('art','Artériopathie extracardiaque', 0), B('mob','Mobilité réduite', 0, 'Séquelle neurologique ou musculo-squelettique'), B('redo','Chirurgie cardiaque antérieure', 0),
   B('lung','BPCO', 0, 'Bronchodilatateurs ou corticoïdes au long cours'), B('endo','Endocardite active', 0), B('crit','État critique préopératoire', 0, 'TV/FV, massage, ventilation, inotropes, BPIA, IRA'),
   B('ins','Diabète insulinotraité', 0),
   S('nyha','NYHA',[{v:'1',label:'I'},{v:'2',label:'II'},{v:'3',label:'III'},{v:'4',label:'IV'}]), B('ccs4','Angor CCS 4', 0),
   S('lv','FEVG',[{v:'g',label:'> 50 %'},{v:'m',label:'31–50 %'},{v:'p',label:'21–30 %'},{v:'vp',label:'≤ 20 %'}], 'g', true),
   B('mi','IDM récent (< 90 jours)', 0), S('pa','PAPs',[{v:'n',label:'< 31'},{v:'m',label:'31–55'},{v:'s',label:'≥ 55 mmHg'}]),
   S('urg','Urgence',[{v:'e',label:'Programmée'},{v:'u',label:'Urgente'},{v:'em',label:'Urgence'},{v:'s',label:'Sauvetage'}], 'e', true),
   S('wt_int','Type d’intervention',[{v:'0',label:'PAC isolé'},{v:'1',label:'1 geste non-PAC'},{v:'2',label:'2 gestes'},{v:'3',label:'3 gestes ou +'}], '1', true),
   B('aorta','Chirurgie de l’aorte thoracique', 0)],
 ex:{sex:'F', nyha:'3', lv:'m', pa:'m'},
 calc:function(v){
   if([v.age, v.wt, v.cr].some(isNaN)) return null;
   var cc = cockcroft(v.age, v.wt, v.cr, v.sex === 'F'), y = -5.324537;
   y += 0.0285181 * Math.max(1, v.age - 59);
   if(v.sex === 'F') y += 0.2196434;
   if(v.dial) y += 0.6421508; else if(cc < 50) y += 0.8592256; else if(cc <= 85) y += 0.303553;
   if(v.art) y += 0.5360268; if(v.mob) y += 0.2407181; if(v.redo) y += 1.118599; if(v.lung) y += 0.1886564; if(v.endo) y += 0.6194522; if(v.crit) y += 1.086517; if(v.ins) y += 0.3542749;
   y += {1:0, 2:0.1070545, 3:0.2958358, 4:0.5597929}[v.nyha]; if(v.ccs4) y += 0.2226147;
   y += {g:0, m:0.3150652, p:0.8084096, vp:0.9346919}[v.lv]; if(v.mi) y += 0.1528943;
   y += {n:0, m:0.1788899, s:0.3491475}[v.pa]; y += {e:0, u:0.3174673, em:0.7039121, s:1.362947}[v.urg];
   y += {0:0, 1:0.0062118, 2:0.5521478, 3:0.9724533}[v.wt_int]; if(v.aorta) y += 0.6527205;
   var m = Math.exp(y) / (1 + Math.exp(y)) * 100;
   var lvl = m >= 8 ? 'crit' : m >= 4 ? 'warn' : 'ok';
   return R(lvl, fmt(m, 2), '%', m >= 8 ? 'Risque opératoire élevé' : m >= 4 ? 'Risque intermédiaire' : 'Risque faible',
     'À intégrer dans la décision de la Heart Team avec la fragilité, l’anatomie et l’espérance de vie (ex. TAVI ou chirurgie).', [['Clairance (Cockcroft-Gault)', v.dial ? 'dialyse' : fmt(cc) + ' mL/min']], {meter:Math.min(1, m/20)}); },
 ref:'Nashef SAM, Eur J Cardiothorac Surg 2012'},

/* ---------- Rendu ---------- */
var state = CS.store.get('scores.vals', {});
var current = CS.store.get('scores.cur', 'cha2ds2va');
if(!SCORES.some(function(s){ return s.id === current; })) current = 'cha2ds2va';

function defaults(def, withEx){
  var v = {};
  def.inputs.forEach(function(i){ v[i.id] = i.type === 'bool' ? false : i.type === 'num' ? (withEx ? i.def : NaN) : i.def; });
  if(withEx && def.ex) for(var k in def.ex) v[k] = def.ex[k];
  return v;
}
function vals(def){
  if(!state[def.id]) state[def.id] = defaults(def, true);
  var v = state[def.id];
  def.inputs.forEach(function(i){ if(i.type === 'num' && (v[i.id] == null || typeof v[i.id] !== 'number')) v[i.id] = NaN; if(!(i.id in v)) v[i.id] = i.type === 'bool' ? false : i.def; });
  return v;
}
function save(){ CS.store.set('scores.vals', state); }

function renderNav(){
  var nav = CS.$('#sc-nav'), q = (CS.$('#sc-q').value || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  nav.innerHTML = ''; var grp = null;
  SCORES.forEach(function(s){
    var hay = (s.name + ' ' + s.grp + ' ' + s.kw).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
    if(q && hay.indexOf(q) < 0) return;
    if(s.grp !== grp){ grp = s.grp; nav.appendChild(h('div', {class:'grp', text:grp})); }
    nav.appendChild(h('button', {type:'button', 'aria-current':s.id === current ? 'true' : 'false', onclick:function(){ select(s.id); }}, h('span', {text:s.name})));
  });
  var pick = CS.$('#sc-pick'); pick.innerHTML = ''; grp = null; var og;
  SCORES.forEach(function(s){ if(s.grp !== grp){ grp = s.grp; og = h('optgroup', {label:grp}); pick.appendChild(og); } og.appendChild(h('option', {value:s.id, text:s.name, selected:s.id === current})); });
}
function select(id){ current = id; CS.store.set('scores.cur', id); renderNav(); renderScore(); window.scrollTo({top:0}); }

function renderScore(){
  var def = SCORES.filter(function(s){ return s.id === current; })[0], v = vals(def);
  CS.$('#sc-grp').textContent = def.grp; CS.$('#sc-title').textContent = def.name; CS.$('#sc-desc').textContent = def.desc;
  var box = CS.$('#sc-inputs'); box.innerHTML = '';
  def.inputs.forEach(function(inp){
    var el;
    if(inp.type === 'bool'){
      var cb = h('input', {type:'checkbox', id:'in-' + inp.id});
      cb.checked = !!v[inp.id];
      cb.addEventListener('change', function(){ v[inp.id] = cb.checked; save(); renderResult(); });
      el = h('label', {class:'tog', for:'in-' + inp.id}, cb, h('span', {class:'sw'}), h('span', {class:'t'}, inp.label, inp.sub ? h('small', {text:inp.sub}) : null), inp.pts ? h('span', {class:'pts', text:'+' + fmt(inp.pts, inp.pts % 1 ? 1 : 0)}) : null);
    } else if(inp.type === 'sel'){
      var long = inp.options.length > 4 || inp.options.some(function(o){ return o.label.length > 22; });
      if(long){
        var sel = h('select', {class:'inp', id:'in-' + inp.id});
        inp.options.forEach(function(o){ sel.appendChild(h('option', {value:o.v, text:o.label + (o.pts ? '  (+' + o.pts + ')' : ''), selected:o.v === v[inp.id]})); });
        sel.addEventListener('change', function(){ v[inp.id] = sel.value; save(); renderResult(); });
        el = h('div', {class:'sc-sel'}, h('label', {class:'lbl', for:'in-' + inp.id, text:inp.label}), sel);
      } else {
        var sg = h('div', {class:'seg full', role:'group', 'aria-label':inp.label});
        inp.options.forEach(function(o){ sg.appendChild(h('button', {'data-v':o.v, type:'button', text:o.label})); });
        CS.seg(sg, v[inp.id], function(val){ v[inp.id] = val; save(); renderResult(); });
        el = h('div', {class:'sc-sel'}, h('span', {class:'lbl', text:inp.label}), sg);
      }
      if(inp.wide || long) el.classList.add('wide');
    } else {
      var unit = inp.kind ? CS.unitLabel(inp.kind) : inp.unit;
      var shown = isNaN(v[inp.id]) ? '' : (inp.kind ? +CS.fromMgdl(inp.kind, v[inp.id]).toFixed(inp.kind === 'creat' && CS.units() === 'si' ? 0 : 2) : v[inp.id]);
      var ni = h('input', {class:'inp num', id:'in-' + inp.id, type:'text', inputmode:'decimal', value:shown, autocomplete:'off'});
      ni.addEventListener('input', function(){
        var n = CS.num(ni.value);
        var canon = inp.kind && !isNaN(n) ? CS.toMgdl(inp.kind, n) : n;
        var bad = ni.value !== '' && (isNaN(n) || (inp.min != null && canon < inp.min) || (inp.max != null && canon > inp.max));
        ni.classList.toggle('bad', bad);
        v[inp.id] = bad ? NaN : canon; save(); renderResult();
      });
      el = h('div', {class:'field sc-sel'}, h('label', {for:'in-' + inp.id, text:inp.label}), h('div', {class:'inp-unit'}, ni, unit ? h('span', {class:'u', text:unit}) : null), inp.hint ? h('span', {class:'hint', text:inp.hint}) : null);
    }
    box.appendChild(el);
  });
  renderResult();
}

function renderResult(){
  var def = SCORES.filter(function(s){ return s.id === current; })[0], v = vals(def), el = CS.$('#sc-result'), r;
  try{ r = def.calc(v); }catch(e){ r = null; }
  el.className = 'result' + (r ? ' ' + r.level : '');
  if(!r){ el.innerHTML = '<span class="eyebrow">Résultat</span><p class="muted" style="margin-top:8px">Complétez les champs numériques pour obtenir le résultat.</p>'; return; }
  var html = '<span class="eyebrow">Résultat · ' + CS.esc(def.name) + '</span>' +
    '<div style="margin-top:10px" class="big">' + CS.esc(r.big) + (r.unit ? '<small>' + CS.esc(r.unit) + '</small>' : '') + '</div>' +
    '<h3 style="margin-top:8px">' + CS.esc(r.title) + '</h3>';
  if(r.meter != null) html += '<div class="sc-meter" style="color:var(--' + (r.level === 'ok' ? 'ok' : r.level === 'warn' ? 'warn' : r.level === 'info' ? 'info' : 'crit') + ')"><i style="width:' + Math.round(CS.clamp(r.meter, 0.02, 1) * 100) + '%"></i></div>';
  html += '<p class="sc-rec">' + r.rec + '</p>';
  if(r.rows.length) html += '<div class="sc-rows">' + r.rows.map(function(x){ return '<div><span class="muted">' + CS.esc(x[0]) + '</span><b>' + CS.esc(x[1]) + '</b></div>'; }).join('') + '</div>';
  if(r.note) html += '<p class="sc-ref">' + CS.esc(r.note) + '</p>';
  html += '<p class="sc-ref">' + CS.esc(def.ref) + '</p>';
  html += '<div class="row" style="margin-top:12px"><button class="btn sm" type="button" id="sc-copy">' + CS.I.copy + 'Copier le résultat</button></div>';
  el.innerHTML = html;
  CS.$('#sc-copy').onclick = function(){
    var txt = def.name + ' : ' + r.big + (r.unit ? ' ' + r.unit : '') + ' — ' + r.title + '.\n' + r.rows.map(function(x){ return x[0] + ' : ' + x[1]; }).join('\n') + (r.rows.length ? '\n' : '') + r.rec.replace(/<[^>]+>/g, '');
    CS.copy(txt, 'Résultat copié');
  };
}

CS.init({title:'Scores de risque', cat:'Calculateurs', units:true, refs:['Recommandations ESC (2019–2024)', 'Publications originales citées sous chaque score']});
CS.$('#sc-q').addEventListener('input', renderNav);
CS.$('#sc-pick').addEventListener('change', function(e){ select(e.target.value); });
CS.$('#sc-ex').addEventListener('click', function(){ var d = SCORES.filter(function(s){ return s.id === current; })[0]; state[d.id] = defaults(d, true); save(); renderScore(); CS.toast('Exemple chargé'); });
CS.$('#sc-clear').addEventListener('click', function(){ var d = SCORES.filter(function(s){ return s.id === current; })[0]; state[d.id] = defaults(d, false); save(); renderScore(); });
window.addEventListener('cs-units', renderScore);
renderNav(); renderScore();
})();
</script>
