<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Compte rendu d’écho</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Cœur Net — socle commun
   Barre supérieure collante, contenu centré (max 1240px), grilles qui passent en une colonne sur téléphone,
   barre d'onglets en bas sur téléphone. Propriétés logiques partout : l'arabe (RTL) se retourne tout seul. */
:root{
  --bg:#f3f6f9; --surface:#ffffff; --surface-2:#f0f4f8; --surface-3:#e3e9ef;
  --line:#dde4eb; --line-strong:#c3cdd7;
  --fg:#0f1d2b; --fg-2:#2d3e50; --muted:#5b6b7b;
  --accent:#0b6e99; --accent-hover:#085a7e; --accent-ink:#ffffff; --accent-soft:#e2f0f6;
  --heart:#d64545; --heart-soft:#fde9e9;
  --ok:#137a4b; --ok-soft:#e2f4ea; --warn:#975a00; --warn-soft:#fdf1dc;
  --crit:#b42318; --crit-soft:#fde7e5; --info:#1d5ea8; --info-soft:#e4eefa;
  --g-echo:#0b6e99; --g-patient:#7a4bc4; --g-calc:#137a4b; --g-learn:#c26a00;
  --paper:#fff8f6; --grid-minor:#f5cfcf; --grid-major:#e59a9a; --trace:#1a1a1a;
  --shadow:0 1px 2px rgba(15,29,43,.05);
  --shadow-md:0 4px 14px rgba(15,29,43,.08);
  --shadow-lg:0 12px 36px rgba(15,29,43,.16);
  --font:"Segoe UI Variable Text","Segoe UI",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Roboto,Arial,sans-serif;
  --font-display:"Segoe UI Variable Display","Segoe UI",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Roboto,Arial,sans-serif;
  --font-ar:"Segoe UI","SF Arabic","Geeza Pro","Noto Sans Arabic","Noto Naskh Arabic",Tahoma,sans-serif;
  --mono:ui-monospace,"Cascadia Mono","SF Mono",Consolas,Menlo,monospace;
  --r:10px; --r-sm:8px; --r-lg:14px;
  --tabbar-h:0px;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0e1114; --surface:#161a1f; --surface-2:#1d2228; --surface-3:#272d35;
  --line:#2a3139; --line-strong:#3a434e;
  --fg:#e9ebee; --fg-2:#c9ced5; --muted:#9aa3ae;
  --accent:#4fb3dd; --accent-hover:#72c4e6; --accent-ink:#04202d; --accent-soft:#11303d;
  --heart:#ff7a7a; --heart-soft:#3a1717;
  --ok:#4fc68b; --ok-soft:#132d20; --warn:#f0a73c; --warn-soft:#33250f;
  --crit:#ff6d62; --crit-soft:#3a1714; --info:#6ea9f0; --info-soft:#13263c;
  --g-echo:#4fb3dd; --g-patient:#b08ef0; --g-calc:#4fc68b; --g-learn:#f0a73c;
  --paper:#1a1416; --grid-minor:#3b2529; --grid-major:#663840; --trace:#f3eeee;
  --shadow:0 1px 2px rgba(0,0,0,.4);
  --shadow-md:0 4px 14px rgba(0,0,0,.4);
  --shadow-lg:0 12px 36px rgba(0,0,0,.6);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased;overflow-x:hidden}
html[lang="ar"] body{font-family:var(--font-ar);font-size:15.5px;line-height:1.65}
html[lang="ar"] h1,html[lang="ar"] h2,html[lang="ar"] h3,html[lang="ar"] h4{font-family:var(--font-ar);letter-spacing:0}
html[lang="ar"] .eyebrow{letter-spacing:0;text-transform:none;font-size:.78rem}
body.noscroll{overflow:hidden}
h1,h2,h3,h4{font-family:var(--font-display);line-height:1.2;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.6rem;font-weight:650} h2{font-size:1.2rem;font-weight:650} h3{font-size:1.02rem;font-weight:650} h4{font-size:.92rem;font-weight:650}
p{margin:0}
a{color:var(--info)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.num,.tnum{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}
.small{font-size:.84rem}
.xs{font-size:.76rem}
.eyebrow{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.ltr{direction:ltr;unicode-bidi:isolate}
.ar,[lang="ar"] .ar{font-family:var(--font-ar)}

/* Barre supérieure */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
.cs-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line)}
.cs-top-in{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:10px;min-height:58px;padding-block:8px;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
.cs-back{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding-block:6px;padding-inline:9px 12px;cursor:pointer;font-size:.86rem;color:var(--fg-2);text-decoration:none;white-space:nowrap}
.cs-back:hover{border-color:var(--line-strong);color:var(--fg)}
.cs-back svg{width:16px;height:16px;flex:none}
[dir="rtl"] .cs-back svg,[dir="rtl"] .flip-rtl{transform:scaleX(-1)}
.cs-brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1;text-decoration:none;color:inherit}
.cs-logo{width:32px;height:32px;flex:none;border-radius:9px;background:linear-gradient(140deg,#e25555,#b8233a);display:grid;place-items:center;box-shadow:0 2px 6px rgba(184,35,58,.3)}
.cs-logo svg{width:20px;height:20px}
.cs-titles{min-width:0}
.cs-titles .eyebrow{display:block;line-height:1.15}
.cs-titles h1{font-size:1.06rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cs-actions{display:flex;align-items:center;gap:6px;flex:none}
.cs-doc{font-size:.8rem;color:var(--muted);white-space:nowrap;max-width:180px;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:38px;height:38px;border-radius:999px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--fg-2);flex:none;font-weight:700;font-size:.92rem;padding:0}
.icon-btn:hover{border-color:var(--line-strong);color:var(--fg)}
.icon-btn svg{width:18px;height:18px}
.cs-lang{font-family:var(--font-ar)}
@media (max-width:720px){
  .hide-sm{display:none!important}
  .cs-back span{display:none}
  .cs-back{padding:7px}
  .cs-top-in{gap:8px;min-height:54px}
  .cs-titles h1{font-size:1rem}
  .cs-actions .btn:not(.icon-btn){min-height:38px;padding:6px 10px}
}

/* Barre d'onglets du bas (téléphone) */
.cs-tabbar{display:none}
@media (max-width:720px){
  body.has-tabbar{--tabbar-h:calc(62px + env(safe-area-inset-bottom,0px));padding-bottom:var(--tabbar-h)}
  .cs-tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;inset:auto 0 0;z-index:55;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
  .cs-tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:62px;border:0;background:none;color:var(--muted);text-decoration:none;font-size:.7rem;font-weight:600;cursor:pointer;padding:0}
  .cs-tab .ic svg{width:23px;height:23px;display:block}
  .cs-tab.on{color:var(--accent)}
  .cs-tab.on .ic{background:var(--accent-soft);border-radius:999px;padding:2px 14px}
}

/* Contenu */
.wrap{max-width:1240px;margin:0 auto;padding-block:20px 28px;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.between{justify-content:space-between}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:900px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:620px){.g2,.g3,.g4{grid-template-columns:minmax(0,1fr)}}
.split{display:grid;grid-template-columns:260px minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:860px){.split{grid-template-columns:minmax(0,1fr)}}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;box-shadow:var(--shadow);min-width:0}
.card.flat{box-shadow:none}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.panel{background:var(--surface-2);border-radius:var(--r);padding:12px 14px}
.divider{height:1px;background:var(--line);margin:4px 0}

/* Champs */
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label,.lbl{font-size:.82rem;font-weight:600;color:var(--fg-2)}
.field .hint{font-size:.75rem;color:var(--muted)}
.inp,select.inp,textarea.inp{width:100%;min-height:44px;border:1px solid var(--line-strong);background:var(--surface);border-radius:var(--r-sm);padding:8px 11px;font-size:1rem}
textarea.inp{min-height:84px;resize:vertical;line-height:1.45}
.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.inp-unit{display:flex;align-items:stretch}
.inp-unit .inp{border-start-end-radius:0;border-end-end-radius:0;min-width:0}
.inp-unit .u{display:flex;align-items:center;padding:0 10px;border:1px solid var(--line-strong);border-inline-start:0;border-start-end-radius:var(--r-sm);border-end-end-radius:var(--r-sm);background:var(--surface-2);font-size:.8rem;color:var(--muted);white-space:nowrap;direction:ltr}
.inp.bad{border-color:var(--crit);box-shadow:0 0 0 3px var(--crit-soft)}
input[inputmode="decimal"],input[type="number"]{direction:ltr;text-align:start}
[dir="rtl"] input[inputmode="decimal"]{text-align:right}

/* Contrôle segmenté */
.seg{display:inline-flex;flex-wrap:wrap;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:3px;gap:3px}
.seg button{border:0;background:transparent;padding:7px 12px;border-radius:6px;cursor:pointer;font-size:.88rem;color:var(--fg-2);min-height:38px}
.seg button:hover{color:var(--fg)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--accent);box-shadow:0 0 0 1px var(--line-strong),0 1px 3px rgba(0,0,0,.06);font-weight:650}
.seg.full{display:flex;flex-wrap:nowrap}.seg.full button{flex:1 1 0;min-width:0;padding:7px 6px;line-height:1.2}

/* Puces de sélection (profil patient) */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:8px 14px;min-height:40px;cursor:pointer;font-size:.9rem;color:var(--fg-2);transition:background .15s,border-color .15s,color .15s}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.chip .ck{width:16px;height:16px;display:none}
.chip[aria-pressed="true"] .ck{display:block}

/* Bascule oui/non (grande cible tactile) */
.tog{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);cursor:pointer;user-select:none;min-height:48px;transition:border-color .15s,background .15s}
.tog:hover{border-color:var(--line-strong)}
.tog input{position:absolute;opacity:0;pointer-events:none}
.tog .sw{flex:none;width:38px;height:22px;border-radius:999px;background:var(--surface-3);position:relative;transition:background .15s}
.tog .sw::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:16px;height:16px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.tog input:checked+.sw{background:var(--accent)}
.tog input:checked+.sw::after{transform:translateX(16px)}
[dir="rtl"] .tog input:checked+.sw::after{transform:translateX(-16px)}
.tog input:focus-visible+.sw{outline:2px solid var(--accent);outline-offset:2px}
.tog .t{flex:1;min-width:0;font-size:.92rem;line-height:1.3}
.tog .t small{display:block;color:var(--muted);font-size:.76rem}
.tog .pts{font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.tog:has(input:checked){border-color:color-mix(in srgb,var(--accent) 45%,var(--line));background:color-mix(in srgb,var(--accent-soft) 55%,var(--surface))}

/* Case à cocher simple */
.chk{display:flex;gap:9px;align-items:flex-start;cursor:pointer;font-size:.92rem;line-height:1.35;padding:4px 0}
.chk input{width:18px;height:18px;margin:1px 0 0;accent-color:var(--accent);flex:none}

/* Boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line-strong);background:var(--surface);color:var(--fg);border-radius:var(--r-sm);padding:8px 14px;min-height:44px;cursor:pointer;font-size:.9rem;font-weight:600;text-decoration:none;text-align:center;line-height:1.2;transition:background .15s,border-color .15s,transform .1s}
.btn:active{transform:scale(.98)}
.btn:hover{background:var(--surface-2)}
.btn svg{width:16px;height:16px;flex:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{min-height:34px;padding:5px 11px;font-size:.84rem}
.btn.danger{color:var(--crit)}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* Badges et résultats */
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:.76rem;font-weight:600;white-space:nowrap;background:var(--surface-3);color:var(--fg-2)}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.crit{background:var(--crit-soft);color:var(--crit)}
.badge.info{background:var(--info-soft);color:var(--info)}
.badge.acc{background:var(--accent-soft);color:var(--accent)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}
.result{border-radius:var(--r-lg);padding:16px;border:1px solid var(--line);background:var(--surface-2);position:relative;overflow:hidden}
.result::before{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:4px;background:var(--muted)}
.result.ok::before{background:var(--ok)} .result.warn::before{background:var(--warn)} .result.crit::before{background:var(--crit)} .result.info::before{background:var(--info)}
.result .big{font-family:var(--font-display);font-size:2.4rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.result .big small{font-size:1rem;font-weight:500;color:var(--muted);margin-inline-start:4px}
.result.ok .big{color:var(--ok)} .result.warn .big{color:var(--warn)} .result.crit .big{color:var(--crit)} .result.info .big{color:var(--info)}
.cls{display:inline-block;font-size:.72rem;font-weight:700;padding:1px 7px;border-radius:4px;font-family:var(--mono)}
.cls.I{background:var(--ok-soft);color:var(--ok)} .cls.IIa{background:var(--info-soft);color:var(--info)} .cls.IIb{background:var(--warn-soft);color:var(--warn)} .cls.III{background:var(--crit-soft);color:var(--crit)}

/* Tableaux */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
table.tbl{width:100%;border-collapse:collapse;font-size:.88rem}
.tbl th,.tbl td{padding:8px 10px;text-align:start;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{background:var(--surface-2);font-weight:600;font-size:.78rem;color:var(--fg-2);white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tbl td.n,.tbl th.n{text-align:end;font-variant-numeric:tabular-nums}

/* Onglets */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;color:var(--muted);font-weight:550;font-size:.92rem;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button:hover{color:var(--fg)}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}

/* Liste latérale */
.navlist{display:flex;flex-direction:column;gap:2px}
.navlist .grp{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:650;padding:12px 10px 4px}
.navlist button{display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:start;border:0;background:none;padding:9px 10px;border-radius:var(--r-sm);cursor:pointer;color:var(--fg-2);font-size:.9rem}
.navlist button:hover{background:var(--surface-2);color:var(--fg)}
.navlist button[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}

/* Pied de page */
.cs-foot{border-top:1px solid var(--line);margin-top:10px}
.cs-foot-in{max-width:1240px;margin:0 auto;padding-block:14px 22px;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:6px;font-size:.76rem;color:var(--muted)}
.cs-foot strong{color:var(--fg-2);font-weight:600}

/* Toast */
.cs-toast{position:fixed;left:50%;bottom:calc(20px + var(--tabbar-h));transform:translateX(-50%) translateY(20px);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:.88rem;box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:120;max-width:calc(100% - 32px)}
.cs-toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* Fenêtre modale ; « sheet » = feuille qui monte du bas sur téléphone */
.modal-bg{position:fixed;inset:0;background:rgba(10,12,16,.45);z-index:90;display:grid;place-items:center;padding:16px;animation:fadeIn .15s ease}
.modal{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow-lg);width:min(560px,100%);max-height:calc(100dvh - 32px);overflow:auto;padding:18px;border:1px solid var(--line);overscroll-behavior:contain}
@media (max-width:720px){
  .modal-bg.sheet{place-items:end stretch;padding:0}
  .modal-bg.sheet .modal{width:100%;border-radius:20px 20px 0 0;max-height:88dvh;padding:10px 18px calc(18px + env(safe-area-inset-bottom,0px));animation:sheetUp .25s cubic-bezier(.2,.8,.2,1)}
  .modal-bg.sheet .modal::before{content:"";display:block;width:40px;height:4px;border-radius:4px;background:var(--line-strong);margin:0 auto 10px}
}
@keyframes fadeIn{from{opacity:0}}
@keyframes sheetUp{from{transform:translateY(100%)}}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:4px 0}
.set-l{min-width:0;flex:1 1 180px}
.set-t{font-weight:600;font-size:.94rem}

/* Menu des outils (feuille) */
.tm-list{display:flex;flex-direction:column;gap:4px}
.tm-grp{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:10px 4px 2px}
.tm-item{display:flex;gap:12px;align-items:center;padding:10px;border-radius:var(--r);text-decoration:none;color:var(--fg)}
.tm-item:hover,.tm-item.on{background:var(--surface-2)}
.tm-ic{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;flex:none;color:#fff;background:var(--g,var(--accent))}
.tm-ic svg{width:22px;height:22px}
.tm-tx{display:flex;flex-direction:column;min-width:0}
.g-echo{--g:var(--g-echo)} .g-patient{--g:var(--g-patient)} .g-calc{--g:var(--g-calc)} .g-learn{--g:var(--g-learn)}

/* Visite guidée */
.tour-mask{position:fixed;inset:0;z-index:200;pointer-events:auto}
.tour-hole{position:fixed;z-index:201;border-radius:12px;box-shadow:0 0 0 9999px rgba(8,14,22,.58);transition:all .3s cubic-bezier(.2,.8,.2,1);pointer-events:none;outline:2px solid var(--accent);outline-offset:3px}
.tour-pop{position:fixed;z-index:202;width:min(380px,calc(100vw - 24px));background:var(--surface);color:var(--fg);border-radius:16px;box-shadow:var(--shadow-lg);border:1px solid var(--line);padding:16px 16px 12px;transition:top .3s,left .3s;animation:fadeIn .2s ease}
.tour-pop h3{font-size:1.04rem;margin-bottom:6px}
.tour-pop .tb{font-size:.92rem;line-height:1.55;color:var(--fg-2)}
.tour-pop .tb p+p{margin-top:6px}
.tour-pop .tb b{color:var(--fg)}
.tour-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:14px}
.tour-dots{display:flex;gap:4px;flex-wrap:wrap;max-width:45%}
.tour-dots i{width:6px;height:6px;border-radius:50%;background:var(--line-strong)}
.tour-dots i.on{background:var(--accent);width:16px;border-radius:4px}
.tour-step{font-size:.74rem;color:var(--muted);font-weight:600}
@media (max-width:720px){
  .tour-pop.sheet{left:0!important;right:0;top:auto!important;bottom:0;width:100%;border-radius:20px 20px 0 0;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
}

/* Graphiques SVG */
.chart text{fill:var(--muted);font-size:10.5px;font-family:var(--font)}
.chart .gridl{stroke:var(--line);stroke-width:1}
.chart .axis{stroke:var(--line-strong);stroke-width:1}

@media (hover:none){.btn:hover{background:var(--surface)}.btn.primary:hover{background:var(--accent)}.btn.ghost:hover{background:transparent}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
@media print{
  body::before,.cs-top,.cs-foot,.cs-tabbar,.no-print{display:none!important}
  body{background:#fff;color:#000;padding:0!important}
  .card{box-shadow:none;border-color:#ccc}
  .wrap{padding:0;max-width:none}
}

  function download(name, content, mime){
    try{
      var blob = new Blob([content], {type:(mime || 'text/plain') + ';charset=utf-8'});
      var a = h('a', {href:URL.createObjectURL(blob), download:name}); document.body.appendChild(a); a.click();
      setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 500);
      toast({fr:'Fichier « ' + name + ' » enregistré', ar:'تم حفظ الملف « ' + name + ' »'});
    }catch(e){ toast({fr:'Téléchargement impossible ici', ar:'التنزيل غير ممكن هنا'}); }
  }
  function toCSV(rows, cols){
    var sep = ';';
    function cell(v){ v = v == null ? '' : String(v); return /[;"\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
    var out = [cols.map(function(c){ return cell(c.label || c.key); }).join(sep)];
    rows.forEach(function(r){ out.push(cols.map(function(c){ return cell(typeof c.get === 'function' ? c.get(r) : r[c.key]); }).join(sep)); });
    return '﻿' + out.join('\r\n');
  }

  /* ---------- Sauvegarde : exporter / importer toutes les données de cet appareil ---------- */
  function exportBackup(){
    var data = {};
    store.keys().forEach(function(k){ data[k] = store.get(k); });
    var payload = {app:'coeur-net', schema:SCHEMA, date:new Date().toISOString(), data:data};
    download('coeur-net-sauvegarde-' + todayISO() + '.json', JSON.stringify(payload, null, 1), 'application/json');
  }
  function applyBackup(p){
    if(!p || p.app !== 'coeur-net' || !p.data || typeof p.data !== 'object') return false;
    store.keys().forEach(function(k){ store.del(k); });
    Object.keys(p.data).forEach(function(k){ store.set(k, p.data[k]); });
    return true;
  }
  function importBackup(){
    var inp = h('input', {type:'file', accept:'application/json,.json', style:{display:'none'}});
    inp.addEventListener('change', function(){
      var f = inp.files && inp.files[0]; if(!f) return;
      var r = new FileReader();
      r.onload = function(){
        var p; try{ p = JSON.parse(r.result); }catch(e){ p = null; }
        if(!p || p.app !== 'coeur-net'){ toast({fr:'Ce fichier n’est pas une sauvegarde Cœur Net', ar:'هذا الملف ليس نسخة احتياطية من Cœur Net'}); return; }
        ask({fr:'Remplacer les données de cet appareil par la sauvegarde du ' + frDate(p.date) + ' ?', ar:'استبدال بيانات هذا الجهاز بالنسخة الاحتياطية بتاريخ ' + frDate(p.date) + '؟'}, {fr:'Remplacer', ar:'استبدال'}).then(function(ok){
          if(ok && applyBackup(p)) location.reload();
        });
      };
      r.readAsText(f);
    });
    document.body.appendChild(inp); inp.click(); setTimeout(function(){ inp.remove(); }, 60000);
  }

  function modal(content, opts){
    opts = opts || {};
    var bg = h('div', {class:'modal-bg' + (opts.sheet ? ' sheet' : ''), role:'dialog', 'aria-modal':'true'});
    var box = h('div', {class:'modal'}, content);
    bg.appendChild(box);
    var prev = document.activeElement;
    function close(){ bg.remove(); document.removeEventListener('keydown', onKey); if(!$('.modal-bg')) document.body.classList.remove('noscroll'); if(prev && prev.focus) try{ prev.focus(); }catch(e){} if(opts.onClose) opts.onClose(); }
    function onKey(e){ if(e.key === 'Escape') close(); }
    bg.addEventListener('click', function(e){ if(e.target === bg) close(); });
    document.addEventListener('keydown', onKey);
    document.body.appendChild(bg); document.body.classList.add('noscroll');
    var f = box.querySelector('[autofocus],input,select,textarea,button.primary'); if(f && !opts.noFocus) setTimeout(function(){ f.focus(); }, 30);
    return {close:close, el:box};
  }

      item(null, I.grid, {fr:'Outils', ar:'الأدوات'}, false, toolMenu),
      item('quiz.html', toolIcon('quiz'), {fr:'Quiz', ar:'اختبار'}, PAGE === 'quiz'),
      item(null, I.gear, {fr:'Réglages', ar:'الإعدادات'}, false, settings));
    document.body.appendChild(bar);
    document.body.classList.add('has-tabbar');
  }
  function recordRecent(id){
    var st = store.get('hub', {fav:[], recent:[]});
    st.recent = [id].concat((st.recent || []).filter(function(x){ return x !== id; })).slice(0, 6);
    st.last = {id:id, at:Date.now()};
    store.set('hub', st);
  }
  function registerSW(){
    if(!('serviceWorker' in navigator) || location.protocol !== 'https:') return;
    try{ navigator.serviceWorker.register('sw.js'); }catch(e){}
  }

  /* ---------- Niveaux du quiz (partagé avec l'accueil) ----------
     Passer du niveau L au niveau L+1 coûte 100 + 60·(L−1) XP. */
  var TITLES = [
    {fr:'Externe', ar:'طالب خارجي'}, {fr:'Interne', ar:'طبيب داخلي'}, {fr:'Résident', ar:'طبيب مقيم'},
    {fr:'Chef de clinique', ar:'رئيس عيادة'}, {fr:'Assistant hospitalo-universitaire', ar:'مساعد استشفائي جامعي'},
    {fr:'Maître de conférences agrégé', ar:'أستاذ مبرِّز'}, {fr:'Professeur', ar:'أستاذ'}, {fr:'Légende du cœur', ar:'أسطورة القلب'}
  ];
  function level(xp){
    xp = Math.max(0, Math.floor(xp || 0));
    var L = 1, base = 0, need = 100;
    while(xp >= base + need){ base += need; L++; need = 100 + 60 * (L - 1); }
    return {lvl:L, xp:xp, base:base, next:base + need, pct:(xp - base) / need, title:TITLES[Math.min(TITLES.length - 1, Math.floor((L - 1) / 2))]};
  }

  /* ---------- Hasard reproductible ---------- */
  function rng(seed){
    var a = seed >>> 0;
    return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; var r = Math.imul(a ^ a >>> 15, 1 | a); r = r + Math.imul(r ^ r >>> 7, 61 | r) ^ r; return ((r ^ r >>> 14) >>> 0) / 4294967296; };
  }
  function gauss(r){ var u = 1 - r(), v = r(); return Math.sqrt(-2*Math.log(u)) * Math.cos(2*Math.PI*v); }

  window.CS = {
    store:store, sync:sync, VERSION:VERSION, PAGE:PAGE, isDark:isDark, toggleTheme:toggleTheme, setTheme:setTheme, css:css,
    lang:lang, isAr:isAr, setLang:setLang, t:t, locale:locale,
    $:$, $$:$$, h:h, esc:esc, fmt:fmt, pct:pct, clamp:clamp, num:num, todayISO:todayISO, frDate:frDate, frDateLong:frDateLong,
    units:units, setUnits:setUnits, unitLabel:unitLabel, toMgdl:toMgdl, fromMgdl:fromMgdl, conv:conv,
    doctor:doctor, doctorLabel:doctorLabel, editDoctor:editDoctor,
    patient:patient, setPatient:setPatient, editPatient:editPatient, patientSummary:patientSummary, bsa:bsa,
    TOOLS:TOOLS, GROUPS:GROUPS, tool:tool, group:group, toolIcon:toolIcon, toolMenu:toolMenu, settings:settings,
    exportBackup:exportBackup, importBackup:importBackup, applyBackup:applyBackup,
    I:I, toast:toast, copy:copy, download:download, toCSV:toCSV, modal:modal, ask:ask, seg:seg, segEl:segEl, init:init,
    back:function(){ location.href = 'index.html'; },
    rng:rng, gauss:gauss, level:level
  };
})();

<script>
/* Cœur Net — visite guidée (window.CS.tour)
   CS.tour.define([{el:'#sel' | fn, title:{fr,ar}, body:{fr,ar} (HTML permis), before:fn, after:fn}], {key})
   Démarre seule à la première ouverture de la page ; le bouton « ? » de l'en-tête la relance. */
(function(){
  'use strict';
  var CS = window.CS, h = CS.h, t = CS.t;
  var steps = [], key = 'tour.' + CS.PAGE, idx = 0, mask, hole, pop, active = false;

  function define(list, opts){
    steps = list || [];
    if(opts && opts.key) key = 'tour.' + opts.key;
    // première visite : on attend que la page soit dessinée
    if(!CS.store.get(key, false)) setTimeout(function(){ if(!active && !document.querySelector('.modal-bg')) start(false); }, 700);
  }
  function target(s){
    if(!s.el) return null;
    var el = typeof s.el === 'function' ? s.el() : document.querySelector(s.el);
    if(!el) return null;
    var r = el.getBoundingClientRect();
    if(r.width === 0 && r.height === 0) return null;
    return el;
  }
  function isSheet(){ return window.matchMedia('(max-width:720px)').matches; }

  function start(force){
    if(!steps.length) return;
    if(active) stop(false);
    active = true; idx = 0;
    mask = h('div', {class:'tour-mask', 'aria-hidden':'true'});
    hole = h('div', {class:'tour-hole'});
    pop = h('div', {class:'tour-pop', role:'dialog', 'aria-modal':'true', 'aria-live':'polite'});
    mask.addEventListener('click', function(e){ e.stopPropagation(); });
    document.body.appendChild(mask); document.body.appendChild(hole); document.body.appendChild(pop);
    document.addEventListener('keydown', onKey, true);
    window.addEventListener('resize', place);
    window.addEventListener('scroll', place, true);
    show(0);
  }
  function stop(done){
    if(!active) return;
    var s = steps[idx]; if(s && s.after) try{ s.after(); }catch(e){}
    active = false;
    [mask, hole, pop].forEach(function(x){ if(x) x.remove(); });
    document.removeEventListener('keydown', onKey, true);
    window.removeEventListener('resize', place);
    window.removeEventListener('scroll', place, true);
    CS.store.set(key, true);
    if(done) CS.toast({fr:'Visite terminée. Le bouton « ? » la relance à tout moment.', ar:'انتهت الجولة. يعيد زر «؟» تشغيلها في أي وقت.'});
  }
  function onKey(e){
    if(!active) return;
    var rtl = CS.isAr();
    if(e.key === 'Escape'){ e.preventDefault(); stop(false); }
    else if(e.key === (rtl ? 'ArrowLeft' : 'ArrowRight') || e.key === 'Enter'){ e.preventDefault(); next(); }
    else if(e.key === (rtl ? 'ArrowRight' : 'ArrowLeft')){ e.preventDefault(); prev(); }
  }
  function next(){ if(idx < steps.length - 1) show(idx + 1); else stop(true); }
  function prev(){ if(idx > 0) show(idx - 1); }

  function show(i){
    var old = steps[idx]; if(old && old.after && i !== idx) try{ old.after(); }catch(e){}
    idx = i;
    var s = steps[i];
    if(s.before) try{ s.before(); }catch(e){}
    var last = i === steps.length - 1;
    pop.innerHTML = '';
    var dots = h('div', {class:'tour-dots'});
    for(var k = 0; k < steps.length; k++) dots.appendChild(h('i', {class:k === i ? 'on' : ''}));
    pop.appendChild(h('div', {class:'row between', style:{marginBottom:'6px'}},
      h('span', {class:'tour-step', text:(i + 1) + ' / ' + steps.length}),
      h('button', {class:'btn ghost sm', type:'button', text:{fr:'Passer', ar:'تخطٍّ'}, onclick:function(){ stop(false); }})));
    pop.appendChild(h('h3', {text:s.title}));
    pop.appendChild(h('div', {class:'tb', html:t(s.body)}));
    pop.appendChild(h('div', {class:'tour-foot'}, dots,
      h('div', {class:'row', style:{gap:'6px'}},
        i > 0 ? h('button', {class:'btn sm', type:'button', text:{fr:'Précédent', ar:'السابق'}, onclick:prev}) : null,
        h('button', {class:'btn sm primary', type:'button', text:last ? {fr:'Terminer', ar:'إنهاء'} : {fr:'Suivant', ar:'التالي'}, onclick:next}))));
    var el = target(s);
    if(el){
      var r = el.getBoundingClientRect();
      var vh = window.innerHeight, sheetH = isSheet() ? Math.min(pop.offsetHeight || 260, vh * .5) : 0;
      var visibleTop = 70, visibleBottom = vh - sheetH - 16;
      if(r.top < visibleTop || r.bottom > visibleBottom){
        var y = window.scrollY + r.top - (isSheet() ? Math.max(70, (visibleBottom - r.height) / 2) : vh / 2 - r.height / 2);
        window.scrollTo({top:Math.max(0, y), behavior:'smooth'});
      }
    }
    place(); setTimeout(place, 360);
    var f = pop.querySelector('.btn.primary'); if(f) f.focus({preventScroll:true});
  }
  function place(){
    if(!active) return;
    var s = steps[idx], el = target(s), sheet = isSheet();
    pop.classList.toggle('sheet', sheet);
    if(!el){
      hole.style.cssText = 'top:50%;left:50%;width:0;height:0;outline:0';
      if(!sheet){ pop.style.left = Math.max(12, (window.innerWidth - pop.offsetWidth) / 2) + 'px'; pop.style.top = Math.max(12, (window.innerHeight - pop.offsetHeight) / 2) + 'px'; }
      return;
    }
    var r = el.getBoundingClientRect(), pad = 6;
    hole.style.cssText = 'top:' + (r.top - pad) + 'px;left:' + (r.left - pad) + 'px;width:' + (r.width + pad * 2) + 'px;height:' + (r.height + pad * 2) + 'px';
    if(sheet){ pop.style.left = ''; pop.style.top = ''; return; }
    var pw = pop.offsetWidth, ph = pop.offsetHeight, vw = window.innerWidth, vh = window.innerHeight, gap = 14;
    var top = r.bottom + gap;
    if(top + ph > vh - 12) top = r.top - ph - gap;
    if(top < 12){ // ni dessous ni dessus : à côté
      top = Math.min(Math.max(12, r.top), vh - ph - 12);
      var side = CS.isAr() ? r.left - pw - gap : r.right + gap;
      if(side + pw > vw - 12 || side < 12) side = CS.isAr() ? r.right + gap : r.left - pw - gap;
      pop.style.left = Math.min(Math.max(12, side), vw - pw - 12) + 'px';
    } else {
      var left = CS.isAr() ? r.right - pw : r.left;
      pop.style.left = Math.min(Math.max(12, left), vw - pw - 12) + 'px';
    }
    pop.style.top = top + 'px';
  }

  CS.tour = {define:define, start:start, stop:stop, get active(){ return active; }};
})();

</script>
<script>
/* CardioSuite — moteur de fonction diastolique (ASE/EACVI 2016 et ASE 2025)
   Logique pure, sans DOM : partagée par 18-diastolique, 06-echo et les tests (node --test).
   Seuils relus sur les figures des publications :
     - Nagueh SF et al., J Am Soc Echocardiogr 2016;29:277-314 (algorithmes A et B)
     - Nagueh SF et al., J Am Soc Echocardiogr 2025;38(7) : fig. 3 (algorithme principal), fig. 4 (MAC),
       fig. 5 (transplantés), fig. 6 (HTP), fig. 8 (FA), tableau 6 (e′ selon l'âge), tableau 7 (populations particulières)
   Entrée : vitesses en cm/s (E, A, e′), Vmax IT et IP en m/s, temps en ms, VOGi en mL/m², SLOG (LARS) en %.
   Sortie : {guideline, algo, pop, lap, grade, lvl, title, lapTxt, crit[], path[], missing[], notes[], refs[], sentence} */
(function(root){
'use strict';

var REF16 = 'Nagueh SF et al., JASE 2016 – fonction diastolique (ASE/EACVI)';
var REF25 = 'Nagueh SF et al., JASE 2025 – fonction diastolique (ASE)';

var POPS = {
  std:{l:'Cas général'},
  af:{l:'Fibrillation atriale'},
  mac:{l:'Calcifications annulaires mitrales modérées ou sévères'},
  ms:{l:'Rétrécissement mitral'},
  mr:{l:'Insuffisance mitrale primaire significative'},
  mvs:{l:'Réparation, prothèse mitrale ou TEER'},
  hcm:{l:'Cardiomyopathie hypertrophique'},
  ph:{l:'Hypertension pulmonaire non cardiaque (groupes 1, 3 à 5)'},
  htx:{l:'Transplantation cardiaque (rythme sinusal)'},
  na:{l:'Constriction péricardique ou assistance ventriculaire'}
};

function N(x){
  if(typeof x === 'number') return x;
  if(x == null) return NaN;
  x = String(x).replace(',', '.').trim();
  return x === '' ? NaN : Number(x);
}
function ok(x){ return !isNaN(x) && isFinite(x); }
function f(x, d){ return ok(x) ? x.toFixed(d == null ? 0 : d).replace('.', ',') : '–'; }

/* ---------- Oreillette gauche : VOGi (référence) ou, à défaut, surface OG en 4 cavités ---------- */
// Seuil de la surface : > 20 cm² (dilatation selon la quantification des cavités ASE/EACVI). Approximation pragmatique :
// le VOGi reste le paramètre des recommandations et prime s'il est saisi.
function laAbn(d){ if(ok(d.lavi)) return d.lavi > 34; if(ok(d.laa)) return d.laa > 20; return null; }
function laVal(d){ return ok(d.lavi) ? f(d.lavi, 0) + ' mL/m²' : ok(d.laa) ? f(d.laa, 0) + ' cm²' : ''; }
function laName(d, def){ return !ok(d.lavi) && ok(d.laa) ? 'Surface OG (4 cavités) > 20 cm²' : def; }
function laThr(d){ return !ok(d.lavi) && ok(d.laa) ? '> 20 cm² (à défaut du VOGi > 34 mL/m²)' : '> 34 mL/m²'; }

/* ---------- Grandeurs dérivées ---------- */
function derive(inp){
  var d = {};
  ['age', 'lvef', 'e', 'a', 'es', 'el', 'trv', 'pasp', 'lavi', 'laa', 'lars', 'pvsd', 'ivrt', 'dt', 'ara', 'prv', 'padp', 'lwave', 'valsalva', 'srivr', 'bmi', 'tee'].forEach(function(k){ d[k] = N(inp[k]); });
  d.ea = d.e / d.a;
  d.eavg = ok(d.es) && ok(d.el) ? (d.es + d.el) / 2 : NaN;
  d.eeavg = d.e / d.eavg; d.eesep = d.e / d.es; d.eelat = d.e / d.el;
  d.esr = d.e / d.srivr;            // E / SRIVR en cm (transplantés)
  d.ivrtTee = d.ivrt / d.tee;       // TRIV / TE-e′ (valvulopathies mitrales)
  d.myo = !!inp.myo || (ok(d.lvef) && d.lvef < 50);
  d.ageAdj = !!inp.ageAdj && ok(d.age);
  return d;
}

/* Seuils de e′ réduite : fig. 3 (≤ 6 / ≤ 7 / ≤ 6,5) ou tableau 6 selon l'âge (< seuil) */
function eLim(d){
  if(d.ageAdj){
    var t = d.age < 40 ? [7, 10, 9] : d.age <= 65 ? [6, 8, 7] : [6, 7, 6.5];
    return {s:t[0], l:t[1], a:t[2], strict:true, txt:'septal < ' + f(t[0], t[0] % 1 ? 1 : 0) + ', latéral < ' + f(t[1], 0) + ' ou moyen < ' + f(t[2], t[2] % 1 ? 1 : 0) + ' cm/s (tableau 6, ' + (d.age < 40 ? '20–39 ans' : d.age <= 65 ? '40–65 ans' : '> 65 ans') + ')'};
  }
  return {s:6, l:7, a:6.5, strict:false, txt:'septal ≤ 6, latéral ≤ 7 ou moyen ≤ 6,5 cm/s'};
}
function eReduced(d){
  if(!ok(d.es) && !ok(d.el)) return null;
  var L = eLim(d), lt = function(x, t){ return ok(x) && (L.strict ? x < t : x <= t); };
  return lt(d.es, L.s) || lt(d.el, L.l) || lt(d.eavg, L.a);
}
function eTxt(d){ return [ok(d.es) ? 'sept. ' + f(d.es, 1) : '', ok(d.el) ? 'lat. ' + f(d.el, 1) : ''].filter(Boolean).join(' · ') + (ok(d.es) || ok(d.el) ? ' cm/s' : ''); }
function eeTxt(d){
  if(ok(d.eeavg)) return 'moyen ' + f(d.eeavg, 1);
  return [ok(d.eesep) ? 'septal ' + f(d.eesep, 1) : '', ok(d.eelat) ? 'latéral ' + f(d.eelat, 1) : ''].filter(Boolean).join(' · ');
}

/* ---------- Construction du résultat ---------- */
function Res(g, pop){
  return {guideline:g, pop:pop, popLabel:POPS[pop].l, algo:'', lap:null, grade:null, lvl:'ok', title:'', lapTxt:'',
    crit:[], path:[], missing:[], notes:[], refs:[g === '2016' && (pop === 'std') ? REF16 : REF25], sentence:''};
}
// abn : true (anormal), false (normal), null (non disponible)
function C(R, k, label, value, abn, thr){ var c = {k:k, label:label, value:value, abn:abn, thr:thr, grp:R.grp || ''}; R.crit.push(c); return c; }
function step(R, id, txt){ R.path.push({id:id, txt:txt}); }
function need(R, k, label, why){ if(!R.missing.some(function(m){ return m.k === k; })) R.missing.push({k:k, label:label, why:why || ''}); }
function cmp(x, op, t){ if(!ok(x)) return null; return op === '>' ? x > t : op === '>=' ? x >= t : op === '<' ? x < t : x <= t; }
function anyTrue(arr){ return arr.some(function(x){ return x === true; }); }
function allNull(arr){ return arr.every(function(x){ return x === null; }); }

function setGrade(R, grade, lap){
  R.grade = grade; R.lap = lap;
  var g25 = R.guideline === '2025';
  if(grade === '0'){ R.title = 'Fonction diastolique normale'; R.lvl = 'ok'; }
  else if(grade === '1'){ R.title = 'Dysfonction diastolique grade 1'; R.lvl = 'abn'; }
  else if(grade === '2'){ R.title = 'Dysfonction diastolique grade 2'; R.lvl = 'sev'; }
  else if(grade === '3'){ R.title = 'Dysfonction diastolique grade 3'; R.lvl = 'sev'; }
  else if(grade === '2-3'){ R.title = 'Dysfonction diastolique grade 2 ou 3'; R.lvl = 'sev'; need(R, 'ea', 'E/A', 'Départage grade 2 (E/A < 2) et grade 3 (E/A ≥ 2)'); }
  else if(grade === '?'){ R.title = 'Fonction diastolique indéterminée'; R.lvl = 'abn'; }
  R.lapTxt = lap === 'normal' ? 'pressions de remplissage normales'
    : lap === 'elevated' ? (grade === '2' && g25 ? 'pressions de remplissage élevées (élévation légère à modérée)' : grade === '3' && g25 ? 'pressions de remplissage élevées (élévation marquée)' : 'pressions de remplissage élevées')
    : lap === 'indeterminate' ? 'pressions de remplissage indéterminées' : '';
}
function setLap(R, lap){
  R.lap = lap;
  R.title = lap === 'normal' ? 'Pressions de remplissage normales' : lap === 'elevated' ? 'Pressions de remplissage élevées' : 'Pressions de remplissage indéterminées';
  R.lapTxt = '';
  R.lvl = lap === 'normal' ? 'ok' : lap === 'elevated' ? 'sev' : 'abn';
}
function gradeByEA(R, d){
  if(!ok(d.ea)){ step(R, 'm.eaNA', 'E/A non disponible'); return '2-3'; }
  if(d.ea < 2){ step(R, 'm.ealt2', 'E/A ' + f(d.ea, 2) + ' < 2'); return '2'; }
  step(R, 'm.eage2', 'E/A ' + f(d.ea, 2) + ' ≥ 2'); return '3';
}

/* ---------- ASE 2025 : algorithme principal (fig. 3) ---------- */
function main25(d, R){
  R.algo = 'm25';
  var L = eLim(d);
  var cE = C(R, 'e', 'e′ réduite', eTxt(d), eReduced(d), L.txt);
  var eeAbn = ok(d.e) ? (anyTrue([cmp(d.eeavg, '>=', 14), cmp(d.eesep, '>=', 15), cmp(d.eelat, '>=', 13)]) ? true : (ok(d.eeavg) || ok(d.eesep) || ok(d.eelat) ? false : null)) : null;
  var cEE = C(R, 'ee', 'E/e′ augmenté', eeTxt(d), eeAbn, 'septal ≥ 15, latéral ≥ 13 ou moyen ≥ 14');
  var trAbn = ok(d.trv) || ok(d.pasp) ? anyTrue([cmp(d.trv, '>=', 2.8), cmp(d.pasp, '>=', 35)]) : null;
  var cTR = C(R, 'tr', 'Vmax IT / PAPS augmentée', [ok(d.trv) ? f(d.trv, 1) + ' m/s' : '', ok(d.pasp) ? 'PAPS ' + f(d.pasp) + ' mmHg' : ''].filter(Boolean).join(' · '), trAbn, 'Vmax IT ≥ 2,8 m/s ou PAPS ≥ 35 mmHg');
  var three = [cE, cEE, cTR];
  var avail = three.filter(function(c){ return c.abn !== null; }), nAbn = avail.filter(function(c){ return c.abn; }).length;
  if(cE.abn === null) need(R, 'e′', 'e′ septal et latéral', 'Premier paramètre de l’algorithme (relaxation)');
  if(cEE.abn === null) need(R, 'E', 'Onde E mitrale', 'Nécessaire au rapport E/e′');
  if(cTR.abn === null) need(R, 'trv', 'Vmax IT ou PAPS', 'Plusieurs fenêtres ; sérum salé agité ou contraste si le jet est incomplet');
  if(avail.length < 2){
    step(R, 'm.start', 'Moins de 2 des 3 paramètres principaux disponibles');
    setGrade(R, '?', 'indeterminate'); return;
  }
  if(nAbn === 0){
    step(R, 'm.allnormal', 'e′, E/e′ et Vmax IT normaux');
    if(avail.length < 3) R.notes.push('Conclusion fondée sur 2 des 3 paramètres principaux (' + three.filter(function(c){ return c.abn === null; })[0].label + ' non disponible).');
    setGrade(R, '0', 'normal'); return;
  }
  if(nAbn === 3){
    step(R, 'm.all3', 'Les 3 paramètres principaux sont anormaux');
    step(R, 'm.inclap', 'Pression OG élevée');
    setGrade(R, gradeByEA(R, d), 'elevated'); return;
  }
  if(nAbn === 1 && cE.abn){
    step(R, 'm.eonly', 'e′ réduite isolée');
    if(!ok(d.ea)){ need(R, 'ea', 'Ondes E et A', 'Départage grade 1 (E/A ≤ 0,8) et recherche de pressions élevées'); }
    else if(d.ea <= 0.8){
      step(R, 'm.ea08', 'E/A ' + f(d.ea, 2) + ' ≤ 0,8');
      setGrade(R, '1', 'normal');
      R.notes.push('Si le patient est symptomatique : échographie d’effort diastolique.');
      return;
    } else step(R, 'm.ea08p', 'E/A ' + f(d.ea, 2) + ' > 0,8 : paramètres complémentaires');
  } else step(R, 'm.mixed', nAbn === 2 ? '2 paramètres anormaux sur 3' : (cEE.abn ? 'E/e′ augmenté isolé' : 'Vmax IT / PAPS augmentée isolée'));
  supp25(d, R, cE.abn === true);
}

/* Paramètres complémentaires de la fig. 3 : S/D VP ≤ 0,67, LARS ≤ 18 %, VOGi > 34, ou à défaut TRIV ≤ 70 ms */
function supp25(d, R, eRed){
  var cPV = C(R, 'pvsd', 'Flux veineux pulmonaire S/D', ok(d.pvsd) ? f(d.pvsd, 2) : '', cmp(d.pvsd, '<=', 0.67), '≤ 0,67');
  var cLARS = C(R, 'lars', 'Strain réservoir OG (LARS)', ok(d.lars) ? f(d.lars, 0) + ' %' : '', cmp(d.lars, '<=', 18), '≤ 18 %');
  var cLA = C(R, 'lavi', laName(d, 'Volume OG indexé'), laVal(d), laAbn(d), laThr(d));
  var cIV = C(R, 'ivrt', 'TRIV (alternative)', ok(d.ivrt) ? f(d.ivrt, 0) + ' ms' : '', cmp(d.ivrt, '<=', 70), '≤ 70 ms');
  var sup = [cPV, cLARS, cLA, cIV];
  step(R, 'm.supp', 'Paramètres complémentaires');
  if(cLA.abn && !cLARS.abn && !cPV.abn) R.notes.push('VOGi : exclure une autre cause de dilatation de l’OG (sportif, anémie, FA ou flutter, valvulopathie mitrale).');
  if(anyTrue(sup.map(function(c){ return c.abn; }))){
    step(R, 'm.inclap', 'Au moins 1 critère présent : pression OG élevée');
    setGrade(R, gradeByEA(R, d), 'elevated'); return;
  }
  // S/D > 0,67 n'exclut pas des pressions élevées si la FEVG est normale (texte de la section 11)
  var pvNeg = cPV.abn === false && ok(d.lvef) && d.lvef < 50;
  if(cPV.abn === false && !pvNeg) R.notes.push('S/D veineux pulmonaire > 0,67 à FEVG normale : n’exclut pas des pressions élevées, confirmer par le TRIV.');
  if(cLARS.abn === false || cLA.abn === false || cIV.abn === false || pvNeg){
    step(R, 'm.normlap', 'Aucun critère présent : pression OG normale');
    if(eRed){ setGrade(R, '1', 'normal'); R.notes.push('Si le patient est symptomatique : échographie d’effort diastolique.'); return; }
    // e′ conservée : dysfonction si ≥ 2 marqueurs de la fig. 2 (E/e′ moyen > 14, LARS ≤ 18 %, E/A ≤ 0,8 ou ≥ 2, VOGi > 34)
    var m = [cmp(d.eeavg, '>', 14), cLARS.abn, ok(d.ea) ? (d.ea <= 0.8 || d.ea >= 2) : null, cLA.abn].filter(function(x){ return x === true; }).length;
    if(m >= 2){ step(R, 'm.fig2', 'e′ conservée mais ≥ 2 marqueurs de remodelage (fig. 2)'); setGrade(R, '1', 'normal'); }
    else setGrade(R, '0', 'normal');
    R.notes.push('Pression OG normale au repos : si dyspnée inexpliquée, échographie d’effort diastolique.');
    return;
  }
  // Aucun paramètre complémentaire : méthodes supplémentaires (note † de la fig. 3)
  var S = [cmp(d.prv, '>=', 2), cmp(d.padp, '>=', 16), cmp(d.lwave, '>=', 50), cmp(d.ara, '>', 30), cmp(d.valsalva, '>=', 50)];
  if(anyTrue(S)){
    C(R, 'sup', 'Méthodes supplémentaires', [S[0] ? 'IP télédiastolique ≥ 2 m/s' : '', S[1] ? 'PAPd ≥ 16 mmHg' : '', S[2] ? 'onde L ≥ 50 cm/s' : '', S[3] ? 'Ar–A > 30 ms' : '', S[4] ? 'baisse de E/A ≥ 50 % au Valsalva' : ''].filter(Boolean).join(', '), true, 'au moins une présente');
    step(R, 'm.inclap', 'Méthode supplémentaire positive : pression OG élevée');
    setGrade(R, gradeByEA(R, d), 'elevated'); return;
  }
  need(R, 'lars', 'Strain réservoir OG (LARS)', 'Faisable chez la plupart des patients en coupes apicales');
  need(R, 'lavi', 'Volume OG indexé ou surface OG', 'VOGi biplan en télésystole ; à défaut, surface OG en 4 cavités');
  need(R, 'pvsd', 'Flux veineux pulmonaire S/D', 'Surtout fiable si la FEVG est altérée');
  need(R, 'ivrt', 'TRIV', 'Alternative si les précédents manquent');
  if(allNull(S)) need(R, 'sup', 'Ar–A, Valsalva, onde L, IP télédiastolique', 'Méthodes supplémentaires si rien d’autre n’est fiable');
  setGrade(R, '?', 'indeterminate');
}

/* ---------- ASE/EACVI 2016 : algorithmes A et B ---------- */
function algo16(d, R){
  if(!d.myo) return algoA16(d, R);
  step(R, 'b.start', 'FEVG < 50 % ou cardiopathie myocardique : algorithme B');
  algoB16(d, R);
}
function algoA16(d, R){
  R.algo = 'a16'; R.grp = 'Algorithme A';
  step(R, 'a.start', 'FEVG normale sans cardiopathie myocardique : algorithme A');
  var c = [
    C(R, 'ee', 'E/e′ moyen > 14', ok(d.eeavg) ? f(d.eeavg, 1) : '', cmp(d.eeavg, '>', 14), '> 14'),
    C(R, 'e', 'e′ septal < 7 ou latéral < 10', eTxt(d), ok(d.es) || ok(d.el) ? (cmp(d.es, '<', 7) === true || cmp(d.el, '<', 10) === true) : null, 'septal < 7 ou latéral < 10 cm/s'),
    C(R, 'tr', 'Vmax IT > 2,8 m/s', ok(d.trv) ? f(d.trv, 1) + ' m/s' : '', cmp(d.trv, '>', 2.8), '> 2,8 m/s'),
    C(R, 'lavi', laName(d, 'VOGi > 34 mL/m²'), laVal(d), laAbn(d), laThr(d))
  ];
  var av = c.filter(function(x){ return x.abn !== null; }), pos = av.filter(function(x){ return x.abn; }).length;
  c.forEach(function(x){ if(x.abn === null) need(R, x.k, x.label.replace(/ [<>].*$/, ''), 'Critère de l’algorithme A'); });
  if(!av.length){ setGrade(R, '?', 'indeterminate'); return; }
  if(pos / av.length < 0.5){ step(R, 'a.normal', pos + ' critère(s) positif(s) sur ' + av.length + ' (< 50 %)'); setGrade(R, '0', 'normal'); return; }
  if(pos / av.length > 0.5){ step(R, 'a.dd', pos + ' critères positifs sur ' + av.length + ' (> 50 %) : algorithme B'); algoB16(d, R); R.algo = 'a16'; return; }
  step(R, 'a.indet', pos + ' critères positifs sur ' + av.length + ' (50 %)');
  setGrade(R, '?', 'indeterminate');
}
function algoB16(d, R){
  R.algo = R.algo || 'b16'; R.grp = 'Algorithme B';
  C(R, 'ea', 'E/A', ok(d.ea) ? f(d.ea, 2) + (ok(d.e) ? ' (E ' + f(d.e) + ' cm/s)' : '') : '', ok(d.ea) ? (d.ea >= 2 ? true : d.ea <= 0.8 && d.e <= 50 ? false : null) : null, '≤ 0,8 avec E ≤ 50 cm/s ; ≥ 2');
  if(!ok(d.ea)){ need(R, 'ea', 'Ondes E et A', 'Point d’entrée de l’algorithme B'); step(R, 'b.eaNA', 'E/A non disponible'); setGrade(R, '?', 'indeterminate'); return; }
  if(d.ea <= 0.8 && d.e <= 50){ step(R, 'b.g1', 'E/A ≤ 0,8 et E ≤ 50 cm/s'); setGrade(R, '1', 'normal'); return; }
  if(d.ea >= 2){ step(R, 'b.g3', 'E/A ≥ 2'); setGrade(R, '3', 'elevated'); return; }
  step(R, 'b.mid', d.ea <= 0.8 ? 'E/A ≤ 0,8 avec E > 50 cm/s' : 'E/A entre 0,8 et 2');
  var eeV = ok(d.eeavg) ? d.eeavg : NaN, eeA = ok(d.eeavg) ? d.eeavg > 14 : ok(d.eesep) ? d.eesep > 15 : ok(d.eelat) ? d.eelat > 13 : null;
  var c = [
    C(R, 'ee', 'E/e′ moyen > 14', ok(eeV) ? f(eeV, 1) : eeTxt(d), eeA, '> 14 (septal > 15, latéral > 13 si un seul e′)'),
    C(R, 'tr', 'Vmax IT > 2,8 m/s', ok(d.trv) ? f(d.trv, 1) + ' m/s' : '', cmp(d.trv, '>', 2.8), '> 2,8 m/s'),
    C(R, 'lavi', laName(d, 'VOGi > 34 mL/m²'), laVal(d), laAbn(d), laThr(d))
  ];
  var av = c.filter(function(x){ return x.abn !== null; });
  // FEVG altérée : S/D veineux pulmonaire < 1 peut remplacer un critère manquant
  if(av.length < 3 && ok(d.lvef) && d.lvef < 50 && ok(d.pvsd)){ av.push(C(R, 'pvsd', 'S/D veineux pulmonaire < 1', f(d.pvsd, 2), d.pvsd < 1, '< 1 (FEVG altérée)')); }
  var pos = av.filter(function(x){ return x.abn; }).length, neg = av.length - pos;
  c.forEach(function(x){ if(x.abn === null) need(R, x.k, x.label.replace(/ [<>].*$/, ''), 'Critère de l’algorithme B'); });
  if(av.length >= 3){
    if(pos >= 2){ step(R, 'b.g2', pos + ' critères positifs sur ' + av.length); setGrade(R, '2', 'elevated'); }
    else { step(R, 'b.g1b', neg + ' critères négatifs sur ' + av.length); setGrade(R, '1', 'normal'); }
    return;
  }
  if(av.length === 2){
    if(pos === 2){ step(R, 'b.g2', '2 critères positifs sur 2'); setGrade(R, '2', 'elevated'); return; }
    if(pos === 0){ step(R, 'b.g1b', '2 critères négatifs sur 2'); setGrade(R, '1', 'normal'); return; }
    step(R, 'b.indet', '1 critère positif et 1 négatif');
  } else step(R, 'b.indet', 'Moins de 2 critères disponibles');
  setGrade(R, '?', 'indeterminate');
}

/* ---------- Populations particulières (ASE 2025) ---------- */
function af25(d, R){
  R.algo = 'af25';
  var c = [
    C(R, 'e', 'Onde E ≥ 100 cm/s', ok(d.e) ? f(d.e) + ' cm/s' : '', cmp(d.e, '>=', 100), '≥ 100 cm/s'),
    C(R, 'eesep', 'E/e′ septal > 11', ok(d.eesep) ? f(d.eesep, 1) : '', cmp(d.eesep, '>', 11), '> 11'),
    C(R, 'tr', 'Vmax IT > 2,8 m/s ou PAPS > 35 mmHg', [ok(d.trv) ? f(d.trv, 1) + ' m/s' : '', ok(d.pasp) ? 'PAPS ' + f(d.pasp) : ''].filter(Boolean).join(' · '), ok(d.trv) || ok(d.pasp) ? anyTrue([cmp(d.trv, '>', 2.8), cmp(d.pasp, '>', 35)]) : null, '> 2,8 m/s ou > 35 mmHg'),
    C(R, 'dt', 'TDE ≤ 160 ms', ok(d.dt) ? f(d.dt) + ' ms' : '', cmp(d.dt, '<=', 160), '≤ 160 ms')
  ];
  var pos = c.filter(function(x){ return x.abn === true; }).length, miss = c.filter(function(x){ return x.abn === null; });
  miss.forEach(function(x){ need(R, x.k, x.label.replace(/ [<>≤≥].*$/, ''), 'Moyenne de plusieurs cycles représentatifs de la fréquence'); });
  R.notes.push('En FA : moyenner plusieurs cycles représentatifs de la fréquence cardiaque moyenne.');
  if(pos >= 3){ step(R, 'af.3', pos + ' critères sur 4'); setLap(R, 'elevated'); return; }
  if(pos + miss.length <= 1){ step(R, 'af.01', pos + ' critère sur 4'); setLap(R, 'normal'); return; }
  if(pos === 2){
    step(R, 'af.2', '2 critères sur 4 : critères complémentaires');
    var s = [
      C(R, 'lars', 'LARS < 18 %', ok(d.lars) ? f(d.lars) + ' %' : '', cmp(d.lars, '<', 18), '< 18 %'),
      C(R, 'pvsd', 'S/D veineux pulmonaire < 1', ok(d.pvsd) ? f(d.pvsd, 2) : '', cmp(d.pvsd, '<', 1), '< 1'),
      C(R, 'bmi', 'IMC > 30 kg/m²', ok(d.bmi) ? f(d.bmi, 1) : '', cmp(d.bmi, '>', 30), '> 30 kg/m²')
    ];
    var sp = s.filter(function(x){ return x.abn === true; }).length, sm = s.filter(function(x){ return x.abn === null; });
    if(sp >= 2){ step(R, 'af.s23', sp + ' critères complémentaires sur 3'); setLap(R, 'elevated'); return; }
    if(sp === 0 && sm.length <= 1){ step(R, 'af.s0', 'Aucun critère complémentaire'); setLap(R, 'normal'); return; }
    sm.forEach(function(x){ need(R, x.k, x.label.replace(/ [<>].*$/, ''), 'Critère complémentaire en FA'); });
    step(R, 'af.s1', sp === 1 ? '1 seul critère complémentaire' : 'Critères complémentaires non disponibles');
    setLap(R, 'indeterminate'); return;
  }
  step(R, 'af.miss', 'Données insuffisantes'); setLap(R, 'indeterminate');
}
function mac25(d, R){
  R.algo = 'mac25';
  C(R, 'ea', 'E/A', ok(d.ea) ? f(d.ea, 2) : '', ok(d.ea) ? (d.ea > 1.8 ? true : d.ea < 0.8 ? false : null) : null, '< 0,8 normal ; > 1,8 élevé');
  if(!ok(d.ea)){ need(R, 'ea', 'Ondes E et A', 'Point d’entrée de l’algorithme MAC'); setLap(R, 'indeterminate'); return; }
  if(d.ea < 0.8){ step(R, 'mac.lo', 'E/A < 0,8'); setLap(R, 'normal'); return; }
  if(d.ea > 1.8){ step(R, 'mac.hi', 'E/A > 1,8'); setLap(R, 'elevated'); return; }
  step(R, 'mac.mid', 'E/A entre 0,8 et 1,8 : TRIV');
  C(R, 'ivrt', 'TRIV < 80 ms', ok(d.ivrt) ? f(d.ivrt) + ' ms' : '', cmp(d.ivrt, '<', 80), '< 80 ms');
  if(!ok(d.ivrt)){ need(R, 'ivrt', 'TRIV', 'Départage les E/A entre 0,8 et 1,8'); setLap(R, 'indeterminate'); return; }
  if(d.ivrt >= 80){ step(R, 'mac.ivl', 'TRIV ≥ 80 ms'); setLap(R, 'normal'); }
  else { step(R, 'mac.ivs', 'TRIV < 80 ms'); setLap(R, 'elevated'); }
}
function ph25(d, R){
  R.algo = 'ph25';
  R.notes.push('HTP : utiliser le E/e′ latéral (septum souvent aplati).');
  C(R, 'ea', 'E/A', ok(d.ea) ? f(d.ea, 2) + (ok(d.e) ? ' (E ' + f(d.e) + ' cm/s)' : '') : '', null, '≤ 0,8 avec E ≤ 50 ; ≥ 2 avec e′ réduite');
  if(!ok(d.ea)){ need(R, 'ea', 'Ondes E et A', 'Point d’entrée de l’algorithme HTP'); setLap(R, 'indeterminate'); return; }
  if(d.ea <= 0.8 && d.e <= 50){ step(R, 'ph.lo', 'E/A ≤ 0,8 et E ≤ 50 cm/s'); setLap(R, 'normal'); return; }
  var er = eReduced(d);
  if(d.ea >= 2 && er){ step(R, 'ph.hi', 'E/A ≥ 2 et e′ réduite'); setLap(R, 'elevated'); return; }
  if(d.ea >= 2 && er === null) need(R, 'e′', 'e′ septal et latéral', 'E/A ≥ 2 : conclut si e′ est réduite');
  step(R, 'ph.mid', d.ea >= 2 ? 'E/A ≥ 2 sans e′ réduite démontrée : LARS' : 'E/A intermédiaire : LARS');
  if(ok(d.lars)){
    C(R, 'lars', 'LARS ≤ 18 %', f(d.lars) + ' %', d.lars <= 18, '≤ 18 %');
    if(d.lars > 18){ step(R, 'ph.lars+', 'LARS > 18 %'); setLap(R, 'normal'); }
    else { step(R, 'ph.lars-', 'LARS ≤ 18 %'); setLap(R, 'elevated'); }
    return;
  }
  step(R, 'ph.nolars', 'LARS non disponible : E/e′ latéral');
  C(R, 'eelat', 'E/e′ latéral', ok(d.eelat) ? f(d.eelat, 1) : '', ok(d.eelat) ? (d.eelat > 13 ? true : d.eelat < 8 ? false : null) : null, '< 8 normal ; > 13 élevé');
  if(!ok(d.eelat)){ need(R, 'lars', 'LARS ou E/e′ latéral', 'Nécessaire si E/A est intermédiaire'); setLap(R, 'indeterminate'); return; }
  if(d.eelat < 8){ step(R, 'ph.ee8', 'E/e′ latéral < 8'); setLap(R, 'normal'); return; }
  if(d.eelat > 13){ step(R, 'ph.ee13', 'E/e′ latéral > 13'); setLap(R, 'elevated'); return; }
  step(R, 'ph.eemid', 'E/e′ latéral entre 8 et 13'); need(R, 'lars', 'LARS', 'E/e′ latéral entre 8 et 13 : non concluant');
  setLap(R, 'indeterminate');
}
function htx25(d, R){
  R.algo = 'htx25';
  C(R, 'ee', 'E/e′ moyen', ok(d.eeavg) ? f(d.eeavg, 1) : '', ok(d.eeavg) ? (d.eeavg > 14 ? true : d.eeavg < 7 ? false : null) : null, '< 7 normal ; > 14 élevé');
  if(!ok(d.eeavg)){ need(R, 'e′', 'E, e′ septal et latéral', 'E/e′ moyen'); setLap(R, 'indeterminate'); return; }
  if(d.eeavg < 7){ step(R, 'htx.lo', 'E/e′ moyen < 7'); setLap(R, 'normal'); return; }
  if(d.eeavg > 14){ step(R, 'htx.hi', 'E/e′ moyen > 14'); setLap(R, 'elevated'); return; }
  step(R, 'htx.mid', 'E/e′ moyen entre 7 et 14');
  if(ok(d.esr)){
    C(R, 'esr', 'E / SRIVR', f(d.esr) + ' cm', d.esr > 200, '> 200 cm');
    step(R, d.esr > 200 ? 'htx.sr+' : 'htx.sr-', 'E/SRIVR ' + (d.esr > 200 ? '> 200 cm' : '≤ 200 cm'));
    setLap(R, d.esr > 200 ? 'elevated' : 'normal'); return;
  }
  if(ok(d.trv)){
    C(R, 'tr', 'Vmax IT', f(d.trv, 1) + ' m/s', d.trv > 2.8, '> 2,8 m/s');
    step(R, d.trv > 2.8 ? 'htx.tr+' : 'htx.tr-', 'SRIVR non disponible : Vmax IT ' + (d.trv > 2.8 ? '> 2,8' : '≤ 2,8') + ' m/s');
    setLap(R, d.trv > 2.8 ? 'elevated' : 'normal'); return;
  }
  need(R, 'srivr', 'SRIVR (strain rate de relaxation isovolumique) ou Vmax IT', 'E/e′ entre 7 et 14');
  setLap(R, 'indeterminate');
}
// Valvulopathies mitrales et CMH : indicateurs du tableau 7, sans algorithme validé — synthèse à la majorité
function indicators(d, R, list, label){
  R.algo = 'ind25';
  list.forEach(function(x){ C(R, x[0], x[1], x[2], x[3], x[4]); if(x[3] === null) need(R, x[0], x[1].replace(/ [<>≤≥(].*$/, ''), 'Indicateur du tableau 7'); });
  var av = R.crit.filter(function(c){ return c.abn !== null; }), pos = av.filter(function(c){ return c.abn; }).length;
  R.notes.push(label + ' : pas d’algorithme validé ; synthèse indicative à partir des indicateurs du tableau 7, à interpréter dans le contexte.');
  if(av.length < 2){ step(R, 'ind.na', 'Moins de 2 indicateurs disponibles'); setLap(R, 'indeterminate'); return; }
  if(pos > av.length / 2){ step(R, 'ind.pos', pos + ' indicateur(s) sur ' + av.length + ' en faveur de pressions élevées'); setLap(R, 'elevated'); return; }
  if(pos < av.length / 2){ step(R, 'ind.neg', pos + ' indicateur(s) sur ' + av.length); setLap(R, 'normal'); return; }
  step(R, 'ind.eq', pos + ' indicateur(s) sur ' + av.length + ' (50 %)'); setLap(R, 'indeterminate');
}
function special(d, R, pop){
  if(pop === 'af') return af25(d, R);
  if(pop === 'mac') return mac25(d, R);
  if(pop === 'ph') return ph25(d, R);
  if(pop === 'htx') return htx25(d, R);
  if(pop === 'ms') return indicators(d, R, [
    ['ivrt', 'TRIV < 60 ms', ok(d.ivrt) ? f(d.ivrt) + ' ms' : '', cmp(d.ivrt, '<', 60), '< 60 ms'],
    ['a', 'Onde A > 1,5 m/s', ok(d.a) ? f(d.a / 100, 2) + ' m/s' : '', cmp(d.a, '>', 150), '> 1,5 m/s'],
    ['tee', 'TRIV / TE-e′ < 4,2', ok(d.ivrtTee) ? f(d.ivrtTee, 1) : '', cmp(d.ivrtTee, '<', 4.2), '< 4,2']], 'Rétrécissement mitral');
  if(pop === 'mr'){
    var L = [
      ['ivrt', 'TRIV < 60 ms', ok(d.ivrt) ? f(d.ivrt) + ' ms' : '', cmp(d.ivrt, '<', 60), '< 60 ms'],
      ['ara', 'Ar–A ≥ 30 ms', ok(d.ara) ? f(d.ara) + ' ms' : '', cmp(d.ara, '>=', 30), '≥ 30 ms'],
      ['tee', 'TRIV / TE-e′ < 5,6', ok(d.ivrtTee) ? f(d.ivrtTee, 1) : '', cmp(d.ivrtTee, '<', 5.6), '< 5,6']];
    if(ok(d.lvef) && d.lvef < 50) L.push(['ee', 'E/e′ moyen > 14 (FEVG altérée)', ok(d.eeavg) ? f(d.eeavg, 1) : '', cmp(d.eeavg, '>', 14), '> 14']);
    return indicators(d, R, L, 'Insuffisance mitrale');
  }
  if(pop === 'hcm') return indicators(d, R, [
    ['ee', 'E/e′ moyen > 14', ok(d.eeavg) ? f(d.eeavg, 1) : '', cmp(d.eeavg, '>', 14), '> 14'],
    ['ara', 'Ar–A ≥ 30 ms', ok(d.ara) ? f(d.ara) + ' ms' : '', cmp(d.ara, '>=', 30), '≥ 30 ms'],
    ['tr', 'Vmax IT > 2,8 m/s', ok(d.trv) ? f(d.trv, 1) + ' m/s' : '', cmp(d.trv, '>', 2.8), '> 2,8 m/s'],
    ['lavi', laName(d, 'VOGi > 34 mL/m²'), laVal(d), laAbn(d), laThr(d)]], 'Cardiomyopathie hypertrophique');
  // Réparation / prothèse mitrale / TEER, constriction, assistance : algorithme non applicable
  R.algo = 'na';
  step(R, 'na', 'Algorithme principal non applicable');
  R.title = 'Algorithme non applicable'; R.lvl = 'abn'; R.lap = null;
  R.notes.push(pop === 'mvs' ? 'Après réparation, remplacement mitral ou TEER : l’évaluation repose sur les intervalles de temps et les pressions pulmonaires (Vmax IT / PAPS), à interpréter au cas par cas.' : 'Constriction péricardique ou assistance ventriculaire : évaluation spécialisée, hors du champ de cet outil.');
}

/* ---------- Phrase de compte rendu ---------- */
function sentence(d, R){
  var p = [];
  if(ok(d.ea)) p.push('E/A ' + f(d.ea, 2));
  if(ok(d.es) || ok(d.el)) p.push('e′ ' + eTxt(d));
  if(ok(d.eeavg)) p.push('E/e′ moyen ' + f(d.eeavg, 1)); else if(ok(d.eesep)) p.push('E/e′ septal ' + f(d.eesep, 1)); else if(ok(d.eelat)) p.push('E/e′ latéral ' + f(d.eelat, 1));
  if(ok(d.trv)) p.push('Vmax IT ' + f(d.trv, 1) + ' m/s');
  if(ok(d.lavi)) p.push('VOGi ' + f(d.lavi) + ' mL/m²'); else if(ok(d.laa)) p.push('surface OG ' + f(d.laa) + ' cm²');
  if(ok(d.lars)) p.push('LARS ' + f(d.lars) + ' %');
  if(ok(d.pvsd)) p.push('S/D VP ' + f(d.pvsd, 2));
  if(ok(d.ivrt)) p.push('TRIV ' + f(d.ivrt) + ' ms');
  var g = R.guideline === '2016' && R.pop === 'std' ? 'ASE/EACVI 2016' : 'ASE 2025';
  var ctx = R.pop !== 'std' ? ' (' + R.popLabel.charAt(0).toLowerCase() + R.popLabel.slice(1) + ')' : '';
  return R.title + (R.lapTxt ? ', ' + R.lapTxt : '') + ctx + ', selon les recommandations ' + g + '.' + (p.length ? ' ' + p.join(', ') + '.' : '');
}

function diastolic(inp, opt){
  inp = inp || {}; opt = opt || {};
  var g = opt.guideline === '2016' ? '2016' : '2025';
  var pop = inp.rhythm === 'af' ? 'af' : POPS[inp.pop] ? inp.pop : 'std';
  var d = derive(inp), R = Res(g, pop);
  if(pop !== 'std'){
    special(d, R, pop);
    if(g === '2016') R.notes.unshift('Population particulière : algorithme spécifique ASE 2025 appliqué (pas d’algorithme formel en 2016).');
  }
  else if(g === '2016') algo16(d, R);
  else main25(d, R);
  if(R.algo !== 'na') R.sentence = sentence(d, R);
  R.derived = {ea:d.ea, eavg:d.eavg, eeavg:d.eeavg, eesep:d.eesep, eelat:d.eelat, myo:d.myo};

}

root.CS = root.CS || {};
root.CS.diastolic = diastolic;
root.CS.diastolic.POPS = POPS;
root.CS.diastolic.REFS = {r2016:REF16, r2025:REF25};
})(typeof window !== 'undefined' ? window : globalThis);

<script>
(function(){

  lvedd:{M:[42,58.4], F:[37.8,52.2]}, lvesd:{M:[25,39.8], F:[21.6,34.8]}, ivs:{M:[6,10], F:[6,9]}, pw:{M:[6,10], F:[6,9]},
  lvef:{M:[52,72], F:[54,74]}, edvi:{M:[34,74], F:[29,61]}, esvi:{M:[11,31], F:[8,24]}, lvmi:{M:[49,115], F:[43,95]},

   {id:'hr', l:'Fréquence', u:'bpm'}, {id:'rhythm', l:'Rythme', t:'sel', o:[['sr','Sinusal'],['af','Fibrillation atriale']]},
   {id:'ind', l:'Indication', t:'txt', wide:true}]},
 {sec:'Ventricule gauche', items:[
   {id:'lvedd', l:'DTDVG', u:'mm', n:'lvedd'}, {id:'lvesd', l:'DTSVG', u:'mm', n:'lvesd'}, {id:'ivs', l:'SIV (diastole)', u:'mm', n:'ivs'}, {id:'pw', l:'Paroi postérieure', u:'mm', n:'pw'},
   {id:'edv', l:'VTD (biplan)', u:'mL'}, {id:'esv', l:'VTS (biplan)', u:'mL'}, {id:'lvef', l:'FEVG (biplan)', u:'%', n:'lvef', dir:'min'}, {id:'gls', l:'SLG', u:'%', hint:'Valeur absolue'},

 {sec:'Fonction diastolique et oreillette gauche', items:[

   {id:'ivc', l:'VCI', u:'mm', lim:[21,'max']}, {id:'ivcc', l:'Collapsus VCI > 50 %', t:'sel', o:[['y','Oui'],['n','Non']]}]},

   {id:'avmax', l:'RA : Vmax', u:'m/s'}, {id:'avmg', l:'RA : gradient moyen', u:'mmHg'}, {id:'ava', l:'RA : surface', u:'cm²'},

   {id:'arvc', l:'IA : vena contracta', u:'mm'}, {id:'arpht', l:'IA : PHT', u:'ms'}, {id:'mva', l:'RM : surface', u:'cm²'}, {id:'mvmg', l:'RM : gradient moyen', u:'mmHg'}]},
 {sec:'Aorte et péricarde', items:[
   {id:'root', l:'Sinus de Valsalva', u:'mm', n:'root', dir:'max'}, {id:'asc', l:'Aorte ascendante', u:'mm', n:'asc', dir:'max'},
   {id:'peri', l:'Péricarde', t:'sel', o:[['0','Sec'],['1','Épanchement minime'],['2','Épanchement modéré'],['3','Épanchement abondant']]}]}
];
var EX = {sex:'F', age:72, ht:160, wt:70, hr:72, rhythm:'sr', ind:'Souffle systolique, dyspnée d’effort NYHA II, HTA', lvedd:47, lvesd:30, ivs:12.5, pw:11.5, edv:95, esv:38, lvef:60, gls:16.5, wm:'n',
  e:95, a:70, es:5.5, el:7.5, trv:3.0, lav:68, tapse:21, sprime:11, rvb:36, ivc:18, ivcc:'y', avmax:4.3, avmg:46, ava:0.8, mreroa:0.1, mrrvol:14, mrvc:2.5, mrtype:'p', arvc:'', arpht:'', mva:'', mvmg:'', root:33, asc:35, peri:'0'};
var v = CS.store.get('echo.vals', null) || Object.assign({}, EX);
var guide = CS.store.get('dia.guideline', '2025');

function n(id){ return CS.num(v[id]); }
function bsa(){ return n('ht') > 0 && n('wt') > 0 ? Math.sqrt(n('ht') * n('wt') / 3600) : NaN; }
function flagOf(it){
  var x = n(it.id); if(isNaN(x)) return null;
  if(it.n){ var r = N[it.n][v.sex]; var dir = it.dir || 'range';
    if(dir === 'min') return x < r[0] ? {lvl:x < 30 ? 'sev' : x < 41 ? 'sev' : 'abn', txt:'< ' + r[0]} : {lvl:'ok', txt:'≥ ' + r[0]};
    if(dir === 'max') return x > r[1] ? {lvl:x > r[1] + 8 ? 'sev' : 'abn', txt:'> ' + r[1]} : {lvl:'ok', txt:'≤ ' + r[1]};
    if(x > r[1]) return {lvl:x > r[1] * 1.15 ? 'sev' : 'abn', txt:'N ' + fmt(r[0], 0) + '–' + fmt(r[1], 0)};
    if(x < r[0] && it.id !== 'lvedd' && it.id !== 'lvesd') return {lvl:'abn', txt:'N ' + fmt(r[0], 0) + '–' + fmt(r[1], 0)};
    return {lvl:'ok', txt:'N ' + fmt(r[0], 0) + '–' + fmt(r[1], 0)};
  }
  if(it.lim){ var t = it.lim[0]; if(it.lim[1] === 'min') return x < t ? {lvl:'abn', txt:'< ' + fmt(t, t % 1 ? 1 : 0)} : {lvl:'ok', txt:'≥ ' + fmt(t, t % 1 ? 1 : 0)}; return x > t ? {lvl:'abn', txt:'> ' + fmt(t, t % 1 ? 1 : 0)} : {lvl:'ok', txt:'≤ ' + fmt(t, t % 1 ? 1 : 0)}; }
  if(it.id === 'gls') return x < 16 ? {lvl:'abn', txt:'< 16 %'} : x < 18 ? {lvl:'abn', txt:'limite'} : {lvl:'ok', txt:'≥ 18 %'};
  return null;
}

function guideSeg(){
  var g = h('div', {class:'seg', role:'group', 'aria-label':'Recommandation pour la fonction diastolique'}, h('button', {'data-v':'2025', text:'Diastole ASE 2025'}), h('button', {'data-v':'2016', text:'ASE/EACVI 2016'}));
  CS.seg(g, guide, function(x){ guide = x; CS.store.set('dia.guideline', x); update(); });
  return g;
}
function buildForm(){
  var box = CS.$('#form'); box.innerHTML = '';
  box.appendChild(h('div', {class:'row between'}, h('div', {class:'row'}, h('span', {class:'badge info', text:'Exemple pré-rempli'}), h('span', {class:'small muted', text:'Normes ASE/EACVI selon le sexe'}), guideSeg()),
    h('div', {class:'row'}, h('button', {class:'btn sm', type:'button', text:'Recharger l’exemple', onclick:function(){ v = Object.assign({}, EX); buildForm(); update(); }}),
      h('button', {class:'btn sm', type:'button', text:'Tout effacer', onclick:function(){ var s = v.sex; v = {sex:s, rhythm:'sr', wm:'n', ivcc:'y', mrtype:'p', peri:'0'}; buildForm(); update(); }}))));
  F.forEach(function(sec){
    var grid = h('div', {class:'mf'});
    sec.items.forEach(function(it){
      var input;
      if(it.t === 'sel'){ input = h('select', {class:'inp', id:'f-' + it.id}, it.o.map(function(o){ return h('option', {value:o[0], text:o[1], selected:String(v[it.id]) === o[0]}); })); }
      else if(it.t === 'txt'){ input = h('input', {class:'inp', id:'f-' + it.id, value:v[it.id] || ''}); }
      else input = h('div', {class:'inp-unit'}, h('input', {class:'inp num', id:'f-' + it.id, inputmode:'decimal', value:v[it.id] == null ? '' : v[it.id]}), h('span', {class:'u', text:it.u}));
      var m = h('div', {class:'m', id:'m-' + it.id, style:it.wide ? {gridColumn:'1/-1'} : null}, h('label', {for:'f-' + it.id, text:it.l}), input, h('div', {class:'fl', id:'fl-' + it.id}));
      grid.appendChild(m);
    });
    box.appendChild(h('div', {class:'card sec'}, h('h3', {text:sec.sec}), grid));
  });
  CS.$$('#form input, #form select').forEach(function(el){ el.addEventListener('input', function(){ v[el.id.slice(2)] = el.value; update(); }); });
}
function paintFlags(){
  F.forEach(function(sec){ sec.items.forEach(function(it){
    var m = CS.$('#m-' + it.id), fl = CS.$('#fl-' + it.id); if(!m || it.t) return;
    var f = flagOf(it); m.classList.remove('abn', 'sev');
    if(!f){ fl.innerHTML = it.hint ? CS.esc(it.hint) : ''; return; }
    if(f.lvl !== 'ok') m.classList.add(f.lvl);
    fl.innerHTML = '<span class="badge ' + (f.lvl === 'ok' ? 'ok' : f.lvl === 'sev' ? 'crit' : 'warn') + '">' + (f.lvl === 'ok' ? 'Normal' : 'Anormal') + '</span>' + CS.esc(f.txt);
  }); });
}

/* ---------- Calculs ---------- */
function calc(){
  var r = {}, sc = bsa(); r.bsa = sc;
  var d = n('lvedd') / 10, s = n('ivs') / 10, p = n('pw') / 10;
  r.mass = d > 0 && s > 0 && p > 0 ? 0.8 * 1.04 * (Math.pow(d + s + p, 3) - Math.pow(d, 3)) + 0.6 : NaN;
  r.lvmi = r.mass / sc; r.rwt = 2 * n('pw') / n('lvedd');
  r.edvi = n('edv') / sc; r.esvi = n('esv') / sc; r.lavi = n('lav') / sc;
  r.ea = n('e') / n('a'); r.eeavg = n('e') / ((n('es') + n('el')) / 2); r.eesep = n('e') / n('es');
  var lvmN = N.lvmi[v.sex][1], hyp = r.lvmi > lvmN;
  r.geom = isNaN(r.lvmi) || isNaN(r.rwt) ? '' : hyp ? (r.rwt > 0.42 ? 'Hypertrophie concentrique' : 'Hypertrophie excentrique') : (r.rwt > 0.42 ? 'Remodelage concentrique' : 'Géométrie normale');
  r.rap = isNaN(n('ivc')) ? NaN : (n('ivc') <= 21 && v.ivcc === 'y') ? 3 : (n('ivc') > 21 && v.ivcc === 'n') ? 15 : 8;
  r.pasp = n('trv') > 0 ? 4 * n('trv') * n('trv') + (isNaN(r.rap) ? 5 : r.rap) : NaN;
  r.php = isNaN(n('trv')) ? '' : n('trv') <= 2.8 ? 'faible' : n('trv') <= 3.4 ? 'intermédiaire' : 'élevée';
  var lvef = n('lvef'), myoDis = lvef < 50 || hyp || n('ivs') > N.ivs[v.sex][1] || v.wm !== 'n';
  // Valves
  r.as = aortic(lvef); r.mr = mitralR(); r.ar = aorticR(); r.ms = mitralS();
  // Fonction diastolique : moteur partagé (_diastolic.js)

  var ef = N.lvef[v.sex][0];
  r.efTxt = isNaN(lvef) ? '' : lvef >= ef ? 'conservée' : lvef >= 41 ? 'légèrement altérée' : lvef >= 30 ? 'modérément altérée' : 'sévèrement altérée';
  return r;
}
function diastolic(r, lvef, myoDis){
  var pop = r.ms.sev ? 'ms' : r.mr.sev === 'sévère' && v.mrtype === 'p' ? 'mr' : 'std';
  var R = CS.diastolic({rhythm:v.rhythm, pop:pop, age:v.age, lvef:lvef, myo:myoDis, e:v.e, a:v.a, es:v.es, el:v.el, trv:v.trv, pasp:isNaN(r.rap) ? NaN : r.pasp, lavi:r.lavi, lars:v.lars}, {guideline:guide});
  if(R.algo === 'na' || (!R.crit.some(function(c){ return c.abn !== null; }) && R.lap === 'indeterminate')) return {grade:'', txt:'', lvl:'ok'};
  return {grade:R.grade || (R.lap === 'normal' ? '0' : 'x'), lvl:R.lvl, R:R,
    txt:R.title + (R.lapTxt ? ', ' + R.lapTxt : '') + (pop !== 'std' || v.rhythm === 'af' ? ' (' + R.popLabel.toLowerCase() + ')' : '') + ' – ' + (guide === '2016' && R.pop === 'std' ? 'ASE/EACVI 2016' : 'ASE 2025')};
}
function worst(arr){ var o = ['', 'léger', 'modéré', 'sévère']; return arr.reduce(function(a, b){ return o.indexOf(b) > o.indexOf(a) ? b : a; }, ''); }
function aortic(lvef){
  var vm = n('avmax'), mg = n('avmg'), a = n('ava'), g = [];
  if(!isNaN(vm)) g.push(vm >= 4 ? 'sévère' : vm >= 3 ? 'modéré' : vm >= 2.6 ? 'léger' : '');
  if(!isNaN(mg)) g.push(mg >= 40 ? 'sévère' : mg >= 20 ? 'modéré' : mg > 0 ? 'léger' : '');
  if(!isNaN(a)) g.push(a < 1 ? 'sévère' : a <= 1.5 ? 'modéré' : 'léger');
  var s = worst(g), note = '';
  if(a < 1 && mg < 40 && vm < 4){ note = lvef < 50 ? 'RA bas débit bas gradient classique : écho dobutamine' : 'RA bas gradient à FEVG préservée : vérifier le VES indexé, score calcique au scanner'; }
  return {sev:s, txt:s ? 'Rétrécissement aortique ' + s + ' (' + [!isNaN(vm) ? 'Vmax ' + fmt(vm, 1) + ' m/s' : '', !isNaN(mg) ? 'Gmoy ' + fmt(mg) + ' mmHg' : '', !isNaN(a) ? 'SVA ' + fmt(a, 2) + ' cm²' : ''].filter(Boolean).join(', ') + ')' : '', note:note};
}
function mitralR(){
  var e = n('mreroa'), r = n('mrrvol'), vc = n('mrvc'), g = [];
  if(!isNaN(e)) g.push(e >= 0.4 ? 'sévère' : e >= 0.2 ? 'modéré' : 'léger');
  if(!isNaN(r)) g.push(r >= 60 ? 'sévère' : r >= 30 ? 'modéré' : 'léger');
  if(!isNaN(vc)) g.push(vc >= 7 ? 'sévère' : vc >= 3 ? 'modéré' : 'léger');
  var s = worst(g); if(!s) return {sev:''};
  var label = s === 'léger' ? 'minime à légère' : s === 'modéré' ? 'modérée' : 'sévère';
  return {sev:s, txt:'Insuffisance mitrale ' + (v.mrtype === 's' ? 'secondaire ' : 'primaire ') + label + ' (' + [!isNaN(e) ? 'SOR ' + fmt(e, 2) + ' cm²' : '', !isNaN(r) ? 'VR ' + fmt(r) + ' mL' : '', !isNaN(vc) ? 'VC ' + fmt(vc, 1) + ' mm' : ''].filter(Boolean).join(', ') + ')'};
}
function aorticR(){
  var vc = n('arvc'), p = n('arpht'), g = [];
  if(!isNaN(vc)) g.push(vc > 6 ? 'sévère' : vc >= 3 ? 'modéré' : 'léger');
  if(!isNaN(p)) g.push(p < 200 ? 'sévère' : p <= 500 ? 'modéré' : 'léger');
  var s = worst(g); if(!s) return {sev:''};
  return {sev:s, txt:'Insuffisance aortique ' + (s === 'léger' ? 'légère' : s === 'modéré' ? 'modérée' : 'sévère')};
}
function mitralS(){
  var a = n('mva'), mg = n('mvmg'); if(isNaN(a)) return {sev:''};
  var s = a < 1 ? 'sévère' : a <= 1.5 ? 'modéré' : 'léger';
  return {sev:s, txt:'Rétrécissement mitral ' + (a < 1 ? 'très serré' : a <= 1.5 ? 'serré' : 'peu serré') + ' (surface ' + fmt(a, 2) + ' cm²' + (isNaN(mg) ? '' : ', Gmoy ' + fmt(mg) + ' mmHg') + ')'};
}

/* ---------- Valeurs dérivées + compte rendu ---------- */
function update(){
  CS.store.set('echo.vals', v); paintFlags();
  CS.$$('.seg[aria-label^="Recommandation"] button').forEach(function(b){ b.setAttribute('aria-pressed', b.dataset.v === guide ? 'true' : 'false'); });
  var r = calc(), sexN = v.sex;
  function dv(label, val, d, unit, lvl){ return '<div class="dv ' + (lvl || '') + '"><span>' + label + '</span><b>' + (isNaN(val) || val == null ? '–' : fmt(val, d) + (unit ? ' ' + unit : '')) + '</b></div>'; }
  var lvmN = N.lvmi[sexN][1];
  CS.$('#derived').innerHTML =
    dv('Surface corporelle (Mosteller)', r.bsa, 2, 'm²') + dv('Masse VG (Devereux)', r.mass, 0, 'g') +
    dv('Masse VG indexée', r.lvmi, 0, 'g/m²', r.lvmi > lvmN ? 'abn' : '') + dv('Épaisseur pariétale relative', r.rwt, 2, '', r.rwt > 0.42 ? 'abn' : '') +
    dv('VTD indexé', r.edvi, 0, 'mL/m²', r.edvi > N.edvi[sexN][1] ? 'abn' : '') + dv('VOG indexé', r.lavi, 0, 'mL/m²', r.lavi > 48 ? 'sev' : r.lavi > 34 ? 'abn' : '') +
    dv('E/A', r.ea, 2) + dv('E/e′ moyen', r.eeavg, 1, '', r.eeavg > 14 ? 'abn' : '') +
    dv('PAPs estimée', r.pasp, 0, 'mmHg', r.pasp > 35 ? 'abn' : '') + dv('POD estimée', r.rap, 0, 'mmHg') +
    '<div class="dv ' + (r.dia.lvl === 'ok' ? '' : r.dia.lvl) + '" style="grid-column:1/-1"><span>Fonction diastolique</span><b>' + CS.esc(r.dia.txt || '–') + '</b></div>' +
    (r.geom ? '<div class="dv ' + (/Hyper/.test(r.geom) ? 'abn' : '') + '" style="grid-column:1/-1"><span>Géométrie VG</span><b>' + r.geom + '</b></div>' : '');
  CS.$('#report').innerHTML = CS.esc(report(r)).replace(/^(ÉCHOCARDIOGRAPHIE TRANSTHORACIQUE|CONCLUSION)$/gm, '<span class="rh">$1</span>');
}
function report(r){
  var L = [], sexW = v.sex === 'F', P = function(x, d){ return fmt(n(x), d || 0); };
  L.push('ÉCHOCARDIOGRAPHIE TRANSTHORACIQUE');
  L.push(CS.frDateLong() + ' · ' + CS.doctorLabel() + ', cardiologue');
  L.push((sexW ? 'Patiente' : 'Patient') + (n('age') ? ' de ' + P('age') + ' ans' : '') + (r.bsa ? ' · SC ' + fmt(r.bsa, 2) + ' m²' : '') + (n('hr') ? ' · FC ' + P('hr') + '/min' : '') + ' · ' + (v.rhythm === 'af' ? 'fibrillation atriale' : 'rythme sinusal') + '.');
  if(v.ind) L.push('Indication : ' + v.ind + '.');
  L.push('');
  var lvDil = n('lvedd') > N.lvedd[v.sex][1];
  var wm = {n:'cinétique segmentaire normale', hs:'hypokinésie segmentaire', as:'akinésie segmentaire', hg:'hypokinésie globale'}[v.wm || 'n'];
  L.push('Ventricule gauche : ' + (isNaN(n('lvedd')) ? '' : (lvDil ? 'dilaté' : 'non dilaté') + ' (DTDVG ' + P('lvedd') + ' mm). ') +
    (r.geom ? r.geom + ' (SIV ' + P('ivs', 1) + ' mm, PP ' + P('pw', 1) + ' mm, MVGi ' + fmt(r.lvmi) + ' g/m², EPR ' + fmt(r.rwt, 2) + '). ' : '') +
    (isNaN(n('lvef')) ? '' : 'FEVG ' + P('lvef') + ' % (biplan), ' + r.efTxt + '. ') + (isNaN(n('gls')) ? '' : 'SLG −' + P('gls', 1) + ' %' + (n('gls') < 18 ? ' (diminué)' : '') + '. ') + 'Cinétique : ' + wm + '.');
  if(r.dia.txt) L.push('Fonction diastolique : ' + [!isNaN(r.ea) ? 'E/A ' + fmt(r.ea, 2) : '', !isNaN(r.eeavg) ? 'E/e′ moyen ' + fmt(r.eeavg, 1) : '', !isNaN(r.lavi) ? 'VOGi ' + fmt(r.lavi) + ' mL/m²' : '', !isNaN(n('trv')) ? 'Vmax IT ' + P('trv', 1) + ' m/s' : ''].filter(Boolean).join(', ') + '. ' + r.dia.txt + '.');
  if(!isNaN(r.lavi)) L.push('Oreillette gauche : ' + (r.lavi > 48 ? 'très dilatée' : r.lavi > 41 ? 'modérément dilatée' : r.lavi > 34 ? 'légèrement dilatée' : 'non dilatée') + ' (VOGi ' + fmt(r.lavi) + ' mL/m²).');
  var rvBad = n('tapse') < 17 || n('sprime') < 9.5;
  L.push('Ventricule droit : ' + (n('rvb') > 41 ? 'dilaté' : 'non dilaté') + (isNaN(n('rvb')) ? '' : ' (' + P('rvb') + ' mm)') + ', fonction systolique ' + (rvBad ? 'altérée' : 'conservée') + (isNaN(n('tapse')) ? '' : ' (TAPSE ' + P('tapse') + ' mm' + (isNaN(n('sprime')) ? '' : ', S′ ' + P('sprime', 1) + ' cm/s') + ')') + '.' +
    (isNaN(r.pasp) ? '' : ' PAPs estimée à ' + fmt(r.pasp) + ' mmHg (POD ' + r.rap + ' mmHg, VCI ' + P('ivc') + ' mm ' + (v.ivcc === 'y' ? 'compliante' : 'peu compliante') + ') ; probabilité échographique d’HTP ' + r.php + '.'));
  var valves = [r.as, r.mr, r.ar, r.ms].filter(function(x){ return x.sev; });
  L.push('Valves : ' + (valves.length ? valves.map(function(x){ return x.txt; }).join('. ') : 'pas de valvulopathie significative') + '.');
  if(r.as.note) L.push('  → ' + r.as.note + '.');
  if(!isNaN(n('root'))) L.push('Aorte : sinus de Valsalva ' + P('root') + ' mm' + (isNaN(n('asc')) ? '' : ', aorte ascendante ' + P('asc') + ' mm') + (n('root') > N.root[v.sex][1] || n('asc') > N.asc[v.sex][1] ? ' (dilatée).' : ' (non dilatée).'));
  L.push('Péricarde : ' + {0:'sec', 1:'épanchement minime', 2:'épanchement modéré', 3:'épanchement abondant'}[v.peri || '0'] + '.');
  L.push(''); L.push('CONCLUSION');
  var C = [];
  if(r.as.sev === 'sévère' || r.as.sev === 'modéré') C.push(r.as.txt);
  if(!isNaN(n('lvef')) && r.efTxt !== 'conservée') C.push('Dysfonction systolique VG ' + r.efTxt.replace('altérée', '') + '(FEVG ' + P('lvef') + ' %)');
  else if(!isNaN(n('lvef'))) C.push('FEVG ' + r.efTxt + ' (' + P('lvef') + ' %)' + (n('gls') < 18 ? ', SLG diminué' : ''));
  if(/Hyper/.test(r.geom)) C.push(r.geom);
  if(r.dia.grade && r.dia.grade !== '0' && r.dia.txt) C.push(r.dia.txt);
  if(r.mr.sev && r.mr.sev !== 'léger') C.push(r.mr.txt);
  if(r.ar.sev && r.ar.sev !== 'léger') C.push(r.ar.txt);
  if(r.ms.sev) C.push(r.ms.txt);
  if(rvBad) C.push('Dysfonction systolique VD');
  if(r.pasp > 35) C.push('PAPs estimée ' + fmt(r.pasp) + ' mmHg');
  if(!C.length) C.push('Échocardiographie normale');
  C.forEach(function(c){ L.push('• ' + c + '.'); });
  if(r.as.sev === 'sévère') L.push('\nRA sévère : évaluer les symptômes et discuter l’indication de remplacement valvulaire (TAVI ou chirurgie) en Heart Team.');
  return L.join('\n');
}
CS.$('#copy').innerHTML = CS.I.copy + 'Copier';
CS.$('#print').innerHTML = CS.I.print + 'Imprimer';
CS.$('#copy').addEventListener('click', function(){ CS.copy(CS.$('#report').textContent, 'Compte rendu copié'); });
CS.$('#print').addEventListener('click', function(){ window.print(); });
CS.init({title:'Compte rendu d’échocardiographie', cat:'Imagerie et mesures', refs:['Lang RM et al., JASE/EHJ-CVI 2015 (quantification des cavités)', 'Nagueh SF et al., JASE 2016 et 2025 (fonction diastolique)', 'ESC/EACTS 2021 – Valvulopathies', 'ESC/ERS 2022 – Hypertension pulmonaire']});
window.addEventListener('cs-doctor', update);
buildForm(); update();
})();
</script>
